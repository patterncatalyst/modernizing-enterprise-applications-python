<text x="660.0" y="30" font-size="14" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.27 -- the chassis is convention, not a framework feature: every box above is code someone wrote, not a dependency someone added</text>
<text x="40" y="720" font-size="11" fill="#555555" text-anchor="start">Config and logging are the floor every service shares identically; health, errors, and resilience are opt-in and partial by actual count, not by oversight.</text>
<text x="40" y="738" font-size="11" fill="#555555" text-anchor="start">No service imports a shared chassis package -- each file above is copied and adapted per service, the same convention repeated eight times.</text>
