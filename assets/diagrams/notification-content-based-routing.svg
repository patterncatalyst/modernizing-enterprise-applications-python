<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f3d"/></marker></defs>
<rect x="40" y="420" width="560" height="160" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="52" y="440" font-size="12" font-weight="700" fill="#1d1d1d">Content-based routing, generalized past a URL path</text>
<rect x="40" y="260" width="200" height="90" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="140.0" y="303.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Client</text>
<text x="140.0" y="320.0" font-size="11.5" fill="#555555" text-anchor="middle">(curl / Newman)</text>
<rect x="320" y="240" width="280" height="130" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="460.0" y="288.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Starlette strangler proxy :8888</text>
<text x="460.0" y="305.0" font-size="11.5" fill="#555555" text-anchor="middle">_select_backend(settings, path)</text>
<text x="460.0" y="320.0" font-size="11.5" fill="#555555" text-anchor="middle">operator config only, never</text>
<text x="460.0" y="335.0" font-size="11.5" fill="#555555" text-anchor="middle">anything on the request (SSRF guard)</text>
<rect x="720" y="40" width="300" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="870.0" y="80.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Django monolith :8000</text>
<text x="870.0" y="97.5" font-size="11.5" fill="#555555" text-anchor="middle">default -- everything not matched</text>
<text x="870.0" y="112.5" font-size="11.5" fill="#555555" text-anchor="middle">below (incl. checkout, inventory, ...)</text>
<rect x="720" y="260" width="300" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="870.0" y="300.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">review-service :8001</text>
<text x="870.0" y="317.5" font-size="11.5" fill="#555555" text-anchor="middle">path prefix /api/reviews*</text>
<text x="870.0" y="332.5" font-size="11.5" fill="#555555" text-anchor="middle">AND STRANGLER_REVIEW_ENABLED</text>
<rect x="720" y="480" width="300" height="100" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="870.0" y="520.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">notification-service :8002</text>
<text x="870.0" y="537.5" font-size="11.5" fill="#555555" text-anchor="middle">path prefix /api/notifications*</text>
<text x="870.0" y="552.5" font-size="11.5" fill="#555555" text-anchor="middle">AND STRANGLER_NOTIFICATION_ENABLED</text>
<path d="M240.0,305.0 L320.0,305.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="286.0" y="299.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">HTTP, any method</text>
<text x="286.0" y="299.0" font-size="11" fill="#555" text-anchor="middle">HTTP, any method</text>
<path d="M583.953488372093,240.0 L774.6511627906976,140.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="685.3023255813953" y="184.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">default</text>
<text x="685.3023255813953" y="184.0" font-size="11" fill="#555" text-anchor="middle">default</text>
<path d="M600.0,306.7073170731707 L720.0,308.1707317073171" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="666.0" y="301.4390243902439" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">path-prefix match</text>
<text x="666.0" y="301.4390243902439" font-size="11" fill="#555" text-anchor="middle">path-prefix match</text>
<path d="M578.4444444444445,370.0 L778.8888888888889,480.0" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<text x="684.6666666666667" y="419.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">path-prefix match (ch.17&#x27;s seam)</text>
<text x="684.6666666666667" y="419.0" font-size="11" fill="#2f5f3d" text-anchor="middle">path-prefix match (ch.17&#x27;s seam)</text>
<text x="640.0" y="30" font-size="18" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.16 -- one routing decision, generalized past a single URL-path predicate</text>
<text x="60" y="450" font-size="12" fill="#1d1d1d" text-anchor="start">Today, this proxy matches on PATH (request.url.path, the full path -- see ch.14&#x27;s</text>
<text x="60" y="470" font-size="12" fill="#1d1d1d" text-anchor="start">full-path-prefix lesson). The same _select_backend() shape generalizes to:</text>
<text x="76" y="495" font-size="12" fill="#64748b" text-anchor="start">- HEADER match -- e.g. route by X-Tenant-Id to a tenant-specific backend</text>
<text x="76" y="515" font-size="12" fill="#64748b" text-anchor="start">- PAYLOAD/content match -- e.g. route by order total or customer segment</text>
<text x="60" y="545" font-size="12" fill="#1d1d1d" text-anchor="start">The constraint that doesn&#x27;t generalize away: the predicate&#x27;s INPUTS stay</text>
<text x="60" y="565" font-size="12" fill="#1d1d1d" text-anchor="start">operator configuration, never caller-supplied data used to BUILD a target URL.</text>
</svg>