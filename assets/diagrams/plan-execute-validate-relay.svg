<text x="743.5" y="414.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">same model tier -- now adversarial, not self-vouching</text>
<text x="743.5" y="414.0" font-size="11" fill="#555" text-anchor="middle">same model tier -- now adversarial, not self-vouching</text>
<path d="M375.0,420 L375.0,320" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="800.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">the relay: Plan -&gt; Execute -&gt; Validate, gated by two human sign-offs</text>
<text x="800.0" y="56" font-size="12" fill="#555555" text-anchor="middle">Opus plans and, later, validates adversarially; Sonnet builds in between -- the tier that drafted the plan is the one that checks it was executed faithfully</text>
