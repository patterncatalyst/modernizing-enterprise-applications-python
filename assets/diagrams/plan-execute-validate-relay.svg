<text x="375.0" y="245.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Plan tier -- Opus</text>
<text x="375.0" y="262.5" font-size="11.5" fill="#555555" text-anchor="middle">reads Frame + manual recon,</text>
<text x="375.0" y="277.5" font-size="11.5" fill="#555555" text-anchor="middle">drafts the step plan</text>
<rect x="510" y="190" width="200" height="130" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="610.0" y="245.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Human gate 1</text>
<text x="610.0" y="262.5" font-size="11.5" fill="#555555" text-anchor="middle">plan approval --</text>
<text x="610.0" y="277.5" font-size="11.5" fill="#555555" text-anchor="middle">before any diff exists</text>
<rect x="730" y="190" width="230" height="130" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="845.0" y="245.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Execute tier -- Sonnet</text>
<text x="845.0" y="262.5" font-size="11.5" fill="#555555" text-anchor="middle">Generate: scaffolds FastAPI</text>
<text x="845.0" y="277.5" font-size="11.5" fill="#555555" text-anchor="middle">service + tests, runs them</text>
<rect x="980" y="190" width="240" height="130" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
