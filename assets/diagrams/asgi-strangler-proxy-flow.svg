<text x="490.0" y="750.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">THE TRAP: request.path_params[&quot;path&quot;] is route-relative, no leading slash --</text>
<text x="490.0" y="767.0" font-size="11.5" fill="#555555" text-anchor="middle">always match request.url.path (the FULL path), or a future prefix/sub-app mount silently stops matching</text>
