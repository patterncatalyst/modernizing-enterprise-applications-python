<text x="1260.0" y="390.0" font-size="11.5" fill="#555555" text-anchor="middle">buffer body for correct</text>
<text x="1260.0" y="405.0" font-size="11.5" fill="#555555" text-anchor="middle">Content-Length, httpx.send()</text>
