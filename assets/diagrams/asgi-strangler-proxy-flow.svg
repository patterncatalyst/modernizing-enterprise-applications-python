<text x="690.0" y="293.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">_select_backend(settings, path)</text>
<text x="690.0" y="310.0" font-size="11.5" fill="#555555" text-anchor="middle">matches request.url.path (FULL path)</text>
<text x="690.0" y="325.0" font-size="11.5" fill="#555555" text-anchor="middle">against 6 fixed prefixes</text>
<text x="690.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">no match -&gt; None</text>
