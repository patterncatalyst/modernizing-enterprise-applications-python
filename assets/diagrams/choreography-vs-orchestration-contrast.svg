<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f3d"/></marker></defs>
<rect x="20" y="60" width="620" height="660" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#1d1d1d">choreographed payment</text>
<rect x="680" y="60" width="620" height="660" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="692" y="80" font-size="12" font-weight="700" fill="#1d1d1d">orchestrated shipping</text>
<rect x="60" y="120" width="540" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="330.0" y="153.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">monolith: order.placed outbox</text>
<text x="330.0" y="170.0" font-size="11.5" fill="#555555" text-anchor="middle">(no knowledge of payment-service)</text>
<rect x="60" y="230" width="540" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="330.0" y="263.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">payment-service: reacts to order.placed,</text>
<text x="330.0" y="280.0" font-size="11.5" fill="#555555" text-anchor="middle">writes ITS OWN outbox</text>
<rect x="60" y="340" width="540" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="330.0" y="373.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">monolith order_saga_listener: reacts to</text>
<text x="330.0" y="390.0" font-size="11.5" fill="#555555" text-anchor="middle">payment.captured/declined</text>
<rect x="60" y="470" width="540" height="100" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="330.0" y="510.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">No box above knows the other two exist.</text>
<text x="330.0" y="527.5" font-size="11.5" fill="#555555" text-anchor="middle">The sequence EMERGES from three</text>
<text x="330.0" y="542.5" font-size="11.5" fill="#555555" text-anchor="middle">independent event subscriptions.</text>
<rect x="720" y="120" width="540" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="990.0" y="153.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">shipping-service consumer: reacts to</text>
<text x="990.0" y="170.0" font-size="11.5" fill="#555555" text-anchor="middle">payment.captured (the ONLY trigger)</text>
<rect x="720" y="230" width="540" height="90" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="990.0" y="265.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">orchestrator.advance()/compensate():</text>
<text x="990.0" y="282.5" font-size="11.5" fill="#555555" text-anchor="middle">ONE coordinator sequences enrich -&gt; dispatch -&gt;</text>
<text x="990.0" y="297.5" font-size="11.5" fill="#555555" text-anchor="middle">book_carrier -&gt; emit, AND decides to compensate</text>
<rect x="720" y="360" width="540" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="990.0" y="393.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">This same coordinator calls every step</text>
<text x="990.0" y="410.0" font-size="11.5" fill="#555555" text-anchor="middle">and owns the undo decision</text>
<rect x="720" y="470" width="540" height="100" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="990.0" y="510.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">The coordinator knows the whole sequence.</text>
<text x="990.0" y="527.5" font-size="11.5" fill="#555555" text-anchor="middle">A failure anywhere routes through ONE</text>
<text x="990.0" y="542.5" font-size="11.5" fill="#555555" text-anchor="middle">decision point, not three independent reactions.</text>
<path d="M330.0,190.0 L330.0,230.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="336.0" y="204.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">order.placed</text>
<text x="336.0" y="204.0" font-size="11" fill="#555" text-anchor="middle">order.placed</text>
<path d="M330.0,300.0 L330.0,340.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="336.0" y="314.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">payment.captured/declined</text>
<text x="336.0" y="314.0" font-size="11" fill="#555" text-anchor="middle">payment.captured/declined</text>
<path d="M990.0,190.0 L990.0,230.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M990.0,320.0 L990.0,360.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="996.0" y="334.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">one step at a time</text>
<text x="996.0" y="334.0" font-size="11" fill="#555" text-anchor="middle">one step at a time</text>
<path d="M990.0,430.0 L990.0,470.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="660.0" y="30" font-size="15" fill="#1d1d1d" text-anchor="middle" font-weight="700">The difference is where the &quot;what happens next&quot; decision lives -- not service count or topology shape</text>
<text x="40" y="740" font-size="11" fill="#555555" text-anchor="start">Both sagas compensate on failure; only the orchestrated one has a single box that can be pointed to as &quot;the decision-maker.&quot;</text>
</svg>