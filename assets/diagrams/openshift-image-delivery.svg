<text x="770.0" y="24" font-size="15" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.33 -- image delivery: podman build+push on the host, pulled in-cluster from the integrated registry</text>
<text x="60" y="624" font-size="11" fill="#555555" text-anchor="start">No in-cluster BuildConfig: 8 host-built Python images push faster and simpler than a Docker-strategy S2I build per service (rejected, _plans/r11-build-plan.md A.3).</text>
<text x="60" y="642" font-size="11" fill="#555555" text-anchor="start">On a cluster WITH Docker Hub egress, drop --mirror-infra and point values.yaml&#x27;s postgres.image / kafka.image at the upstream refs instead.</text>
