<text x="240" y="764" font-size="11" fill="#555555" text-anchor="start">Green boxes (strangler-proxy, order-service, inventory-service) are the 3 OTel-instrumented services -- app depth. All 8 get mesh breadth automatically via Envoy.</text>
<text x="240" y="782" font-size="11" fill="#555555" text-anchor="start">postgres, kafka, and the lgtm backend itself carry no sidecar.istio.io/inject label -- meshing their own TLS/plaintext would collide with the injected sidecar&#x27;s mTLS wrapping.</text>
<text x="240" y="800" font-size="11" fill="#555555" text-anchor="start">PeerAuthentication: default (STRICT, namespace-wide) + strangler-proxy-edge (PERMISSIVE, inbound only) -- deploy/k8s/istio/peer-authentication*.yaml.</text>
