<text x="660.0" y="32" font-size="18" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.18 -- shared data is the hardest coupling to break; the three postures this book builds, stacked</text>
<text x="50" y="760" font-size="11" fill="#555555" text-anchor="start">Panel A&#x27;s shared-schema reach is a named deferral, not an oversight. Panel B shows the clean case: owned from the first migration.</text>
<text x="50" y="778" font-size="11" fill="#555555" text-anchor="start">Panel C is the hybrid ch.19 builds: a synchronous gRPC seam plus a one-time, explicitly retired transaction-log backfill.</text>
