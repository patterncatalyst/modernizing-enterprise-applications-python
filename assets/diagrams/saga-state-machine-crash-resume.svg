<text x="660.0" y="16" font-size="15" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.24 -- a crash leaves the saga in a well-defined, resumable row; nothing is lost, nothing re-runs twice</text>
<text x="40" y="780" font-size="11" fill="#555555" text-anchor="start">The Java sibling&#x27;s Camel Saga EIP coordinator tracks step progress IN MEMORY -- a pod restart loses it with no documented resume path.</text>
<text x="40" y="798" font-size="11" fill="#555555" text-anchor="start">This saga persists status/step_index/context as a row, so resume is &quot;trivial&quot;: pick up where the row says, verified by test_crash_resume.py.</text>
