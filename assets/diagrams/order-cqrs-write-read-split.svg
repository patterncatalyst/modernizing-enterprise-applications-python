<rect x="1130" y="150" width="180" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1220.0" y="193.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">OutboxRelay</text>
<text x="1220.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">polls -&gt; Kafka</text>
<rect x="50" y="388" width="170" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="135.0" y="426.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">GET /api/orders</text>
<text x="135.0" y="443.0" font-size="11.5" fill="#555555" text-anchor="middle">or /{id}</text>
