<text x="710.0" y="443.0" font-size="11.5" fill="#555555" text-anchor="middle">ONE row per order</text>
<rect x="900" y="388" width="360" height="80" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
