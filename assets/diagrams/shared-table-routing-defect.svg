<text x="1080.0" y="563.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Fixed: buffered body, correct Content-Length</text>
<text x="1080.0" y="580.0" font-size="11.5" fill="#555555" text-anchor="middle">58/58 assertions green -- baseline, cutover, reverted</text>
