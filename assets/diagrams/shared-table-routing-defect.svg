<text x="720.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.07 -- the shared-table proof: why response shape alone couldn&#x27;t tell path A from path B</text>
<text x="720.0" y="56" font-size="12" fill="#555555" text-anchor="middle">Review&#x27;s r02 form still shares the monolith&#x27;s Postgres schema (DRQ-028) -- DB ownership is deferred to ch.18/19</text>
<text x="60" y="630" font-size="11" fill="#555555" text-anchor="start">A misrouted request and a correctly routed one can return similarly shaped bodies, because both read and write the same rows.</text>
<text x="780" y="630" font-size="11" fill="#555555" text-anchor="start">The in-process mock transport couldn&#x27;t see the real WSGI stack&#x27;s chunked-body handling --</text>
<text x="780" y="646" font-size="11" fill="#555555" text-anchor="start">only a real socket run against the real backend, checking the shared table, caught it.</text>
<text x="40" y="764" font-size="10" fill="#777777" text-anchor="start">Sourced from _plans/decisions.md (DRQ-026, DRQ-028) and examples/01-strangler-proxy/CUTOVER.md (&quot;A bug this cutover caught&quot;).</text>
