<text x="660.0" y="20" font-size="15" fill="#1d1d1d" text-anchor="middle" font-weight="700">AWAITING_SHIPMENT is a real intermediate status, and SHIPPING_FAILED now closes the refund gap an earlier step left open</text>
<text x="40" y="720" font-size="11" fill="#555555" text-anchor="start">Before the refund hop: a SHIP-FAIL order compensated inventory but left a captured payment stranded (documented, not silent).</text>
<text x="40" y="738" font-size="11" fill="#555555" text-anchor="start">After the refund hop: the SAME shipment.failed event that triggers the order&#x27;s SHIPPING_FAILED transition also drives CAPTURED -&gt; REFUNDED.</text>
