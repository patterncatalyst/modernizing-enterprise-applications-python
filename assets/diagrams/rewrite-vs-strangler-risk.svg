<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 640" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f3d"/></marker></defs>
<rect x="20" y="60" width="710" height="540" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#1d1d1d">BIG-BANG REWRITE -- risk concentrated, payoff late</text>
<rect x="770" y="60" width="710" height="540" rx="12" fill="#eaf4ec" stroke="#ddd"/>
<text x="782" y="80" font-size="12" font-weight="700" fill="#1d1d1d">STRANGLER FIG -- risk spread, payoff continuous</text>
<rect x="60" y="120" width="390" height="150" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="255.0" y="170.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Three bets, made at once</text>
<text x="255.0" y="187.5" font-size="11.5" fill="#555555" text-anchor="middle">1. team understood every old behavior</text>
<text x="255.0" y="202.5" font-size="11.5" fill="#555555" text-anchor="middle">2. new build outruns old-system decay</text>
<text x="255.0" y="217.5" font-size="11.5" fill="#555555" text-anchor="middle">3. business tolerates zero value for</text>
<text x="255.0" y="232.5" font-size="11.5" fill="#555555" text-anchor="middle">   quarters while nothing ships</text>
<rect x="60" y="320" width="390" height="110" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="255.0" y="365.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">One irreversible cutover</text>
<text x="255.0" y="382.5" font-size="11.5" fill="#555555" text-anchor="middle">not feature-complete = not shippable;</text>
<text x="255.0" y="397.5" font-size="11.5" fill="#555555" text-anchor="middle">nothing ships until everything does</text>
<rect x="60" y="480" width="390" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="255.0" y="520.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Payoff -- late, all-or-nothing</text>
<text x="255.0" y="537.5" font-size="11.5" fill="#555555" text-anchor="middle">any one of the three bets failing</text>
<text x="255.0" y="552.5" font-size="11.5" fill="#555555" text-anchor="middle">sinks the project</text>
<rect x="800" y="150" width="150" height="110" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="875.0" y="195.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Step 1</text>
<text x="875.0" y="212.5" font-size="11.5" fill="#555555" text-anchor="middle">review --</text>
<text x="875.0" y="227.5" font-size="11.5" fill="#555555" text-anchor="middle">ships behind a flag</text>
<rect x="968" y="150" width="150" height="110" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="1043.0" y="195.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Step 2</text>
<text x="1043.0" y="212.5" font-size="11.5" fill="#555555" text-anchor="middle">notification,</text>
<text x="1043.0" y="227.5" font-size="11.5" fill="#555555" text-anchor="middle">same pattern</text>
<rect x="1136" y="150" width="150" height="110" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="1211.0" y="195.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Step 3</text>
<text x="1211.0" y="212.5" font-size="11.5" fill="#555555" text-anchor="middle">inventory,</text>
<text x="1211.0" y="227.5" font-size="11.5" fill="#555555" text-anchor="middle">same pattern</text>
<rect x="1304" y="150" width="150" height="110" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="1379.0" y="195.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Step 4</text>
<text x="1379.0" y="212.5" font-size="11.5" fill="#555555" text-anchor="middle">payment, shipping,</text>
<text x="1379.0" y="227.5" font-size="11.5" fill="#555555" text-anchor="middle">order, gateway</text>
<rect x="800" y="360" width="654" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1127.0" y="398.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Reversible at every step</text>
<text x="1127.0" y="415.0" font-size="11.5" fill="#555555" text-anchor="middle">monolith and new service run side by</text>
<text x="1127.0" y="430.0" font-size="11.5" fill="#555555" text-anchor="middle">side -- pause, slow, or reverse any one</text>
<text x="1127.0" y="445.0" font-size="11.5" fill="#555555" text-anchor="middle">step without threatening the rest</text>
<rect x="800" y="500" width="654" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1127.0" y="538.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Payoff -- continuous</text>
<text x="1127.0" y="555.0" font-size="11.5" fill="#555555" text-anchor="middle">value ships at every step, not just the last one</text>
<path d="M255.0,270.0 L255.0,320.0" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<text x="261.0" y="289.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">all three must land</text>
<text x="261.0" y="289.0" font-size="11" fill="#2f5f3d" text-anchor="middle">all three must land</text>
<path d="M255.0,430.0 L255.0,480.0" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<text x="261.0" y="449.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">if it ships at all</text>
<text x="261.0" y="449.0" font-size="11" fill="#2f5f3d" text-anchor="middle">if it ships at all</text>
<path d="M950.0,205.0 L968.0,205.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M1118.0,205.0 L1136.0,205.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M1286.0,205.0 L1304.0,205.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M941.0,260.0 L1061.0,360.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M1065.0,260.0 L1105.0,360.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M1189.0,260.0 L1149.0,360.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M1313.0,260.0 L1193.0,360.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M1127.0,470.0 L1127.0,500.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="750.0" y="32" font-size="16" fill="#1d1d1d" text-anchor="middle" font-weight="700">same migration, two risk shapes: one irreversible bet versus many reversible steps</text>
<text x="1127.0" y="134" font-size="10.5" fill="#2f5f3d" text-anchor="middle">each step proven equivalent before the next one starts</text>
<text x="60" y="596" font-size="11" fill="#555555" text-anchor="start">A rewrite that is not yet feature-complete cannot be partially shipped --</text>
<text x="60" y="612" font-size="11" fill="#555555" text-anchor="start">the third bet failing is usually what kills the project.</text>
<text x="800" y="596" font-size="11" fill="#2f5f3d" text-anchor="start">Risk is distributed across many small, independently reversible steps</text>
<text x="800" y="612" font-size="11" fill="#2f5f3d" text-anchor="start">instead of concentrated into one irreversible moment at the end.</text>
<text x="20" y="626" font-size="10" fill="#777777" text-anchor="start">Sourced from _plans/build-plan.md (&quot;A. Approach&quot;) and examples/01-strangler-proxy/CUTOVER.md.</text>
</svg>