<text x="700.0" y="40" font-size="18" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.19 -- the proto IS the ACL: two distinct vocabularies meet only at the wire</text>
<text x="40" y="380" font-size="11" fill="#555555" text-anchor="start">Wire vocab (stock_keeping_unit/display_name/unit_price_cents/on_hand_qty) is distinct from domain vocab</text>
<text x="40" y="398" font-size="11" fill="#555555" text-anchor="start">(sku/name/priceCents/quantityOnHand) so each side&#x27;s translator does the mapping, instead of the shapes happening to agree.</text>
<text x="40" y="416" font-size="11" fill="#555555" text-anchor="start">ReserveReply/StockReply carry the reply back through the SAME two translators, in reverse -- the boundary is symmetric.</text>
