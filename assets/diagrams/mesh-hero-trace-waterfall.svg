<text x="740.0" y="30" font-size="15" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.30 -- the hero trace: mesh breadth (grey, Envoy) vs OTel depth (green, app SDK) -- illustrative span nesting, not captured timing</text>
<text x="40" y="58" font-size="11" fill="#555555" text-anchor="start">Real span IDs, durations, and the Tempo capture come from the user&#x27;s live run -- see the chapter&#x27;s verification footer, not this figure.</text>
<text x="40" y="900" font-size="11" fill="#555555" text-anchor="start">The async Kafka saga hops (order.placed -&gt; payment -&gt; shipping) are deliberately out of this trace: mesh-visible in Kiali, app-level-deferred (same posture as the Java sibling).</text>
<text x="40" y="918" font-size="11" fill="#555555" text-anchor="start">Grey = mesh span (Envoy sidecar, free on all 8 services). Green = app span (OTel SDK, only strangler-proxy / order-service / inventory-service). White = asyncpg child span.</text>
