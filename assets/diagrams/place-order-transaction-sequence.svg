<text x="840.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">_place_order_local: one transaction.atomic() spans five bounded contexts</text>
<text x="840.0" y="56" font-size="12" fill="#555555" text-anchor="middle">validate -&gt; reserve -&gt; persist -&gt; charge -&gt; confirm -&gt; dispatch -&gt; write outbox row -&gt; commit, in-process, one database</text>
<text x="40" y="654" font-size="10.5" fill="#555555" text-anchor="start">SMELL #2: this rollback-for-free behavior disappears the moment any one of these contexts gets its own database.</text>
<text x="40" y="684" font-size="10.5" fill="#555555" text-anchor="start">Sourced from examples/00-monolith/order/services.py::_place_order_local (the INVENTORY_MODE=local / PAYMENT_MODE=synchronous / SHIPPING_MODE=inprocess default path).</text>
