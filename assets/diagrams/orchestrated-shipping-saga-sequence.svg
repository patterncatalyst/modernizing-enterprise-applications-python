<text x="660.0" y="18" font-size="16" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.24 -- the orchestrated saga: ONE coordinator sequences every step and owns the compensation decision</text>
<text x="40" y="974" font-size="11" fill="#555555" text-anchor="start">enrich and book_carrier persist nothing of their own, so neither has a compensation entry -- only dispatch&#x27;s Shipment row needs undoing.</text>
<text x="40" y="992" font-size="11" fill="#555555" text-anchor="start">Compare ch.23&#x27;s choreographed-payment-saga-sequence: no box in this picture&#x27;s counterpart decides anything for another box.</text>
