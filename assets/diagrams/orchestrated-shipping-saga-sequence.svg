<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1020" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f3d"/></marker></defs>
<rect x="500" y="25" width="320" height="65" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="660.0" y="55.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Kafka: payment.captured</text>
<text x="660.0" y="72.5" font-size="11.5" fill="#555555" text-anchor="middle">(key = orderId)</text>
<rect x="470" y="115" width="380" height="75" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="660.0" y="150.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">service.handle_payment_captured:</text>
<text x="660.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">check-then-insert + uq_sagas_order_id</text>
<rect x="460" y="215" width="400" height="70" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="660.0" y="248.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">orchestrator.advance(saga_id)</text>
<text x="660.0" y="265.0" font-size="11.5" fill="#555555" text-anchor="middle">THE coordinator -- decides each next step</text>
<rect x="80" y="320" width="280" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="220.0" y="355.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Step 1: enrich</text>
<text x="220.0" y="372.5" font-size="11.5" fill="#555555" text-anchor="middle">GET monolith /api/orders/{id}</text>
<text x="220.0" y="387.5" font-size="11.5" fill="#555555" text-anchor="middle">tenacity retry + bounded timeout</text>
<rect x="400" y="320" width="280" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="540.0" y="355.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Step 2: dispatch</text>
<text x="540.0" y="372.5" font-size="11.5" fill="#555555" text-anchor="middle">persist Shipment DISPATCHED</text>
<text x="540.0" y="387.5" font-size="11.5" fill="#555555" text-anchor="middle">(own shipping schema)</text>
<rect x="720" y="320" width="280" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="860.0" y="355.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Step 3: book_carrier</text>
<text x="860.0" y="372.5" font-size="11.5" fill="#555555" text-anchor="middle">SHIP-FAIL sentinel check</text>
<text x="860.0" y="387.5" font-size="11.5" fill="#555555" text-anchor="middle">no persistence of its own</text>
<rect x="1040" y="320" width="240" height="90" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="1160.0" y="355.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Step 4: emit</text>
<text x="1160.0" y="372.5" font-size="11.5" fill="#555555" text-anchor="middle">shipment.dispatched outbox +</text>
<text x="1160.0" y="387.5" font-size="11.5" fill="#555555" text-anchor="middle">saga -&gt; COMPLETED, one txn</text>
<rect x="80" y="460" width="1200" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="680.0" y="490.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">each step above: ONE transaction, SELECT ... FOR UPDATE + idempotent status guard, step_index++ on success</text>
<rect x="720" y="560" width="280" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="860.0" y="593.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">BookCarrierFailed raised</text>
<text x="860.0" y="610.0" font-size="11.5" fill="#555555" text-anchor="middle">saga -&gt; COMPENSATING</text>
<rect x="400" y="660" width="320" height="70" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="560.0" y="693.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">compensate(): reverse order</text>
<text x="560.0" y="710.0" font-size="11.5" fill="#555555" text-anchor="middle">over only-COMPLETED steps</text>
<rect x="80" y="760" width="280" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="220.0" y="790.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">cancel_shipment</text>
<text x="220.0" y="807.5" font-size="11.5" fill="#555555" text-anchor="middle">(dispatch&#x27;s only inverse)</text>
<text x="220.0" y="822.5" font-size="11.5" fill="#555555" text-anchor="middle">Shipment -&gt; CANCELLED, not deleted</text>
<rect x="400" y="760" width="320" height="90" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="560.0" y="795.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">shipment.failed outbox write +</text>
<text x="560.0" y="812.5" font-size="11.5" fill="#555555" text-anchor="middle">saga -&gt; COMPENSATED, SAME txn</text>
<text x="560.0" y="827.5" font-size="11.5" fill="#555555" text-anchor="middle">reason: SHIP-FAIL sentinel</text>
<rect x="1040" y="460" width="240" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1160.0" y="493.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Kafka:</text>
<text x="1160.0" y="510.0" font-size="11.5" fill="#555555" text-anchor="middle">shipment.dispatched</text>
<rect x="400" y="890" width="320" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="560.0" y="923.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Kafka:</text>
<text x="560.0" y="940.0" font-size="11.5" fill="#555555" text-anchor="middle">shipment.failed</text>
