<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f3d"/></marker></defs>
<rect x="20" y="80" width="1260" height="230" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="100" font-size="12" font-weight="700" fill="#1d1d1d">Layer 1 -- automated: the Newman behavior-equivalence suite, over a real socket</text>
<rect x="20" y="330" width="1260" height="230" rx="12" fill="#eaf4ec" stroke="#ddd"/>
<text x="32" y="350" font-size="12" font-weight="700" fill="#1d1d1d">Layer 2 -- adversarial verification: check the shared table, not just the response shape</text>
<rect x="20" y="580" width="1260" height="230" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="600" font-size="12" font-weight="700" fill="#1d1d1d">Layer 3 -- human judgment: the two gates</text>
<rect x="60" y="150" width="520" height="120" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="320.0" y="200.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Newman suite, real WSGI backend, real socket</text>
<text x="320.0" y="217.5" font-size="11.5" fill="#555555" text-anchor="middle">re-run against every candidate build</text>
<text x="320.0" y="232.5" font-size="11.5" fill="#555555" text-anchor="middle">58/58 -- baseline, cutover, reverted (CUTOVER.md)</text>
<rect x="660" y="150" width="580" height="120" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="950.0" y="200.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Remove this layer:</text>
<text x="950.0" y="217.5" font-size="11.5" fill="#555555" text-anchor="middle">the chunked-body bug ships silently --</text>
<text x="950.0" y="232.5" font-size="11.5" fill="#555555" text-anchor="middle">every POST through the proxy arrives empty</text>
<rect x="60" y="400" width="520" height="120" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="320.0" y="450.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Ask a sharper question than &quot;does the</text>
<text x="320.0" y="467.5" font-size="11.5" fill="#555555" text-anchor="middle">suite pass&quot;: did the right row land</text>
<text x="320.0" y="482.5" font-size="11.5" fill="#555555" text-anchor="middle">in the shared reviews/auth_user table?</text>
<rect x="660" y="400" width="580" height="120" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="950.0" y="450.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Remove this layer:</text>
<text x="950.0" y="467.5" font-size="11.5" fill="#555555" text-anchor="middle">a shape-only green run hides which backend</text>
<text x="950.0" y="482.5" font-size="11.5" fill="#555555" text-anchor="middle">actually answered -- both share one table</text>
<rect x="60" y="650" width="290" height="120" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="205.0" y="700.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Gate 1 -- plan approval</text>
<text x="205.0" y="717.5" font-size="11.5" fill="#555555" text-anchor="middle">Plan phase</text>
<text x="205.0" y="732.5" font-size="11.5" fill="#555555" text-anchor="middle">a human commits before any diff exists</text>
<rect x="380" y="650" width="260" height="120" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="510.0" y="700.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Gate 2 -- equivalence sign-off</text>
<text x="510.0" y="717.5" font-size="11.5" fill="#555555" text-anchor="middle">Verify phase</text>
<text x="510.0" y="732.5" font-size="11.5" fill="#555555" text-anchor="middle">a human judges whether coverage fits the stakes</text>
<rect x="690" y="650" width="550" height="120" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="965.0" y="700.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Remove this layer:</text>
<text x="965.0" y="717.5" font-size="11.5" fill="#555555" text-anchor="middle">a green suite run is trusted as self-certifying --</text>
<text x="965.0" y="732.5" font-size="11.5" fill="#555555" text-anchor="middle">nobody asks what would make it pass by accident</text>
<path d="M580.0,210.0 L660.0,210.0" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<text x="626.0" y="135.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">catches: a real-socket defect no mock transport surfaces</text>
<text x="626.0" y="135.0" font-size="11" fill="#2f5f3d" text-anchor="middle">catches: a real-socket defect no mock transport surfaces</text>
<path d="M580.0,460.0 L660.0,460.0" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<text x="626.0" y="385.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">catches: shared state masking which backend answered</text>
<text x="626.0" y="385.0" font-size="11" fill="#2f5f3d" text-anchor="middle">catches: shared state masking which backend answered</text>
<path d="M350.0,710.0 L380.0,710.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M640.0,710.0 L690.0,710.0" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<text x="671.0" y="635.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">decides: is this coverage the right coverage?</text>
<text x="671.0" y="635.0" font-size="11" fill="#2f5f3d" text-anchor="middle">decides: is this coverage the right coverage?</text>
<path d="M320.0,270.0 L320.0,400.0" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="326.0" y="329.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">compensates for layer 1&#x27;s blind spot</text>
<text x="326.0" y="329.0" font-size="11" fill="#555" text-anchor="middle">compensates for layer 1&#x27;s blind spot</text>
<path d="M292.4,520.0 L232.6,650.0" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="268.5" y="579.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">judges whether layers 1+2&#x27;s coverage fit the stakes</text>
<text x="268.5" y="579.0" font-size="11" fill="#555" text-anchor="middle">judges whether layers 1+2&#x27;s coverage fit the stakes</text>
<text x="650.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">the safety net has three layers; removing any one lets a specific bug through</text>
<text x="650.0" y="56" font-size="12" fill="#555555" text-anchor="middle">the ADLC is not safe because an agent is careful -- it is safe because all three layers hold at once</text>
<text x="40" y="884" font-size="10" fill="#777777" text-anchor="start">Sourced from _plans/decisions.md and examples/01-strangler-proxy/CUTOVER.md.</text>
