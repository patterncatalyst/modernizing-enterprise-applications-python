<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 700" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f3d"/></marker></defs>
<rect x="20" y="50" width="1280" height="260" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="70" font-size="12" font-weight="700" fill="#1d1d1d">Layer 1 -- saga-level: status-transition guard (defense-in-depth, client side)</text>
<rect x="20" y="346" width="1280" height="280" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="32" y="366" font-size="12" font-weight="700" fill="#1d1d1d">Layer 2 -- ledger-level: inventory.compensations (the actual arbiter, server side)</text>
<rect x="60" y="130" width="260" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="190.0" y="183.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">payment.declined</text>
<text x="190.0" y="200.0" font-size="11.5" fill="#555555" text-anchor="middle">redelivered (same orderId)</text>
<rect x="360" y="130" width="280" height="110" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="500.0" y="175.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">_is_pending(order)</text>
<text x="500.0" y="192.5" font-size="11.5" fill="#555555" text-anchor="middle">status already PAYMENT_DECLINED</text>
<text x="500.0" y="207.5" font-size="11.5" fill="#555555" text-anchor="middle">-&gt; logged no-op, RETURN</text>
<rect x="700" y="130" width="280" height="110" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="840.0" y="183.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">No second Release call</text>
<text x="840.0" y="200.0" font-size="11.5" fill="#555555" text-anchor="middle">issued at all</text>
<rect x="60" y="386" width="280" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="200.0" y="431.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">gRPC Release(sku, qty,</text>
<text x="200.0" y="448.5" font-size="11.5" fill="#555555" text-anchor="middle">idempotency_key=</text>
<text x="200.0" y="463.5" font-size="11.5" fill="#555555" text-anchor="middle">&quot;{orderId}:{sku}:release&quot;)</text>
<rect x="400" y="386" width="340" height="110" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="570.0" y="431.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">INSERT INTO compensations</text>
<text x="570.0" y="448.5" font-size="11.5" fill="#555555" text-anchor="middle">ON CONFLICT(idempotency_key)</text>
<text x="570.0" y="463.5" font-size="11.5" fill="#555555" text-anchor="middle">DO NOTHING RETURNING id</text>
<rect x="800" y="326" width="220" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="910.0" y="369.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">row returned</text>
<text x="910.0" y="386.0" font-size="11.5" fill="#555555" text-anchor="middle">-&gt; apply +qty UPDATE</text>
<rect x="800" y="446" width="220" height="90" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="910.0" y="489.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">no row (conflict)</text>
<text x="910.0" y="506.0" font-size="11.5" fill="#555555" text-anchor="middle">-&gt; no-op, same reply</text>
<path d="M320.0,185.0 L360.0,185.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M640.0,185.0 L700.0,185.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M340.0,441.0 L400.0,441.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M740.0,406.0 L800.0,393.6470588235294" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="776.0" y="393.8235294117647" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">first call for this key</text>
<text x="776.0" y="393.8235294117647" font-size="11" fill="#555" text-anchor="middle">first call for this key</text>
<path d="M740.0,466.0 L800.0,474.8235294117647" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="776.0" y="464.4117647058823" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">replayed key</text>
<text x="776.0" y="464.4117647058823" font-size="11" fill="#555" text-anchor="middle">replayed key</text>
<text x="660.0" y="28" font-size="16" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.23 -- DRQ-043 closed: a compensation survives redelivery at the event layer AND the RPC layer</text>
<text x="40" y="654" font-size="11" fill="#555555" text-anchor="start">Proven live: on_hand_qty held at 94 across a hand-redelivered payment.declined event AND two direct,</text>
<text x="40" y="672" font-size="11" fill="#555555" text-anchor="start">identical-key gRPC Release calls that bypassed the saga guard entirely -- the ledger is the real backstop.</text>
</svg>