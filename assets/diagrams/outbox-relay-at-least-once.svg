<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 760" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f3d"/></marker></defs>
<rect x="20" y="56" width="1320" height="230" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="76" font-size="12" font-weight="700" fill="#1d1d1d">The bridge: one transaction, state change + outbox row, same commit</text>
<rect x="20" y="316" width="1320" height="150" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="32" y="336" font-size="12" font-weight="700" fill="#1d1d1d">The relay: polls unpublished rows, publishes, THEN stamps published_at -- at-least-once</text>
<rect x="20" y="496" width="1320" height="230" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="516" font-size="12" font-weight="700" fill="#1d1d1d">The necessary counterpart: an idempotent consumer, in whichever idiom fits the write</text>
<rect x="50" y="130" width="210" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="155.0" y="183.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Handle the request</text>
<text x="155.0" y="200.0" font-size="11.5" fill="#555555" text-anchor="middle">(checkout, order.placed, ...)</text>
<rect x="300" y="110" width="290" height="150" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="445.0" y="175.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ONE DB transaction</text>
<text x="445.0" y="192.5" font-size="11.5" fill="#555555" text-anchor="middle">state row (Order/Payment) +</text>
<text x="445.0" y="207.5" font-size="11.5" fill="#555555" text-anchor="middle">outbox row -- same COMMIT</text>
<rect x="640" y="130" width="180" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="730.0" y="175.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Postgres</text>
<text x="730.0" y="192.5" font-size="11.5" fill="#555555" text-anchor="middle">outbox table</text>
<text x="730.0" y="207.5" font-size="11.5" fill="#555555" text-anchor="middle">published_at IS NULL</text>
<rect x="850" y="130" width="210" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="955.0" y="175.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Relay polls</text>
<text x="955.0" y="192.5" font-size="11.5" fill="#555555" text-anchor="middle">oldest unpublished rows</text>
<text x="955.0" y="207.5" font-size="11.5" fill="#555555" text-anchor="middle">every poll_ms</text>
<rect x="70" y="351" width="260" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="200.0" y="389.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">AIOKafkaProducer</text>
<text x="200.0" y="406.0" font-size="11.5" fill="#555555" text-anchor="middle">send_and_wait(topic, key, value)</text>
<rect x="400" y="351" width="260" height="80" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="530.0" y="381.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Kafka topic</text>
<text x="530.0" y="398.5" font-size="11.5" fill="#555555" text-anchor="middle">order.placed / payment.captured /</text>
<text x="530.0" y="413.5" font-size="11.5" fill="#555555" text-anchor="middle">payment.declined -- key=aggregateId</text>
<rect x="730" y="351" width="280" height="80" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="870.0" y="381.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">mark published_at</text>
<text x="870.0" y="398.5" font-size="11.5" fill="#555555" text-anchor="middle">(crash here -&gt; row stays</text>
<text x="870.0" y="413.5" font-size="11.5" fill="#555555" text-anchor="middle">unpublished -&gt; republished)</text>
<rect x="50" y="536" width="300" height="130" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="200.0" y="591.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">check-then-insert + unique index</text>
<text x="200.0" y="608.5" font-size="11.5" fill="#555555" text-anchor="middle">(notification-service: dedupe by</text>
<text x="200.0" y="623.5" font-size="11.5" fill="#555555" text-anchor="middle">order_id; a redelivery is a no-op)</text>
<rect x="400" y="536" width="300" height="130" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="550.0" y="591.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">INSERT ... ON CONFLICT upsert</text>
<text x="550.0" y="608.5" font-size="11.5" fill="#555555" text-anchor="middle">(inventory CDC consumer: same</text>
<text x="550.0" y="623.5" font-size="11.5" fill="#555555" text-anchor="middle">end state applied once or twice)</text>
<rect x="750" y="536" width="300" height="130" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="900.0" y="591.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">status-transition guard</text>
<text x="900.0" y="608.5" font-size="11.5" fill="#555555" text-anchor="middle">(order_saga_listener: an order</text>
<text x="900.0" y="623.5" font-size="11.5" fill="#555555" text-anchor="middle">that already left PENDING no-ops)</text>
<rect x="1100" y="556" width="200" height="90" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="1200.0" y="591.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Exactly-once EFFECT</text>
<text x="1200.0" y="608.5" font-size="11.5" fill="#555555" text-anchor="middle">from an at-least-once</text>
<text x="1200.0" y="623.5" font-size="11.5" fill="#555555" text-anchor="middle">delivery</text>
<path d="M260.0,185.0 L300.0,185.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M590.0,185.0 L640.0,185.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M820,180 L850,180" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="841.0" y="174.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">reads</text>
<text x="841.0" y="174.0" font-size="11" fill="#555" text-anchor="middle">reads</text>
<path d="M850.0,213.64900662251657 L330.0,355.5298013245033" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M330.0,391.0 L400.0,391.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M660.0,391.0 L730.0,391.0" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="701.0" y="385.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">after ack</text>
<text x="701.0" y="385.0" font-size="11" fill="#555" text-anchor="middle">after ack</text>
<path d="M860,391 L860,526" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="866.0" y="452.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">a consumer somewhere on this topic</text>
<text x="866.0" y="452.5" font-size="11" fill="#555" text-anchor="middle">a consumer somewhere on this topic</text>
<path d="M350.0,601.0 L1100.0,601.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M700.0,601.0 L1100.0,601.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M1050.0,601.0 L1100.0,601.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="680.0" y="30" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.20 -- the outbox done right: one bridge, three idempotent-consumer idioms this book has already shipped</text>
<text x="40" y="714" font-size="11" fill="#555555" text-anchor="start">At-least-once is a promise about the PIPE, not the effect -- the relay can republish, the broker can redeliver.</text>
<text x="40" y="732" font-size="11" fill="#555555" text-anchor="start">Idempotency at the consumer is what makes redelivery safe; which idiom fits depends on what kind of write it is.</text>
</svg>