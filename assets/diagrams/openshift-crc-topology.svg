<text x="770.0" y="24" font-size="15" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.33 -- the mea project on OpenShift Local: three SCC postures, two Routes as the only edge</text>
<text x="240" y="764" font-size="11" fill="#555555" text-anchor="start">restricted-v2 (8 app Deployments, no runAsUser) / nonroot-v2 (postgres, kafka via SA mea-infra) / anyuid+runAsUser:0 (otel-lgtm only) -- DRQ-107.</text>
<text x="240" y="782" font-size="11" fill="#555555" text-anchor="start">strangler-proxy and graphql-gateway are the only externally reachable workloads -- every other Service stays ClusterIP-only.</text>
<text x="240" y="800" font-size="11" fill="#555555" text-anchor="start">Images are pulled in-cluster from the integrated registry (Figure 33.2); when mesh.enabled, Route traffic needs the PERMISSIVE carve-out (Figure 33.3).</text>
