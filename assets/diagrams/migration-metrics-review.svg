<text x="1280" y="214.0" font-size="11.5" fill="#2f5f3d" text-anchor="start">16/16 green</text>
<text x="40" y="262" font-size="12.5" fill="#2f5f3d" text-anchor="start" font-weight="700">statistically indistinguishable: 0.32-0.35 s vs 0.35-0.36 s, within run-to-run noise</text>
<text x="40" y="362.0" font-size="12" fill="#1d1d1d" text-anchor="start" font-weight="700">Phase A -- Django-ORM bridge (proxy measurement, never shipped)</text>
