<text x="40" y="732" font-size="10" fill="#777777" text-anchor="start">Sourced from examples/02-review-service/MIGRATION.md&#x27;s measured table. This stack has no compiled-vs-native-image axis to show a dramatic win on -- the honest finding is reported as measured, not adjusted for a cleaner story.</text>
