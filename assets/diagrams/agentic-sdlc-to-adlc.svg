<text x="135.0" y="145.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1. Express intent</text>
<text x="135.0" y="162.0" font-size="11.5" fill="#555555" text-anchor="middle">(Minutes)</text>
<rect x="240" y="110" width="190" height="74" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="335.0" y="145.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">2. Agent understands</text>
<text x="335.0" y="162.0" font-size="11.5" fill="#555555" text-anchor="middle">(Seconds)</text>
