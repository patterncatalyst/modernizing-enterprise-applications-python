<text x="1335.0" y="162.0" font-size="11.5" fill="#555555" text-anchor="middle">(Continuous)</text>
<rect x="1440" y="110" width="190" height="74" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
