<text x="650.0" y="365.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Generate</text>
<text x="650.0" y="382.0" font-size="11.5" fill="#555555" text-anchor="middle">Sonnet: scaffold + code + tests</text>
<rect x="850" y="330" width="170" height="74" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="935.0" y="365.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Verify</text>
<text x="935.0" y="382.0" font-size="11.5" fill="#555555" text-anchor="middle">Opus: pytest/Newman + scan</text>
<rect x="1100" y="330" width="270" height="74" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1235.0" y="365.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Operate</text>
<text x="1235.0" y="382.0" font-size="11.5" fill="#555555" text-anchor="middle">flagged rollout + LGTM</text>
<rect x="1450" y="330" width="170" height="74" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1535.0" y="365.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Reconcile</text>
<text x="1535.0" y="382.0" font-size="11.5" fill="#555555" text-anchor="middle">ledger + drift record</text>
<rect x="330" y="235" width="220" height="40" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="440.0" y="260.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">GATE: plan approval</text>
