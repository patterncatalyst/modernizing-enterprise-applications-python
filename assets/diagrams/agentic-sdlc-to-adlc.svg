<rect x="640" y="110" width="190" height="74" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="735.0" y="145.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">4. Agent tests + docs</text>
<text x="735.0" y="162.0" font-size="11.5" fill="#555555" text-anchor="middle">(Minutes)</text>
<rect x="840" y="110" width="190" height="74" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="935.0" y="145.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">5. Human review</text>
<text x="935.0" y="162.0" font-size="11.5" fill="#555555" text-anchor="middle">(Min-Hours)</text>
<rect x="1040" y="110" width="190" height="74" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="1135.0" y="145.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">6. Deploy &amp; ship</text>
