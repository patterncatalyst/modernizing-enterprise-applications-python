<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f3d"/></marker></defs>
<rect x="610" y="230" width="280" height="160" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="750.0" y="300.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Domain core</text>
<text x="750.0" y="317.5" font-size="11.5" fill="#555555" text-anchor="middle">entities, aggregates, business logic</text>
<text x="750.0" y="332.5" font-size="11.5" fill="#555555" text-anchor="middle">no web framework, no ORM, no message broker</text>
<rect x="380" y="260" width="190" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="475.0" y="300.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Inbound port(s)</text>
<text x="475.0" y="317.5" font-size="11.5" fill="#555555" text-anchor="middle">what the core can be asked to do</text>
<text x="475.0" y="332.5" font-size="11.5" fill="#555555" text-anchor="middle">e.g. create_review(), place_order()</text>
<rect x="950" y="260" width="190" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1045.0" y="300.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Outbound port(s)</text>
<text x="1045.0" y="317.5" font-size="11.5" fill="#555555" text-anchor="middle">what the core needs from the world</text>
<text x="1045.0" y="332.5" font-size="11.5" fill="#555555" text-anchor="middle">e.g. get_by_sku(), persist()</text>
<rect x="50" y="90" width="260" height="110" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="180.0" y="135.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">REST route</text>
<text x="180.0" y="152.5" font-size="11.5" fill="#555555" text-anchor="middle">e.g. app/routes.py (ch.11 excerpt)</text>
<text x="180.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">translates an HTTP request into a port call</text>
<rect x="50" y="255" width="260" height="110" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="180.0" y="300.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">gRPC service</text>
<text x="180.0" y="317.5" font-size="11.5" fill="#555555" text-anchor="middle">translates an incoming RPC into a port call</text>
<text x="180.0" y="332.5" font-size="11.5" fill="#555555" text-anchor="middle">e.g. order/inventory_client.py&#x27;s ACL (ch.19)</text>
<rect x="50" y="420" width="260" height="110" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="180.0" y="465.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Message consumer</text>
<text x="180.0" y="482.5" font-size="11.5" fill="#555555" text-anchor="middle">translates an incoming broker message</text>
<text x="180.0" y="497.5" font-size="11.5" fill="#555555" text-anchor="middle">e.g. order_placed_consumer.py (ch.17)</text>
<rect x="1190" y="160" width="260" height="130" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="1320.0" y="215.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Database repository module</text>
<text x="1320.0" y="232.5" font-size="11.5" fill="#555555" text-anchor="middle">e.g. app/repository.py (ch.11 excerpt)</text>
<text x="1320.0" y="247.5" font-size="11.5" fill="#555555" text-anchor="middle">implements the outbound port</text>
<rect x="1190" y="360" width="260" height="130" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="1320.0" y="415.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Event publisher</text>
<text x="1320.0" y="432.5" font-size="11.5" fill="#555555" text-anchor="middle">implements the outbound port</text>
<text x="1320.0" y="447.5" font-size="11.5" fill="#555555" text-anchor="middle">the core declared</text>
<path d="M278.3333333333333,200.0 L385.6060606060606,260.0" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<path d="M310.0,310.0 L380.0,310.0" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<path d="M278.3333333333333,420.0 L385.6060606060606,360.0" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<path d="M570.0,310.0 L610.0,310.0" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<text x="596.0" y="440.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">dependency points inward -- adapters are swappable</text>
<text x="596.0" y="440.0" font-size="11" fill="#2f5f3d" text-anchor="middle">dependency points inward -- adapters are swappable</text>
<path d="M1190.0,265.1818181818182 L1140.0,280.6363636363636" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<path d="M1190.0,370.6363636363636 L1140.0,349.72727272727275" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<path d="M950.0,310.0 L890.0,310.0" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<text x="926.0" y="440.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">core declares the port; the adapter implements it</text>
<text x="926.0" y="440.0" font-size="11" fill="#2f5f3d" text-anchor="middle">core declares the port; the adapter implements it</text>
<text x="750.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.11 -- Hexagonal architecture: ports and adapters, dependencies pointing inward</text>
<text x="750.0" y="56" font-size="11.5" fill="#555555" text-anchor="middle">driving adapters translate a protocol into an inbound-port call; driven adapters implement the outbound port the core declared</text>
<text x="750.0" y="216" font-size="10.5" fill="#3d7a4e" text-anchor="middle">the core never imports a protocol -- a protocol can be swapped without the core noticing</text>
<text x="40" y="560" font-size="10.5" fill="#555555" text-anchor="start">Caveat (this chapter&#x27;s own): examples/02-review-service&#x27;s app/repository.py is a module of plain async functions, not a declared</text>
<text x="40" y="574" font-size="10.5" fill="#555555" text-anchor="start">Port abstraction the core programs against -- what made review cheap to extract was zero outbound edges to other contexts.</text>
<text x="40" y="604" font-size="10" fill="#777777" text-anchor="start">Sourced from examples/02-review-service/app/routes.py + app/repository.py, examples/00-monolith/order/inventory_client.py + notification/management/commands/order_placed_consumer.py.</text>
</svg>