<text x="630.0" y="420.0" font-size="11.5" fill="#555555" text-anchor="middle">order_id FK</text>
<text x="630.0" y="435.0" font-size="11.5" fill="#555555" text-anchor="middle">amount_cents, method, status</text>
<rect x="760" y="330" width="220" height="150" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="870.0" y="388.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">shipments</text>
<text x="870.0" y="405.0" font-size="11.5" fill="#555555" text-anchor="middle">id PK</text>
<text x="870.0" y="420.0" font-size="11.5" fill="#555555" text-anchor="middle">order_id FK</text>
<text x="870.0" y="435.0" font-size="11.5" fill="#555555" text-anchor="middle">address, status</text>
<rect x="1000" y="330" width="220" height="150" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
