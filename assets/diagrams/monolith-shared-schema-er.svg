<text x="1030.0" y="165.0" font-size="11.5" fill="#555555" text-anchor="middle">sku, name, price_cents</text>
<text x="1030.0" y="180.0" font-size="11.5" fill="#555555" text-anchor="middle">quantity_on_hand, updated_at</text>
