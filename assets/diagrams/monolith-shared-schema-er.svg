<rect x="20" y="70" width="1460" height="660" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="90" font-size="12" font-weight="700" fill="#1d1d1d">PostgreSQL: one shared schema (per-app Django migrations)</text>
