<text x="390.0" y="420.0" font-size="11.5" fill="#555555" text-anchor="middle">order_id FK</text>
<text x="390.0" y="435.0" font-size="11.5" fill="#555555" text-anchor="middle">sku, item_name, quantity, unit_price_cents (snapshot, no FK)</text>
