<text x="150.0" y="420.0" font-size="11.5" fill="#555555" text-anchor="middle">customer_id FK</text>
<text x="150.0" y="435.0" font-size="11.5" fill="#555555" text-anchor="middle">status, total_cents, shipping_address</text>
<rect x="280" y="330" width="220" height="150" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
