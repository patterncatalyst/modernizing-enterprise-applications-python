<text x="1110.0" y="405.0" font-size="11.5" fill="#555555" text-anchor="middle">id PK</text>
<text x="1110.0" y="420.0" font-size="11.5" fill="#555555" text-anchor="middle">customer_id FK, order_id FK (nullable)</text>
<text x="1110.0" y="435.0" font-size="11.5" fill="#555555" text-anchor="middle">channel, message</text>
<rect x="1240" y="330" width="220" height="150" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1350.0" y="388.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">reviews</text>
<text x="1350.0" y="405.0" font-size="11.5" fill="#555555" text-anchor="middle">id PK</text>
<text x="1350.0" y="420.0" font-size="11.5" fill="#555555" text-anchor="middle">customer_id FK, inventory_item_id FK</text>
<text x="1350.0" y="435.0" font-size="11.5" fill="#555555" text-anchor="middle">rating, comment</text>
