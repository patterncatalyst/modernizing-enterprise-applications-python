<text x="430.0" y="140.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">customers (shared kernel)</text>
<text x="430.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">id PK</text>
<text x="430.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">name, email, created_at</text>
