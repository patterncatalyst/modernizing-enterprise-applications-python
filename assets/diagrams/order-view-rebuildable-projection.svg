<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f3d"/></marker></defs>
<rect x="20" y="56" width="1260" height="200" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="76" font-size="12" font-weight="700" fill="#1d1d1d">NORMAL PATH -- every write upserts order_view in the SAME transaction</text>
<rect x="20" y="288" width="1260" height="220" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="32" y="308" font-size="12" font-weight="700" fill="#1d1d1d">WHAT PROVES IT&#x27;S REBUILDABLE, NOT A SECOND SOURCE OF TRUTH</text>
<rect x="60" y="110" width="260" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="190.0" y="150.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">orders / order_items</text>
<text x="190.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">the write aggregate</text>
<text x="190.0" y="182.5" font-size="11.5" fill="#555555" text-anchor="middle">(status, totals, items)</text>
<rect x="400" y="110" width="260" height="100" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="530.0" y="150.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">_upsert_order_view()</text>
<text x="530.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">runs inside the caller&#x27;s</text>
<text x="530.0" y="182.5" font-size="11.5" fill="#555555" text-anchor="middle">own transaction</text>
<rect x="740" y="110" width="260" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="870.0" y="150.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order_view</text>
<text x="870.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">ONE row, replaced wholesale</text>
<text x="870.0" y="182.5" font-size="11.5" fill="#555555" text-anchor="middle">never appended to</text>
<rect x="1040" y="110" width="220" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1150.0" y="158.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">GET /api/orders/{id}</text>
<text x="1150.0" y="175.0" font-size="11.5" fill="#555555" text-anchor="middle">reads THIS, only this</text>
<rect x="60" y="338" width="280" height="110" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="200.0" y="376.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">rebuild_order_view(order_id)</text>
<text x="200.0" y="393.0" font-size="11.5" fill="#555555" text-anchor="middle">recomputes order_view from the</text>
<text x="200.0" y="408.0" font-size="11.5" fill="#555555" text-anchor="middle">CURRENT aggregate -- a cache,</text>
<text x="200.0" y="423.0" font-size="11.5" fill="#555555" text-anchor="middle">not a parallel source of truth</text>
<rect x="400" y="338" width="300" height="110" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="550.0" y="383.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Negative test: skip the upsert</text>
<text x="550.0" y="400.5" font-size="11.5" fill="#555555" text-anchor="middle">on one transition -- aggregate</text>
<text x="550.0" y="415.5" font-size="11.5" fill="#555555" text-anchor="middle">still reaches CONFIRMED correctly</text>
<rect x="760" y="338" width="290" height="110" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="905.0" y="383.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">GET keeps returning PENDING --</text>
<text x="905.0" y="400.5" font-size="11.5" fill="#555555" text-anchor="middle">bounded-wait poll exhausts</text>
<text x="905.0" y="415.5" font-size="11.5" fill="#555555" text-anchor="middle">its full 40x750ms budget, RED</text>
<rect x="1100" y="338" width="160" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1180.0" y="383.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Restore the</text>
<text x="1180.0" y="400.5" font-size="11.5" fill="#555555" text-anchor="middle">upsert -&gt;</text>
<text x="1180.0" y="415.5" font-size="11.5" fill="#555555" text-anchor="middle">GREEN again</text>
<path d="M320.0,160.0 L400.0,160.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M660.0,160.0 L740.0,160.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M1000.0,160.0 L1040.0,160.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M192.1459227467811,210.0 L197.63948497854076,338.0" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="200.89270386266094" y="268.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">repairable at any time</text>
<text x="200.89270386266094" y="268.0" font-size="11" fill="#555" text-anchor="middle">repairable at any time</text>
<path d="M700.0,393.0 L760.0,393.0" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<text x="736.0" y="387.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">proves reads are view-only</text>
<text x="736.0" y="387.0" font-size="11" fill="#2f5f3d" text-anchor="middle">proves reads are view-only</text>
<path d="M1050.0,393.0 L1100.0,393.0" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="650.0" y="30" font-size="15" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.21 -- a rebuildable read model: the projection-disabled negative is the proof the read path never falls back to the aggregate</text>
<text x="40" y="536" font-size="11" fill="#555555" text-anchor="start">This is CQRS-lite, not event sourcing: order_view is derived from current rows, not replayed from an event log -- see ch.21&#x27;s scoping section.</text>
</svg>