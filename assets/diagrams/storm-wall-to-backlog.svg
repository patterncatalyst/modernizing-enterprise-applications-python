<path d="M570.0,607.0 L640.0,607.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M860.0,607.0 L930.0,607.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="800.0" y="32" font-size="18" fill="#1d1d1d" text-anchor="middle" font-weight="700">From the storm wall to the extraction backlog</text>
<text x="800.0" y="58" font-size="12" fill="#555555" text-anchor="middle">every boundary this chapter&#x27;s wall finds, mapped to the chapter that cuts it and the mechanism it uses</text>
<text x="50" y="134" font-size="12.5" fill="#1d1d1d" text-anchor="start" font-weight="700">Event boundary (the storm wall)</text>
<text x="640" y="134" font-size="12.5" fill="#1d1d1d" text-anchor="start" font-weight="700">Extraction chapter</text>
<text x="930" y="134" font-size="12.5" fill="#1d1d1d" text-anchor="start" font-weight="700">Mechanism</text>
<text x="50" y="812" font-size="10.5" fill="#555555" text-anchor="start">The anti-corruption layer is the precondition at every row above: an event can&#x27;t carry contract-shaped data until the ACL exists at that seam.</text>
<text x="50" y="830" font-size="10.5" fill="#555555" text-anchor="start">This wall answers *where* to cut; *in what order* is the coupling-analysis question, not this figure&#x27;s.</text>
<text x="50" y="884" font-size="10" fill="#777777" text-anchor="start">Sourced from examples/00-monolith/order/services.py and the extraction examples (02-review-service through 07-order-service).</text>
</svg>