<text x="310.0" y="203.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">OrderPlaced -&gt; StockReserved</text>
<text x="310.0" y="220.0" font-size="11.5" fill="#555555" text-anchor="middle">inventory&#x27;s seam</text>
<rect x="640" y="150" width="220" height="110" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="750.0" y="210.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Inventory</text>
<rect x="930" y="150" width="620" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1240.0" y="203.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">gRPC proto-as-ACL + CDC backfill</text>
<text x="1240.0" y="220.0" font-size="11.5" fill="#555555" text-anchor="middle">atomic conditional-UPDATE reserve, compensating release</text>
<rect x="50" y="284" width="520" height="110" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="310.0" y="337.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">StockReserved -&gt; PaymentCaptured / PaymentDeclined</text>
<text x="310.0" y="354.0" font-size="11.5" fill="#555555" text-anchor="middle">payment&#x27;s seam</text>
<rect x="640" y="284" width="220" height="110" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="750.0" y="344.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Payment</text>
<rect x="930" y="284" width="620" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1240.0" y="337.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Choreographed saga</text>
<text x="1240.0" y="354.0" font-size="11.5" fill="#555555" text-anchor="middle">an aiokafka consumer reacting to order.placed, emitting payment.captured/declined</text>
<rect x="50" y="418" width="520" height="110" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="310.0" y="471.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">PaymentCaptured -&gt; ShipmentDispatched</text>
<text x="310.0" y="488.0" font-size="11.5" fill="#555555" text-anchor="middle">shipping&#x27;s seam</text>
<rect x="640" y="418" width="220" height="110" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="750.0" y="478.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Shipping</text>
<rect x="930" y="418" width="620" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1240.0" y="471.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Orchestrated saga</text>
<text x="1240.0" y="488.0" font-size="11.5" fill="#555555" text-anchor="middle">a single FastAPI saga coordinator sequences dispatch, not peer-to-peer events</text>
<rect x="50" y="552" width="520" height="110" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="310.0" y="605.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ShipmentDispatched -&gt; OrderConfirmed / NotificationSent</text>
<text x="310.0" y="622.0" font-size="11.5" fill="#555555" text-anchor="middle">notification&#x27;s seam -- cut first</text>
<rect x="640" y="552" width="220" height="110" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="750.0" y="612.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Notification</text>
<rect x="930" y="552" width="620" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1240.0" y="605.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Transactional outbox</text>
<text x="1240.0" y="622.0" font-size="11.5" fill="#555555" text-anchor="middle">feeding an asynchronous aiokafka consumer</text>
<rect x="50" y="696" width="810" height="90" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="455.0" y="739.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order/services.py::place_order() itself -- cut last</text>
<text x="455.0" y="756.0" font-size="11.5" fill="#555555" text-anchor="middle">issues every policy&#x27;s command above; waits until all four boundaries already fire events</text>
