<text x="1040.0" y="330.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">PAYMENT_DECLINED</text>
<text x="1040.0" y="347.5" font-size="11.5" fill="#555555" text-anchor="middle">payment.declined</text>
