<text x="1026.0" y="274.0" font-size="11" fill="#555" text-anchor="middle">redelivery -&gt; guard -&gt; no-op</text>
<text x="630.0" y="20" font-size="16" fill="#1d1d1d" text-anchor="middle" font-weight="700">PENDING has exactly three terminal exits, each idempotent against redelivery</text>
<text x="40" y="600" font-size="11" fill="#555555" text-anchor="start">&quot;stuck PENDING&quot; is not a fourth terminal state -- it&#x27;s the real failure mode of a dead consumer, caught by a</text>
<text x="40" y="618" font-size="11" fill="#555555" text-anchor="start">bounded-wait poll that fails strictly (20x750ms, 15.1s, newman exit 1) rather than waiting forever or lying green.</text>
