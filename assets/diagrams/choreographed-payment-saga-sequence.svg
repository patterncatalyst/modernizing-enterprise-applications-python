<text x="650.0" y="300.0" font-size="11.5" fill="#555555" text-anchor="middle">(key = orderId)</text>
<rect x="460" y="350" width="380" height="90" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
