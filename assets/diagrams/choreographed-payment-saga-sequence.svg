<text x="650.0" y="20" font-size="16" fill="#1d1d1d" text-anchor="middle" font-weight="700">the choreographed saga: every arrow is an event one side reacted to, nothing is called synchronously</text>
<text x="40" y="920" font-size="11" fill="#555555" text-anchor="start">No orchestrator box exists in this picture -- compare the orchestrated shipping step, where one does.</text>
<text x="40" y="938" font-size="11" fill="#555555" text-anchor="start">Every reaction is idempotent (status guard / order_id uniqueness), so Kafka&#x27;s at-least-once redelivery is safe here.</text>
