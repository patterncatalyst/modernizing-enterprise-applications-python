<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f3d"/></marker></defs>
<rect x="100" y="180" width="520" height="220" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="360.0" y="280.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Run B -- reversibility baseline</text>
<text x="360.0" y="297.5" font-size="11.5" fill="#555555" text-anchor="middle">INVENTORY_MODE=local, STRANGLER_INVENTORY_ENABLED unset</text>
<text x="360.0" y="312.5" font-size="11.5" fill="#555555" text-anchor="middle">71/71 assertions green, byte-identical to Run A</text>
<rect x="680" y="180" width="520" height="220" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="940.0" y="280.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Split (local reserve, service-served reads)</text>
<text x="940.0" y="297.5" font-size="11.5" fill="#555555" text-anchor="middle">sound only mid-transition, CDC-backfilled</text>
<text x="940.0" y="312.5" font-size="11.5" fill="#555555" text-anchor="middle">not exercised as a steady state</text>
<rect x="100" y="440" width="520" height="220" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="360.0" y="540.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Split (remote reserve, monolith-served reads)</text>
<text x="360.0" y="557.5" font-size="11.5" fill="#555555" text-anchor="middle">sound only mid-transition, CDC-backfilled</text>
<text x="360.0" y="572.5" font-size="11.5" fill="#555555" text-anchor="middle">not exercised as a steady state</text>
<rect x="680" y="440" width="520" height="220" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="940.0" y="540.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Run A -- fully cut over</text>
<text x="940.0" y="557.5" font-size="11.5" fill="#555555" text-anchor="middle">INVENTORY_MODE=grpc, STRANGLER_INVENTORY_ENABLED=true</text>
<text x="940.0" y="572.5" font-size="11.5" fill="#555555" text-anchor="middle">71/71 green; net-zero stock proven, Scenarios 3 &amp; 4</text>
<text x="650.0" y="32" font-size="18" fill="#1d1d1d" text-anchor="middle" font-weight="700">two independent cutover dimensions, locked together in this book&#x27;s exercised runs</text>
<text x="360" y="150" font-size="13" fill="#1d1d1d" text-anchor="middle" font-weight="700">STRANGLER_INVENTORY_ENABLED=false/unset</text>
<text x="940" y="150" font-size="13" fill="#1d1d1d" text-anchor="middle" font-weight="700">STRANGLER_INVENTORY_ENABLED=true</text>
<text x="60" y="270" font-size="13" fill="#1d1d1d" text-anchor="middle" font-weight="700">INVENTORY_MODE</text>
<text x="60" y="290" font-size="13" fill="#1d1d1d" text-anchor="middle" font-weight="700">=local</text>
<text x="60" y="530" font-size="13" fill="#1d1d1d" text-anchor="middle" font-weight="700">INVENTORY_MODE</text>
<text x="60" y="550" font-size="13" fill="#1d1d1d" text-anchor="middle" font-weight="700">=grpc</text>
<text x="40" y="720" font-size="11" fill="#555555" text-anchor="start">Checkout-time reserve/release and GET /api/inventory* reads are controlled by different flags in different processes --</text>
<text x="40" y="738" font-size="11" fill="#555555" text-anchor="start">flipping one does not require flipping the other, and in a real rollout they land at different times.</text>
</svg>