<text x="730.0" y="30" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.08 -- The reference monolith (before): six bounded contexts, one deployable, one shared schema</text>
<text x="730.0" y="56" font-size="12" fill="#555555" text-anchor="middle">one DRF REST API surface, documented by drf-spectacular&#x27;s OpenAPI schema</text>
<text x="1420" y="420" font-size="10.5" fill="#555555" text-anchor="end">SMELL #2: place_order() wraps inventory + order + payment + shipment + the outbox write in ONE transaction.atomic() spanning five contexts (ACID -&gt; ACD).</text>
<text x="40" y="598" font-size="10.5" fill="#555555" text-anchor="start">SMELL #4: FK joins cross bounded-context boundaries freely inside the one shared schema -- orders-&gt;customers, payments/shipments/notifications-&gt;orders, reviews-&gt;customers+inventory_items.</text>
<text x="40" y="614" font-size="10.5" fill="#555555" text-anchor="start">common.Customer is a shared-kernel entity (not its own bounded context) FK&#x27;d directly from order, notification, and review.</text>
<text x="1260.0" y="95" font-size="11.5" fill="#3d7a4e" text-anchor="middle" font-weight="700">review: first context extracted (ch.15)</text>
<text x="1260.0" y="323" font-size="9.5" fill="#555555" text-anchor="middle">SMELL #7: REST-only, no runtime collaborator -- yet governed by the</text>
<text x="1260.0" y="335" font-size="9.5" fill="#555555" text-anchor="middle">monolith&#x27;s one shared django.contrib.auth table alongside every other context.</text>
<text x="40" y="744" font-size="10.5" fill="#555555" text-anchor="start">Sourced from examples/00-monolith/SMELLS.md and order/services.py::place_order (reference for the smell numbers and the outbox cure, r03).</text>
