<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 760" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f3d"/></marker></defs>
<rect x="20" y="56" width="1300" height="260" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="76" font-size="12" font-weight="700" fill="#1d1d1d">BEFORE -- PAYMENT_MODE=synchronous: ACID, one atomic() spans everything</text>
<rect x="20" y="352" width="1300" height="340" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="32" y="372" font-size="12" font-weight="700" fill="#1d1d1d">AFTER -- PAYMENT_MODE=choreographed: ACD kept for a smaller scope, Isolation traded away for the gap outside it</text>
<rect x="60" y="130" width="1200" height="150" rx="12" fill="#eef2ff" stroke="#ddd"/>
<text x="72" y="150" font-size="12" font-weight="700" fill="#1d1d1d">transaction.atomic() -- Atomicity + Consistency + Isolation + Durability</text>
<rect x="60" y="422" width="480" height="140" rx="12" fill="#eef2ff" stroke="#ddd"/>
<text x="72" y="442" font-size="12" font-weight="700" fill="#1d1d1d">transaction.atomic() -- A+C+D kept, smaller scope</text>
<rect x="90" y="170" width="220" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="200.0" y="213.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Order row</text>
<text x="200.0" y="230.0" font-size="11.5" fill="#555555" text-anchor="middle">(CONFIRMED on commit)</text>
<rect x="340" y="170" width="220" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="450.0" y="213.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Charge payment</text>
<text x="450.0" y="230.0" font-size="11.5" fill="#555555" text-anchor="middle">(decline rolls back all)</text>
<rect x="590" y="170" width="220" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="700.0" y="213.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Dispatch shipping</text>
<text x="700.0" y="230.0" font-size="11.5" fill="#555555" text-anchor="middle">(fail rolls back all)</text>
<rect x="840" y="170" width="220" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="950.0" y="213.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Outbox row</text>
<text x="950.0" y="230.0" font-size="11.5" fill="#555555" text-anchor="middle">confirmationMessage=&quot;confirmed&quot;</text>
<rect x="1090" y="170" width="150" height="90" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1165.0" y="213.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Nobody sees a</text>
<text x="1165.0" y="230.0" font-size="11.5" fill="#555555" text-anchor="middle">partial order</text>
<rect x="90" y="462" width="190" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="185.0" y="500.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Order row</text>
<text x="185.0" y="517.0" font-size="11.5" fill="#555555" text-anchor="middle">status=PENDING</text>
<rect x="320" y="462" width="190" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="415.0" y="500.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Outbox row</text>
<text x="415.0" y="517.0" font-size="11.5" fill="#555555" text-anchor="middle">+paymentMethod</text>
<rect x="580" y="442" width="340" height="130" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="750.0" y="490.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ISOLATION GONE HERE:</text>
<text x="750.0" y="507.0" font-size="11.5" fill="#555555" text-anchor="middle">PENDING is visible, queryable, REAL --</text>
<text x="750.0" y="522.0" font-size="11.5" fill="#555555" text-anchor="middle">other transactions see it before payment</text>
<text x="750.0" y="537.0" font-size="11.5" fill="#555555" text-anchor="middle">or shipping have an opinion</text>
<rect x="970" y="442" width="310" height="130" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="1125.0" y="497.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">payment + shipping resolve</text>
<text x="1125.0" y="514.5" font-size="11.5" fill="#555555" text-anchor="middle">OUTSIDE any local transaction,</text>
<text x="1125.0" y="529.5" font-size="11.5" fill="#555555" text-anchor="middle">asynchronously, via the saga</text>
<path d="M310.0,215.0 L340.0,215.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M560.0,215.0 L590.0,215.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M810.0,215.0 L840.0,215.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M1060.0,215.0 L1090.0,215.0" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M280.0,502.0 L320.0,502.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M510.0,503.4179104477612 L580.0,504.46268656716416" fill="none" stroke="#2f5f3d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="551.0" y="497.94029850746267" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">the window this opens</text>
<text x="551.0" y="497.94029850746267" font-size="11" fill="#2f5f3d" text-anchor="middle">the window this opens</text>
<path d="M920.0,507.0 L970.0,507.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="670.0" y="30" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">ACID -&gt; ACD: Atomicity, Consistency, Durability survive the cut; Isolation does not</text>
<text x="40" y="714" font-size="11" fill="#555555" text-anchor="start">This is not a bug introduced by the extraction -- it&#x27;s the real cost of a saga replacing a single shared</text>
<text x="40" y="732" font-size="11" fill="#555555" text-anchor="start">write-ahead log; compensation (explicit Release/decline handling) is what rebuilds consistency across the gap.</text>
</svg>