<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1120" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f3d"/></marker></defs>
<rect x="50" y="100" width="330" height="120" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="215.0" y="158.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1. Content coupling (worst)</text>
<text x="215.0" y="175.0" font-size="11.5" fill="#555555" text-anchor="middle">reaches inside, reads/writes internals directly</text>
<rect x="410" y="100" width="620" height="120" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="720.0" y="143.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Monolith example -- SMELL #1</text>
<text x="720.0" y="160.0" font-size="11.5" fill="#555555" text-anchor="middle">_place_order_local reads a live InventoryItem</text>
<text x="720.0" y="175.0" font-size="11.5" fill="#555555" text-anchor="middle">(sku, name, price_cents) from get_by_sku()/reserve()</text>
<text x="720.0" y="190.0" font-size="11.5" fill="#555555" text-anchor="middle">no ACL at the seam, only Python&#x27;s lack of access modifiers</text>
<rect x="50" y="236" width="330" height="120" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="215.0" y="294.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">2. Common coupling</text>
<text x="215.0" y="311.0" font-size="11.5" fill="#555555" text-anchor="middle">shares one global/shared data store</text>
<rect x="410" y="236" width="620" height="120" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="720.0" y="286.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Monolith example -- SMELL #3</text>
<text x="720.0" y="303.5" font-size="11.5" fill="#555555" text-anchor="middle">order, inventory, payment, shipping, notification +</text>
<text x="720.0" y="318.5" font-size="11.5" fill="#555555" text-anchor="middle">customers: one shared Postgres schema, no owner</text>
<rect x="50" y="372" width="330" height="120" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="215.0" y="430.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">3. Control coupling</text>
<text x="215.0" y="447.0" font-size="11.5" fill="#555555" text-anchor="middle">passes a flag that dictates the callee&#x27;s branching</text>
<rect x="410" y="372" width="620" height="120" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="720.0" y="422.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Monolith example</text>
<text x="720.0" y="439.5" font-size="11.5" fill="#555555" text-anchor="middle">OrderCreateSerializer.paymentMethod threaded into</text>
<text x="720.0" y="454.5" font-size="11.5" fill="#555555" text-anchor="middle">payment.services.charge -- DECLINE_SENTINEL selects approve/decline</text>
<rect x="50" y="508" width="330" height="120" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="215.0" y="566.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">4. Stamp coupling</text>
<text x="215.0" y="583.0" font-size="11.5" fill="#555555" text-anchor="middle">passes a whole structure, receiver uses part</text>
<rect x="410" y="508" width="620" height="120" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="720.0" y="558.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Monolith example</text>
<text x="720.0" y="575.5" font-size="11.5" fill="#555555" text-anchor="middle">_place_order_local&#x27;s loop gets the full InventoryItem back</text>
<text x="720.0" y="590.5" font-size="11.5" fill="#555555" text-anchor="middle">from get_by_sku()/reserve(), reads 3 of its 5 fields</text>
<rect x="50" y="644" width="330" height="120" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="215.0" y="702.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">5. Data coupling</text>
<text x="215.0" y="719.0" font-size="11.5" fill="#555555" text-anchor="middle">passes only simple, purpose-built parameters</text>
<rect x="410" y="644" width="620" height="120" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="720.0" y="694.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Monolith example -- already done right</text>
<text x="720.0" y="711.5" font-size="11.5" fill="#555555" text-anchor="middle">InventoryListView.get() / order/views.py return</text>
<text x="720.0" y="726.5" font-size="11.5" fill="#555555" text-anchor="middle">InventoryItemSerializer/OrderSerializer output, not raw models</text>
<rect x="50" y="780" width="330" height="120" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="215.0" y="838.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">6. Message coupling</text>
<text x="215.0" y="855.0" font-size="11.5" fill="#555555" text-anchor="middle">interaction only through message passing</text>
<rect x="410" y="780" width="620" height="120" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="720.0" y="830.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">No monolith example</text>
<text x="720.0" y="847.5" font-size="11.5" fill="#555555" text-anchor="middle">target architecture after extraction --</text>
<text x="720.0" y="862.5" font-size="11.5" fill="#555555" text-anchor="middle">interaction only through message passing (examples/02-07)</text>
<rect x="50" y="916" width="330" height="120" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="215.0" y="974.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">7. API / data-structure coupling (best)</text>
<text x="215.0" y="991.0" font-size="11.5" fill="#555555" text-anchor="middle">well-defined contract at the boundary</text>
<rect x="410" y="916" width="620" height="120" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="720.0" y="966.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">No monolith example</text>
<text x="720.0" y="983.5" font-size="11.5" fill="#555555" text-anchor="middle">target architecture after extraction --</text>
<text x="720.0" y="998.5" font-size="11.5" fill="#555555" text-anchor="middle">well-defined contract types at the boundary (examples/02-07)</text>
<path d="M380.0,160.0 L410.0,160.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M380.0,296.0 L410.0,296.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M380.0,432.0 L410.0,432.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M380.0,568.0 L410.0,568.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M380.0,704.0 L410.0,704.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M380.0,840.0 L410.0,840.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M380.0,976.0 L410.0,976.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M215.0,220.0 L215.0,236.0" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<text x="221.0" y="222.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">Constantine&#x27;s ladder: worst to best</text>
<text x="221.0" y="222.0" font-size="11" fill="#2f5f3d" text-anchor="middle">Constantine&#x27;s ladder: worst to best</text>
<path d="M215.0,356.0 L215.0,372.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M215.0,492.0 L215.0,508.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M215.0,628.0 L215.0,644.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M215.0,764.0 L215.0,780.0" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<text x="221.0" y="766.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">no monolith example beyond this point</text>
<text x="221.0" y="766.0" font-size="11" fill="#2f5f3d" text-anchor="middle">no monolith example beyond this point</text>
<path d="M215.0,900.0 L215.0,916.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="550.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">the Constantine coupling ladder, scored against the monolith</text>
<text x="550.0" y="56" font-size="12" fill="#555555" text-anchor="middle">worst (content) at top, best (API/data-structure) at bottom -- five of seven rungs already have a live example</text>
<text x="50" y="1080" font-size="10.5" fill="#555555" text-anchor="start">Message and API/data-structure coupling have no monolith example today -- they&#x27;re what the extracted services (examples/02-07) already reach.</text>
<text x="50" y="1104" font-size="10.5" fill="#555555" text-anchor="start">Sourced from examples/00-monolith/SMELLS.md (smells #1 and #3), order/services.py, payment/services.py, inventory/views.py, order/views.py.</text>
</svg>