<text x="650.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">Six bounded contexts, one deployable: apps, not services</text>
<text x="650.0" y="56" font-size="12" fill="#555555" text-anchor="middle">no process boundary, no network hop, no per-context database: the opposite of what the extractions build</text>
<text x="40" y="514" font-size="10.5" fill="#555555" text-anchor="start">every context reads and writes the SAME schema directly: no context owns its tables exclusively (detail in monolith-shared-schema-er).</text>
<text x="40" y="544" font-size="10.5" fill="#555555" text-anchor="start">Sourced from examples/00-monolith/ (app layout: order/, inventory/, payment/, shipping/, notification/, review/, common/, config/).</text>
