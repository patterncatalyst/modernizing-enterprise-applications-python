<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f3d"/></marker></defs>
<rect x="30" y="60" width="1220" height="230" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="42" y="80" font-size="12" font-weight="700" fill="#1d1d1d">BEFORE -- PAYMENT_MODE=synchronous: one round trip, one terminal answer</text>
<rect x="30" y="330" width="1220" height="230" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="42" y="350" font-size="12" font-weight="700" fill="#1d1d1d">AFTER -- PAYMENT_MODE=choreographed: one round trip, a PROMISE -- the terminal answer comes later</text>
<rect x="70" y="150" width="200" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="170.0" y="210.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">POST /api/orders</text>
<rect x="320" y="150" width="320" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="480.0" y="195.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">reserve + order + charge +</text>
<text x="480.0" y="212.5" font-size="11.5" fill="#555555" text-anchor="middle">confirm + ship + outbox,</text>
<text x="480.0" y="227.5" font-size="11.5" fill="#555555" text-anchor="middle">ONE local transaction</text>
<rect x="700" y="150" width="420" height="110" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="910.0" y="195.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">201 CONFIRMED | 402 DECLINED |</text>
<text x="910.0" y="212.5" font-size="11.5" fill="#555555" text-anchor="middle">422 SHIP-FAILED | 409 OUT_OF_STOCK</text>
<text x="910.0" y="227.5" font-size="11.5" fill="#555555" text-anchor="middle">-- terminal, SAME response</text>
<rect x="70" y="420" width="200" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="170.0" y="480.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">POST /api/orders</text>
<rect x="320" y="420" width="320" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="480.0" y="465.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">reserve + order + outbox,</text>
<text x="480.0" y="482.5" font-size="11.5" fill="#555555" text-anchor="middle">ONE local transaction --</text>
<text x="480.0" y="497.5" font-size="11.5" fill="#555555" text-anchor="middle">NO charge, NO ship here</text>
<rect x="700" y="420" width="220" height="110" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="810.0" y="473.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">202 PENDING</text>
<text x="810.0" y="490.0" font-size="11.5" fill="#555555" text-anchor="middle">(or still-sync 409)</text>
<rect x="970" y="420" width="220" height="110" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1080.0" y="465.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">...later, async...</text>
<text x="1080.0" y="482.5" font-size="11.5" fill="#555555" text-anchor="middle">GET /api/orders/{id}</text>
<text x="1080.0" y="497.5" font-size="11.5" fill="#555555" text-anchor="middle">to find out</text>
<path d="M270.0,205.0 L320.0,205.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M640.0,205.0 L700.0,205.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M270.0,475.0 L320.0,475.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M640.0,475.0 L700.0,475.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M920.0,475.0 L970.0,475.0" fill="none" stroke="#2f5f3d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="951.0" y="469.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">caller must poll</text>
<text x="951.0" y="469.0" font-size="11" fill="#2f5f3d" text-anchor="middle">caller must poll</text>
<text x="640.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">the contract change: 202 is a PROMISE, not a faster 201</text>
<text x="50" y="580" font-size="11" fill="#555555" text-anchor="start">A dishonest cutover would keep returning 201 and just lie about the status; the equivalence suite is taught to poll</text>
<text x="50" y="598" font-size="11" fill="#555555" text-anchor="start">GET /api/orders/{id} to a bounded terminal status instead, so a stuck PENDING order fails the gate, not passes it.</text>
</svg>