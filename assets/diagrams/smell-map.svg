<text x="770.0" y="347.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">9 tables, cross-context FKs</text>
<rect x="30" y="500" width="200" height="190" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="130.0" y="585.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#1 God checkout function</text>
<text x="130.0" y="602.5" font-size="11.5" fill="#555555" text-anchor="middle">order/services.py::place_order() reaches directly into inventory/payment/shipping&#x27;s services/models</text>
<text x="130.0" y="617.5" font-size="11.5" fill="#555555" text-anchor="middle">cures: ch.26 (hardest, last)</text>
<rect x="244" y="500" width="200" height="190" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="344.0" y="585.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#2 One ACID txn, five contexts</text>
<text x="344.0" y="602.5" font-size="11.5" fill="#555555" text-anchor="middle">_place_order_local&#x27;s transaction.atomic(): free rollback across order+inventory+payment+shipping+outbox</text>
<text x="344.0" y="617.5" font-size="11.5" fill="#555555" text-anchor="middle">cures: ch.22 (ACID-&gt;ACD), ch.23/24 (sagas)</text>
<rect x="458" y="500" width="200" height="190" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="558.0" y="585.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#3 Shared single schema/DB</text>
<text x="558.0" y="602.5" font-size="11.5" fill="#555555" text-anchor="middle">config/settings.py: one Postgres schema, one set of Django migrations, all six apps deploy together</text>
<text x="558.0" y="617.5" font-size="11.5" fill="#555555" text-anchor="middle">cures: ch.18 (owned data)</text>
<rect x="672" y="500" width="200" height="190" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="772.0" y="585.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#4 Cross-context FKs</text>
<text x="772.0" y="602.5" font-size="11.5" fill="#555555" text-anchor="middle">orders-&gt;customers, payments/shipments/notifications-&gt;orders, reviews-&gt;customers+inventory_items</text>
<text x="772.0" y="617.5" font-size="11.5" fill="#555555" text-anchor="middle">cures: ch.18, ch.19 (CDC)</text>
<rect x="886" y="500" width="200" height="190" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="986.0" y="585.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#5 Sync notification: CURED</text>
<text x="986.0" y="602.5" font-size="11.5" fill="#555555" text-anchor="middle">place_order() used to call notification/services.py in-process; now it only writes an OutboxEvent row</text>
<text x="986.0" y="617.5" font-size="11.5" fill="#555555" text-anchor="middle">ch.17: cured at r03</text>
<rect x="1100" y="500" width="200" height="190" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="1200.0" y="585.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#6 Dual-write hazard: CURED</text>
<text x="1200.0" y="602.5" font-size="11.5" fill="#555555" text-anchor="middle">DB row + provider call were two independent writes; outbox_relay now publishes at-least-once</text>
<text x="1200.0" y="617.5" font-size="11.5" fill="#555555" text-anchor="middle">ch.17: cured at r03</text>
<rect x="1314" y="500" width="200" height="190" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="1414.0" y="585.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#7 Review tangled in shared auth</text>
<text x="1414.0" y="602.5" font-size="11.5" fill="#555555" text-anchor="middle">review/views.py gates POST with HTTP Basic auth against the shared django.contrib.auth table</text>
<text x="1414.0" y="617.5" font-size="11.5" fill="#555555" text-anchor="middle">cures: ch.15: review&#x27;s own auth config</text>
