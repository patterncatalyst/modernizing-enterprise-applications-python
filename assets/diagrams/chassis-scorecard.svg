<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 900" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f3d"/></marker></defs>
<rect x="20" y="50" width="1180" height="190" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="32" y="70" font-size="12" font-weight="700" fill="#1d1d1d">USED -- every service, proven by real code</text>
<rect x="20" y="270" width="1180" height="260" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="290" font-size="12" font-weight="700" fill="#1d1d1d">PARTIAL -- real, but not universal or not consumed</text>
<rect x="20" y="560" width="1180" height="300" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="580" font-size="12" font-weight="700" fill="#1d1d1d">DEFERRED -- named, not built</text>
<rect x="50" y="95" width="350" height="110" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="225.0" y="140.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Config: frozen dataclass + from_env()</text>
<text x="225.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">7 of 8 (02-review-service still reads</text>
<text x="225.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">os.environ.get directly in db.py)</text>
<rect x="430" y="95" width="350" height="110" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="605.0" y="140.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Logging: stdlib logging to</text>
<text x="605.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">logs/&lt;service&gt;.log via RotatingFileHandler</text>
<text x="605.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">8 of 8, identical shape</text>
<rect x="810" y="95" width="350" height="110" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="985.0" y="140.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Containerfile</text>
<text x="985.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">8 of 8 -- every service ships one</text>
<text x="985.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">verified by directory listing</text>
<rect x="50" y="315" width="350" height="120" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="225.0" y="358.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Health: GET /health</text>
<text x="225.0" y="375.0" font-size="11.5" fill="#555555" text-anchor="middle">6 of 8 (absent: 01-strangler-proxy,</text>
<text x="225.0" y="390.0" font-size="11.5" fill="#555555" text-anchor="middle">02-review-service) -- liveness only,</text>
<text x="225.0" y="405.0" font-size="11.5" fill="#555555" text-anchor="middle">no downstream probed anywhere</text>
<rect x="430" y="315" width="350" height="120" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="605.0" y="358.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Errors: errors.py uniform mapping</text>
<text x="605.0" y="375.0" font-size="11.5" fill="#555555" text-anchor="middle">6 of 8 (absent: 01-strangler-proxy,</text>
<text x="605.0" y="390.0" font-size="11.5" fill="#555555" text-anchor="middle">08-graphql-gateway -- proxy passes</text>
<text x="605.0" y="405.0" font-size="11.5" fill="#555555" text-anchor="middle">status through, GraphQL has its own)</text>
<rect x="810" y="315" width="350" height="120" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="985.0" y="358.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Resilience: tenacity retry</text>
<text x="985.0" y="375.0" font-size="11.5" fill="#555555" text-anchor="middle">1 of 8 -- 06-shipping-service&#x27;s</text>
<text x="985.0" y="390.0" font-size="11.5" fill="#555555" text-anchor="middle">enrich_client.py ONLY; the system&#x27;s</text>
<text x="985.0" y="405.0" font-size="11.5" fill="#555555" text-anchor="middle">one outbound HTTP call site</text>
<rect x="50" y="605" width="350" height="130" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="225.0" y="653.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Metrics / OTel</text>
<text x="225.0" y="670.0" font-size="11.5" fill="#555555" text-anchor="middle">no opentelemetry or prometheus import</text>
<text x="225.0" y="685.0" font-size="11.5" fill="#555555" text-anchor="middle">anywhere under examples/*/app/</text>
<text x="225.0" y="700.0" font-size="11.5" fill="#555555" text-anchor="middle">ch.30 adds OTel to 3 services</text>
<rect x="430" y="605" width="350" height="130" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="605.0" y="653.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">pybreaker / bulkhead</text>
<text x="605.0" y="670.0" font-size="11.5" fill="#555555" text-anchor="middle">no circuit breaker, no concurrency cap</text>
<text x="605.0" y="685.0" font-size="11.5" fill="#555555" text-anchor="middle">named in build-plan prose, zero</text>
<text x="605.0" y="700.0" font-size="11.5" fill="#555555" text-anchor="middle">lines of code anywhere</text>
<rect x="810" y="605" width="350" height="130" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="985.0" y="653.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">A true shared chassis library</text>
<text x="985.0" y="670.0" font-size="11.5" fill="#555555" text-anchor="middle">each config.py/errors.py/main.py is</text>
<text x="985.0" y="685.0" font-size="11.5" fill="#555555" text-anchor="middle">copied and adapted per service, never</text>
<text x="985.0" y="700.0" font-size="11.5" fill="#555555" text-anchor="middle">imported from one shared package</text>
<text x="610.0" y="30" font-size="14" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.27 -- the chassis scorecard across all 8 services: used, partial, and deferred, each row cites its file</text>
<text x="40" y="860" font-size="11" fill="#555555" text-anchor="start">Partial is a real count (6 of 8, 1 of 8), not a euphemism -- every absence above has a named reason in the chapter text.</text>
<text x="40" y="878" font-size="11" fill="#555555" text-anchor="start">Deferred means zero footprint today, re-checkable by grep -- not a capability quietly half-wired and left unexamined.</text>
</svg>