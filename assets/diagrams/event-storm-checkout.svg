<text x="40" y="985" font-size="10" fill="#555555" text-anchor="start">Legend (this project&#x27;s diagram palette, not literal sticky-note colors): ACCENT = domain event * USER = command * SUB = actor / external system * BOX = aggregate (bottom) / today&#x27;s direct call (top) * GHOST (dashed) = policy/reaction * KERNEL = read model</text>
