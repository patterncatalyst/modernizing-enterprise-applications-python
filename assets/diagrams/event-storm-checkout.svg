<text x="40" y="345" font-size="14" fill="#1d1d1d" text-anchor="start" font-weight="700">BOTTOM: the same process, event-stormed: actor -&gt; command -&gt; aggregate -&gt; domain events, policies/reactions, an external system, a read model</text>
<text x="1020" y="360" font-size="10" fill="#555555" text-anchor="start">ch.25: timeout/retry sit here once this is a network call</text>
<text x="1020" y="745" font-size="10" fill="#555555" text-anchor="start">ch.23: saga compensation releases the stock reservation here instead of an ACID rollback</text>
