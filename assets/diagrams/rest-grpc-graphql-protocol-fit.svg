<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f3d"/></marker></defs>
<rect x="20" y="56" width="420" height="400" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="76" font-size="12" font-weight="700" fill="#1d1d1d">REST</text>
<rect x="460" y="56" width="420" height="400" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="472" y="76" font-size="12" font-weight="700" fill="#1d1d1d">gRPC</text>
<rect x="900" y="56" width="440" height="400" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="912" y="76" font-size="12" font-weight="700" fill="#1d1d1d">GraphQL</text>
<rect x="50" y="110" width="360" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="230.0" y="143.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Client -&gt; any service</text>
<text x="230.0" y="160.0" font-size="11.5" fill="#555555" text-anchor="middle">request/reply, caller waits</text>
<rect x="50" y="200" width="360" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="230.0" y="233.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">GET/POST /api/orders</text>
<text x="230.0" y="250.0" font-size="11.5" fill="#555555" text-anchor="middle">/api/payments, /api/shipments...</text>
<rect x="50" y="290" width="360" height="70" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="230.0" y="323.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Fits: a user directly</text>
<text x="230.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">waiting on one answer</text>
<rect x="50" y="380" width="360" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="230.0" y="408.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Used by every service</text>
<text x="230.0" y="425.0" font-size="11.5" fill="#555555" text-anchor="middle">in this project, since ch.1</text>
<rect x="490" y="110" width="360" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="670.0" y="143.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order-service -&gt; inventory-service</text>
<text x="670.0" y="160.0" font-size="11.5" fill="#555555" text-anchor="middle">Reserve / Release / GetStock</text>
<rect x="490" y="200" width="360" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="670.0" y="233.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Strongly typed wire contract</text>
<text x="670.0" y="250.0" font-size="11.5" fill="#555555" text-anchor="middle">(proto), versioned, fast</text>
<rect x="490" y="290" width="360" height="70" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="670.0" y="323.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Fits: checkout cannot proceed</text>
<text x="670.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">without a synchronous stock answer</text>
<rect x="490" y="380" width="360" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="670.0" y="408.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">The ACL from ch.19,</text>
<text x="670.0" y="425.0" font-size="11.5" fill="#555555" text-anchor="middle">unchanged through order&#x27;s extraction</text>
<rect x="930" y="110" width="380" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1120.0" y="143.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Client -&gt; graphql-gateway :8090</text>
<text x="1120.0" y="160.0" font-size="11.5" fill="#555555" text-anchor="middle">order(id) { ... }, one round trip</text>
<rect x="930" y="200" width="380" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1120.0" y="233.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Fans out to 5 sources lazily,</text>
<text x="1120.0" y="250.0" font-size="11.5" fill="#555555" text-anchor="middle">per-field, depth/token bounded</text>
<rect x="930" y="290" width="380" height="70" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="1120.0" y="323.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Fits: a view that needs several</text>
<text x="1120.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">services&#x27; data in one response</text>
<rect x="930" y="380" width="380" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1120.0" y="408.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Partial failure = null field +</text>
<text x="1120.0" y="425.0" font-size="11.5" fill="#555555" text-anchor="middle">errors[], never a 500 -- see Fig 26.4</text>
<path d="M230.0,180.0 L230.0,200.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M230.0,270.0 L230.0,290.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M230.0,360.0 L230.0,380.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M670.0,180.0 L670.0,200.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M670.0,270.0 L670.0,290.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M670.0,360.0 L670.0,380.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M1120.0,180.0 L1120.0,200.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M1120.0,270.0 L1120.0,290.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M1120.0,360.0 L1120.0,380.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="680.0" y="30" font-size="16" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.26 -- three protocols, three different problems, used side by side in one system</text>
<text x="40" y="536" font-size="11" fill="#555555" text-anchor="start">A fourth style, asynchronous saga events (choreographed ch.23, orchestrated ch.24), coordinates every cross-service outcome none of the three above resolves synchronously.</text>
</svg>