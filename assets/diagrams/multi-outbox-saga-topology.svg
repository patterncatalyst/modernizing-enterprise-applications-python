<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 620" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f3d"/></marker></defs>
<rect x="20" y="50" width="620" height="190" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="70" font-size="12" font-weight="700" fill="#1d1d1d">Monolith -- order context (owns the checkout)</text>
<rect x="700" y="50" width="640" height="190" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="712" y="70" font-size="12" font-weight="700" fill="#1d1d1d">payment-service -- owns its OWN schema + outbox</text>
<rect x="20" y="280" width="620" height="190" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="300" font-size="12" font-weight="700" fill="#1d1d1d">Monolith -- order_saga_listener (a second consumer, same process)</text>
<rect x="50" y="130" width="250" height="90" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="175.0" y="165.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">_place_order_choreographed()</text>
<text x="175.0" y="182.5" font-size="11.5" fill="#555555" text-anchor="middle">PENDING order + outbox row,</text>
<text x="175.0" y="197.5" font-size="11.5" fill="#555555" text-anchor="middle">ONE local transaction</text>
<rect x="330" y="130" width="280" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="470.0" y="173.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">outbox_relay</text>
<text x="470.0" y="190.0" font-size="11.5" fill="#555555" text-anchor="middle">(this service&#x27;s OWN relay)</text>
<rect x="730" y="130" width="280" height="90" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="870.0" y="165.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order.placed consumer</text>
<text x="870.0" y="182.5" font-size="11.5" fill="#555555" text-anchor="middle">charge() + persist Payment</text>
<text x="870.0" y="197.5" font-size="11.5" fill="#555555" text-anchor="middle">+ OWN outbox row, ONE txn</text>
<rect x="1040" y="130" width="260" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1170.0" y="173.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">OutboxRelay</text>
<text x="1170.0" y="190.0" font-size="11.5" fill="#555555" text-anchor="middle">(payment-service&#x27;s OWN relay)</text>
<rect x="50" y="360" width="280" height="90" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="190.0" y="395.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order_saga_listener</text>
<text x="190.0" y="412.5" font-size="11.5" fill="#555555" text-anchor="middle">status-transition guard,</text>
<text x="190.0" y="427.5" font-size="11.5" fill="#555555" text-anchor="middle">idempotent on redelivery</text>
<rect x="380" y="360" width="260" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="510.0" y="395.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">handle_payment_captured /</text>
<text x="510.0" y="412.5" font-size="11.5" fill="#555555" text-anchor="middle">handle_payment_declined</text>
<text x="510.0" y="427.5" font-size="11.5" fill="#555555" text-anchor="middle">confirm+ship | release+decline</text>
<path d="M300.0,175.0 L330.0,175.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M1010.0,175.0 L1040.0,175.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M330.0,405.0 L380.0,405.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M610,175 L730,175" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<text x="676.0" y="169.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">Kafka: order.placed</text>
<text x="676.0" y="169.0" font-size="11" fill="#2f5f3d" text-anchor="middle">Kafka: order.placed</text>
<path d="M1170,220 L190,360" fill="none" stroke="#2f5f3d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="686.0" y="284.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">Kafka: payment.captured / payment.declined</text>
<text x="686.0" y="284.0" font-size="11" fill="#2f5f3d" text-anchor="middle">Kafka: payment.captured / payment.declined</text>
<text x="680.0" y="28" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.20/ch.23 -- two outboxes chained end to end, no orchestrator anywhere in this picture</text>
<text x="40" y="574" font-size="11" fill="#555555" text-anchor="start">Each hop (outbox -&gt; relay -&gt; topic -&gt; consumer) is independently at-least-once; the monolith is BOTH the first producer</text>
<text x="40" y="592" font-size="11" fill="#555555" text-anchor="start">and the final consumer -- a request that started as a checkout ends as a Kafka message the same process reacts to.</text>
</svg>