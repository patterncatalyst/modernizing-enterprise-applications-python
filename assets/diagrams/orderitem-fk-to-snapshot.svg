<text x="280.0" y="635.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1. ADD sku, item_name</text>
<text x="280.0" y="652.5" font-size="11.5" fill="#555555" text-anchor="middle">nullable-safe default,</text>
<text x="280.0" y="667.5" font-size="11.5" fill="#555555" text-anchor="middle">FK stays live</text>
