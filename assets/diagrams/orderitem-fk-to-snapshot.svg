<text x="640.0" y="32" font-size="18" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.18 -- from foreign key to snapshot: the denormalization move, concretely</text>
<text x="50" y="300" font-size="11" fill="#555555" text-anchor="start">A later price change in inventory never retroactively rewrites a historical order line -- correct read-model semantics either way checkout runs.</text>
<text x="640.0" y="568" font-size="12" fill="#1d1d1d" text-anchor="middle" font-weight="700">Operation order matters: backfill BEFORE dropping the FK, or there is nothing left to read from.</text>
