<text x="982.1904761904761" y="359.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">read-only lookups (customers, inventory_items)</text>
<text x="982.1904761904761" y="359.0" font-size="11" fill="#555" text-anchor="middle">read-only lookups (customers, inventory_items)</text>
<text x="750.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">Context map: six bounded contexts, one relationship nobody decided</text>
<text x="750.0" y="56" font-size="11.5" fill="#555555" text-anchor="middle">order-&gt;inventory is conformist with no ACL on the default path; order&#x27;s other sync edges are direct; notification is already reached only via outbox</text>
<text x="1250.0" y="188" font-size="10" fill="#3d7a4e" text-anchor="middle">zero outbound edges to siblings -- extracted first</text>
<text x="40" y="524" font-size="10.5" fill="#555555" text-anchor="start">Shared kernel with no edges: nobody drew a narrow, governed slice of shared model -- the whole schema is treated as commonly</text>
<text x="40" y="538" font-size="10.5" fill="#555555" text-anchor="start">owned by all six contexts, because a foreign key is the cheapest way to relate two rows that happen to live in the same schema.</text>
<text x="40" y="588" font-size="10" fill="#777777" text-anchor="start">Sourced from examples/00-monolith/order/services.py, inventory/services.py, order/inventory_client.py, order/proto/.../inventory.proto.</text>
<text x="40" y="604" font-size="10" fill="#777777" text-anchor="start">SMELL numbers quoted from examples/00-monolith/SMELLS.md.</text>
