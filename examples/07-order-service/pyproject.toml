[project]
name = "mea-order-service"
version = "0.1.0"
description = "Modernizing Enterprise Applications (Python) -- r07, the FINALE: the order bounded context extracted onto a standalone FastAPI service on :8088, built CQRS from day one. Lifts the monolith's god `place_order` plus its four saga reactions (handle_payment_captured/declined, handle_shipment_dispatched/failed), re-shaped into a command side (an owned `orders`/`order_items`/`customers` write aggregate + its own outbox) and a read side (`order_view`, projected in the SAME local transaction as every write -- reads are served view-only). Owns its own `order_svc` Postgres schema (Alembic; `order` is a reserved SQL word) and is a gRPC CLIENT of inventory-service (grpc.aio, never a listener). Checkout returns 202 PENDING; order.placed is produced via this service's own outbox."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.2",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "pydantic==2.14.1",
    "alembic==1.20.0",
    "aiokafka==0.14.0",
    "grpcio==1.84.0",
    "protobuf==7.36.2",
    # r10/ch.30, DRQ-096=A -- zero-code OTel auto-instrumentation (lgtm-python
    # house posture). opentelemetry-distro/-exporter-otlp-proto-grpc pinned
    # per DRQ-100 (0.66b1/1.45.0); every opentelemetry-instrumentation-*
    # below is the exact set `uv run opentelemetry-bootstrap -a requirements`
    # resolved for THIS environment -- fastapi/asyncpg/sqlalchemy/grpc/
    # aiokafka are the ones this service's code actually exercises (the
    # hero trace's order-service hop: FastAPI server span, asyncpg spans for
    # the aggregate + order_view write, grpc CLIENT span to inventory-
    # service's Reserve); the rest (asyncio/dbapi/exceptions/logging/
    # sqlite3/threading/urllib/wsgi/click/starlette/httpx/requests/urllib3/
    # tortoiseorm) are bootstrap's always-included default set plus
    # libraries this environment has only transitively (starlette underlies
    # fastapi; httpx/requests/urllib3 come from the dev-only
    # testcontainers/docker-py chain) -- they no-op when the matching
    # library is never used. Pinned explicitly here (not left to
    # `opentelemetry-bootstrap -a install`, which silently installs nothing
    # into a pip-less uv venv) so the build is reproducible. Wrapped at the
    # Containerfile entrypoint with `opentelemetry-instrument`; NO-OP by
    # default via `OTEL_SDK_DISABLED=true` in `.env.example` so compose/CI
    # stay byte-for-byte unaffected -- only `deploy/k8s/base/app-config.yaml`
    # flips it active, in-cluster only.
    "opentelemetry-distro==0.66b1",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.0",
    "opentelemetry-instrumentation-asyncio==0.66b1",
    "opentelemetry-instrumentation-dbapi==0.66b1",
    "opentelemetry-instrumentation-exceptions==0.66b1",
    "opentelemetry-instrumentation-logging==0.66b1",
    "opentelemetry-instrumentation-sqlite3==0.66b1",
    "opentelemetry-instrumentation-threading==0.66b1",
    "opentelemetry-instrumentation-urllib==0.66b1",
    "opentelemetry-instrumentation-wsgi==0.66b1",
    "opentelemetry-instrumentation-aiokafka==0.66b1",
    "opentelemetry-instrumentation-asyncpg==0.66b1",
    "opentelemetry-instrumentation-click==0.66b1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-grpc==0.66b1",
    "opentelemetry-instrumentation-httpx==0.66b1",
    "opentelemetry-instrumentation-requests==0.66b1",
    "opentelemetry-instrumentation-sqlalchemy==0.66b1",
    "opentelemetry-instrumentation-starlette==0.66b1",
    "opentelemetry-instrumentation-tortoiseorm==0.66b1",
    "opentelemetry-instrumentation-urllib3==0.66b1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.17.1",
    "testcontainers==4.15.0",
    "grpcio-tools==1.84.0",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: tests that require Testcontainers-backed Kafka + Postgres",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (function call in argument default) is a false positive for FastAPI's
# `Depends(...)`/`Query(...)` pattern -- that IS the idiomatic way to declare
# a dependency, per FastAPI's own docs. Same suppression as every other
# FastAPI service in this project.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Generated protobuf/gRPC stubs -- vendored from the canonical
# `04-inventory-service/proto/.../inventory.proto` via `scripts/gen-proto.sh`'s
# conventions (this service generates its OWN copy into app/grpc_gen/, kept
# self-contained rather than importing the inventory service's stubs
# cross-project); not ours to lint.
"app/grpc_gen/*.py" = ["E", "F", "I", "UP", "B"]

[tool.uv]
# A standalone FastAPI + gRPC-client service, not a distributable library --
# don't build/install it as a package into its own virtualenv.
package = false
