# openshift-chart.yml -- r11 (DRQ-110) Helm lint + render + offline schema
# validation gate for openshift/helm/mea/, the OpenShift/CRC appendix chart.
#
# A SEPARATE, ADDITIVE workflow: never edits, depends on, or shares a job
# with code-ci.yml / code-ci-ok / contract-gate / schema-registry.yml /
# deploy-manifests.yml / deploy-manifests-ok / supply-chain.yml /
# mesh-manifests.yml / mesh-manifests-ok / pages.yml -- those gates stay
# exactly as they were. Mirrors mesh-manifests.yml's summary-job gate
# pattern (see ~/.claude/skills/lgtm-github/references/branch-protection.md):
# a cheap `changes` job decides whether the heavy job runs; `render` does the
# real work; `openshift-chart-ok` is the single required check, `if:
# always()`, and passes when every needed job is success-or-skipped. No
# `paths:` filter on `on:` -- a path-filtered-out run of a workflow with a
# required summary job reports nothing, which would wedge a ruleset that
# requires this check.
#
# What "verified" means here, and what it does not: this gate proves the
# openshift/helm/mea chart lints cleanly and that `helm template` renders --
# both with the mesh/observability opt-in flags off (the compose/minikube-
# equivalent default) and with them both on (`mesh.enabled=true`,
# `observability.otlp.enabled=true`) -- and that the plain Kubernetes objects
# among the rendered output pass offline OpenAPI schema validation
# (`kubeconform -strict`) against the matching Kubernetes version -- no
# cluster contact. The Route and the PeerAuthentication custom resources have
# no published OpenAPI schema for kubeconform to check offline, so they are
# run with `-ignore-missing-schemas` and reported Skipped -- that is a schema
# gap, not a validation pass; it does NOT mean those objects are known-good,
# only that kubeconform had nothing to check them against headlessly. This
# gate does not run `kubectl apply --dry-run=client` or contact a real
# OpenShift/CRC cluster for the same reason mesh-manifests.yml and
# deploy-manifests.yml don't: that step needs a reachable API server's
# OpenAPI document, which a headless runner has none of. The live CRC path
# is covered by openshift/README.md and the appendix chapter, not by this
# workflow.

name: OpenShift Chart

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Decides whether the heavy job runs. The workflow always runs (no
  # `paths:` filter on `on:` above), so the required summary job always
  # reports.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! files="$(git diff --name-only "$base" "${{ github.sha }}" 2>/dev/null)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"   # cannot diff: run everything
          elif grep -qE '^(openshift/|\.github/workflows/openshift-chart\.yml$)' <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # THE GATE: lint the chart, then render it with `helm template` (no
  # cluster needed) -- once with the mesh/observability flags at their
  # default (off), once with both opt-in flags on -- and validate each
  # rendered output with `kubeconform -strict` -- offline OpenAPI schema
  # validation against the matching Kubernetes version, no network/cluster
  # contact. (`kubectl apply --dry-run=client` / a real CRC apply are
  # intentionally NOT run here -- see the file header.)
  render:
    name: render
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest

    env:
      HELM_VERSION: "4.2.2"
      KUBECONFORM_VERSION: "0.8.0"

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Install Helm (pinned)
        run: |
          curl -fsSLo helm.tar.gz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          tar -xzf helm.tar.gz linux-amd64/helm
          chmod +x linux-amd64/helm
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Install kubeconform (pinned)
        run: |
          curl -fsSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: helm lint
        run: helm lint openshift/helm/mea

      - name: Render + validate (core, mesh/observability flags off)
        run: |
          helm template openshift/helm/mea > /tmp/mea-core.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/mea-core.yaml

      - name: Render + validate (mesh + observability opt-in flags on -- Route/PeerAuthentication CRs have no published OpenAPI schema, reported Skipped, NOT claimed as strict-passed)
        run: |
          helm template openshift/helm/mea \
            --set mesh.enabled=true \
            --set observability.otlp.enabled=true \
            > /tmp/mea-full.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/mea-full.yaml

  # The one check a ruleset would require for this workflow. Passes when
  # every needed job succeeded or was skipped by `changes`.
  openshift-chart-ok:
    name: openshift-chart-ok
    if: always()
    needs: [changes, render]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' <<<"$NEEDS"
