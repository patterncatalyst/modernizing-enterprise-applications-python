# mesh-manifests.yml -- ch.30 (DRQ-101) kustomize render + offline schema
# validation gate for deploy/k8s/istio/, deploy/k8s/observability/, and the
# activated deploy/k8s/overlays/minikube overlay.
#
# A SEPARATE, ADDITIVE workflow: never edits, depends on, or shares a job
# with code-ci.yml / code-ci-ok / schema-registry.yml / deploy-manifests.yml /
# deploy-manifests-ok / supply-chain.yml -- those gates stay exactly as they
# were. Mirrors deploy-manifests.yml's summary-job gate pattern (see
# ~/.claude/skills/lgtm-github/references/branch-protection.md): a cheap
# `changes` job decides whether the heavy job runs; `render` does the real
# work; `mesh-manifests-ok` is the single required check, `if: always()`, and
# passes when every needed job is success-or-skipped. No `paths:` filter on
# `on:` -- a path-filtered-out run of a workflow with a required summary job
# reports nothing, which would wedge a ruleset that requires this check.
#
# What "verified" means here, and what it does not: this gate proves the
# istio + observability kustomize trees (and the minikube overlay that
# composes them with base) render, and that the plain Kubernetes objects
# among them pass offline OpenAPI schema validation (`kubeconform -strict`)
# against the matching Kubernetes version -- no cluster contact. The three
# Istio custom resources (PeerAuthentication x2, Telemetry) have no
# published OpenAPI schema for kubeconform to check offline, so they are run
# with `-ignore-missing-schemas` and reported Skipped -- that is a schema
# gap, not a validation pass; it does NOT mean those three objects are
# known-good, only that kubeconform had nothing to check them against
# headlessly. `istio-install.yaml` (the IstioOperator install) is NOT listed
# in deploy/k8s/istio/kustomization.yaml and so never enters any of these
# renders -- it is applied via `istioctl install -f`, not `kubectl apply -k`,
# and is cluster-only (see that file's own header). This gate does not run
# `kubectl apply --dry-run=client` for the same reason deploy-manifests.yml
# doesn't: that step needs a reachable API server's OpenAPI document, which
# a headless runner has none of.

name: Mesh Manifests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Decides whether the heavy job runs. The workflow always runs (no
  # `paths:` filter on `on:` above), so the required summary job always
  # reports.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! files="$(git diff --name-only "$base" "${{ github.sha }}" 2>/dev/null)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"   # cannot diff: run everything
          elif grep -qE '^(deploy/k8s/istio/|deploy/k8s/observability/|deploy/k8s/overlays/|\.github/workflows/mesh-manifests\.yml$)' <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # THE GATE: render each tree with `kubectl kustomize` (no cluster needed),
  # then validate the rendered output with `kubeconform -strict` -- offline
  # OpenAPI schema validation against the matching Kubernetes version, no
  # network/cluster contact. (`kubectl apply --dry-run=client` is
  # intentionally NOT run here -- see the file header.)
  render:
    name: render
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest

    env:
      KUBECTL_VERSION: "v1.37.1"
      KUBECONFORM_VERSION: "0.8.0"

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Install kubectl (pinned)
        run: |
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install kubeconform (pinned)
        run: |
          curl -fsSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Render + validate deploy/k8s/observability (plain k8s objects -- must be fully Valid)
        run: |
          kubectl kustomize deploy/k8s/observability > /tmp/observability.yaml
          kubeconform -strict -summary /tmp/observability.yaml

      - name: Render + validate deploy/k8s/istio (3 Istio CRs -- no published schema, reported Skipped, NOT claimed as strict-passed)
        run: |
          kubectl kustomize deploy/k8s/istio > /tmp/istio.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/istio.yaml

      - name: Render + validate deploy/k8s/overlays/minikube (base strict-valid + istio CRs skipped-missing-schema)
        run: |
          kubectl kustomize deploy/k8s/overlays/minikube > /tmp/minikube.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/minikube.yaml

  # The one check a ruleset would require for this workflow. Passes when
  # every needed job succeeded or was skipped by `changes`.
  mesh-manifests-ok:
    name: mesh-manifests-ok
    if: always()
    needs: [changes, render]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' <<<"$NEEDS"
