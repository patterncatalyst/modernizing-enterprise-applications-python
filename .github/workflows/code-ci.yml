# code-ci.yml -- r07 FINALE restructuring: the monolith-free contract gate.
#
# Summary-job gate pattern (see
# ~/.claude/skills/lgtm-github/references/branch-protection.md): a cheap
# `changes` job decides whether the heavy job runs; `contract-gate` does the
# real work; `code-ci-ok` is the single required check, `if: always()`, and
# passes when every needed job is success-or-skipped. No `paths:` filter on
# `on:` -- a path-filtered-out run of a workflow with a required summary job
# reports nothing, which would wedge the ruleset.
#
# HISTORY (r01-r06): this workflow used to carry SIX separate
# `*-equivalence-gate` jobs (monolith/review/notification/inventory/payment/
# shipping), each standing up a live monolith + one newly-extracted service +
# the strangler proxy with that context's `STRANGLER_*_ENABLED` cutover flag,
# proving the extraction was behaviorally transparent through the proxy.
#
# r07 THE FINAL CASCADE -- those six gates no longer match reality and are
# RETIRED here, replaced by a single `contract-gate`, mirroring how the Java
# sibling project restructured its own `code-ci.yml` at the equivalent point
# (its `order-gateway-contract-gate` job, ~/Dev/modernizing-enterprise-
# applications/.github/workflows/code-ci.yml): order-plan.md's final
# extraction (examples/07-order-service) irreversibly decommissioned the
# monolith from the running system (it is frozen in-repo, re-bootable only as
# a break-glass referent on `reference/monolith-before`, never again part of
# this workflow's topology) and retired EVERY `STRANGLER_*_ENABLED` flag from
# examples/01-strangler-proxy's `Settings` -- it is now a flagless, permanent
# REST edge router: each of the six bounded contexts it fronts has exactly one
# owning backend, unconditionally, and an unmatched path is a real 404, never
# a silent pass-through. tooling/newman/proxy.postman_environment.json
# changed shape to match: it is now a CONTRACT suite environment (baseUrl
# :8888, all 7 `*ContractEnabled` flags baked `true` as environment-scoped
# defaults), so a single unmodified `newman run` against it exercises the
# FULL collection -- Smoke, all 4 scenarios, all 6 Context Contract folders,
# Order Context Contract, and GraphQL Gateway Contract -- with no `--folder`
# restriction and no `--env-var` flags needed (unlike the Java sibling, whose
# `shippingSagaEnabled`/`graphqlGatewayEnabled` gate variables are
# COLLECTION-scoped and need a Node-API helper to patch in memory; this
# project's equivalent flags are ENVIRONMENT-scoped, so plain `newman run -e`
# already flips them all). `contract-gate` brings up the fully-extracted,
# monolith-free mesh -- inventory/payment/review/notification/shipping/order/
# gateway + the flagless proxy -- runs that full suite through the proxy, and
# proves the cutover is real (not a dead code path) with one inverted
# negative: order-service killed, a checkout must go RED. The Java sibling's
# AGENTS-reviewed finding that compensation/projection toggles are not
# separately exposed via env flags on this stack applies here too, so this is
# the one negative this gate carries, matching the established pattern every
# prior single-context gate used (kill the one load-bearing backend a
# scenario depends on, assert the suite goes RED).
#
# Stack: FastAPI/uvicorn services (uv, Python 3.14), Postgres 18.6-alpine
# (.env.example's POSTGRES_IMAGE_TAG, matching compose.yaml), a single-node
# KRaft Kafka broker (apache/kafka:4.3.1), Newman 6.2.2 on Node 22
# (decisions.md's version matrix).

name: Code CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Decides whether the heavy job runs. The workflow always runs (no `paths:`
  # filter on `on:` above), so the required summary job always reports.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! files="$(git diff --name-only "$base" "${{ github.sha }}" 2>/dev/null)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"   # cannot diff: run everything
          elif grep -qE '^(examples/00-monolith/|examples/01-strangler-proxy/|examples/02-review-service/|examples/03-notification-service/|examples/04-inventory-service/|examples/05-payment-service/|examples/06-shipping-service/|examples/07-order-service/|examples/08-graphql-gateway/|tooling/newman/|scripts/check-proto-drift\.sh$|infra/|compose\.yaml$|\.env\.example$|\.github/workflows/code-ci\.yml$)' <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # r07 THE FINAL GATE -- contract-gate (order-plan.md S11-equivalent,
  # mirroring the Java sibling's `order-gateway-contract-gate`). Replaces ALL
  # SIX retired `*-equivalence-gate` jobs: this is the only job in the
  # workflow from here on, and it brings up the PERMANENT shape of the
  # system -- inventory/payment/review/notification/shipping/order/gateway +
  # the strangler proxy, now a flagless REST edge router -- with NO LIVE
  # MONOLITH ANYWHERE. examples/00-monolith is frozen (break-glass only, see
  # its README's FROZEN STATUS section); this job never starts its gunicorn
  # process or any of its `manage.py` background commands.
  #
  # THE GATE: runs the FULL, unedited Newman collection (every folder --
  # Smoke, Scenario 1-4, Review/Notification/Inventory/Payment/Shipping/Order
  # Context Contract, and GraphQL Gateway Contract) through the proxy on
  # :8888 with a single plain `newman run` -- no `--folder` restriction, no
  # `--env-var` flags. tooling/newman/proxy.postman_environment.json already
  # bakes every `*ContractEnabled` flag `true` as an ENVIRONMENT-scoped
  # default (unlike the Java sibling's COLLECTION-scoped
  # `shippingSagaEnabled`/`graphqlGatewayEnabled`, which need a Node-API
  # helper to patch in memory because newman's `--env-var` CLI flag cannot
  # reach collection scope) -- so this project's equivalent gates are already
  # live the moment the environment file is passed, with no extra plumbing.
  # The GraphQL request's `{{graphqlUrl}}` collection variable already
  # defaults to `http://localhost:8090`, matching the gateway started below,
  # so no override is needed there either.
  #
  # Honesty proof: after the full suite is green, order-service is killed and
  # "Scenario 1 -- Happy-Path Checkout" is re-run. order-service is the sole
  # owner of `/api/orders` (CQRS write + read) post-extraction -- with it
  # down the proxy's `/api/orders` route has no backend to forward to and
  # returns a real 502 (app/main.py::proxy_handler's bridge semantics), so
  # the scenario's very first request (place the order) must fail. Newman
  # must exit non-zero; if it exits zero instead, the proxy silently masked
  # the outage and the cutover is not real. (Compensation/projection are not
  # separately toggle-exposed via an env flag on this stack -- there is no
  # second, independently-flippable negative to add here -- so this one,
  # load-bearing negative is sufficient, matching the shape every retired
  # single-context gate used: kill the one backend a scenario depends on,
  # assert the suite goes RED.)
  contract-gate:
    name: contract-gate
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest

    # Postgres + a single-node KRaft Kafka broker (no ZooKeeper) -- the SAME
    # images/tags/creds the project's compose stack and every service's own
    # config.py defaults use (.env.example), not a CI-only substitute. Kafka
    # is genuinely load-bearing: payment's order.placed/shipment.failed
    # consumers, shipping's payment.captured consumer, order-service's four
    # saga-outcome consumers, and notification's order.placed consumer are
    # all real Kafka round trips this gate's suite depends on.
    services:
      postgres:
        image: docker.io/library/postgres:18.6-alpine
        env:
          POSTGRES_DB: monolith
          POSTGRES_USER: monolith
          POSTGRES_PASSWORD: monolith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U monolith -d monolith"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      kafka:
        image: docker.io/apache/kafka:4.3.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
          KAFKA_NUM_PARTITIONS: 3
          KAFKA_DEFAULT_REPLICATION_FACTOR: 1
          KAFKA_MIN_INSYNC_REPLICAS: 1
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 30s

    env:
      DATABASE_URL: postgresql://monolith:monolith@localhost:5432/monolith
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      LOG_DIR: logs

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Proto drift guard -- canonical + all 3 vendored copies of the inventory ACL proto must be byte-identical
        # Four copies as of r07 (scripts/check-proto-drift.sh): the canonical
        # copy in examples/04-inventory-service/proto, plus vendored copies in
        # the frozen examples/00-monolith/order/proto (unchanged, still a real
        # file on disk even though the monolith process never starts below),
        # examples/07-order-service/proto, and examples/08-graphql-gateway/proto.
        run: bash scripts/check-proto-drift.sh

      - name: Install uv (pinned) + Python 3.14
        uses: astral-sh/setup-uv@v10.3.0   # no floating v10 tag; pin exact
        with:
          version: "0.13.1"            # decisions.md version matrix: uv 0.13.1
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            examples/00-monolith/uv.lock
            examples/01-strangler-proxy/uv.lock
            examples/02-review-service/uv.lock
            examples/03-notification-service/uv.lock
            examples/04-inventory-service/uv.lock
            examples/05-payment-service/uv.lock
            examples/06-shipping-service/uv.lock
            examples/07-order-service/uv.lock
            examples/08-graphql-gateway/uv.lock

      - name: uv sync (monolith)
        # Not started as a process below -- synced only so `manage.py
        # migrate`/`seed` (the frozen Django management commands) can run to
        # create the shared `public` schema review-service still reads/writes
        # (it owns no schema of its own; see examples/02-review-service/
        # AGENTS.md).
        working-directory: examples/00-monolith
        run: uv sync --locked --group dev

      - name: uv sync (strangler proxy)
        working-directory: examples/01-strangler-proxy
        run: uv sync --locked --group dev

      - name: uv sync (review service)
        working-directory: examples/02-review-service
        run: uv sync --locked --group dev

      - name: uv sync (notification service)
        working-directory: examples/03-notification-service
        run: uv sync --locked --group dev

      - name: uv sync (inventory service)
        working-directory: examples/04-inventory-service
        run: uv sync --locked --group dev

      - name: uv sync (payment service)
        working-directory: examples/05-payment-service
        run: uv sync --locked --group dev

      - name: uv sync (shipping service)
        working-directory: examples/06-shipping-service
        run: uv sync --locked --group dev

      - name: uv sync (order service)
        working-directory: examples/07-order-service
        run: uv sync --locked --group dev

      - name: uv sync (graphql gateway)
        working-directory: examples/08-graphql-gateway
        run: uv sync --locked --group dev

      - name: Migrate + seed the monolith's database (public schema, for the Review service only)
        # review-service is NOT its own Flyway/Alembic migrator -- `reviews`,
        # `customers`, `inventory_items`, and `auth_user` all live in this
        # shared `public` schema, created by the frozen monolith's own
        # `manage.py migrate`/`seed`. This runs those two management commands
        # directly -- it does NOT start gunicorn or any of the monolith's
        # background consumers; nothing from examples/00-monolith is part of
        # this job's running topology.
        working-directory: examples/00-monolith
        run: |
          set -euo pipefail
          uv run python manage.py migrate
          uv run python manage.py seed

      - name: Migrate inventory-service's own `inventory` schema
        # alembic upgrade head both creates the schema/tables AND seeds the
        # canonical 3-SKU catalog (idempotent ON CONFLICT DO NOTHING).
        working-directory: examples/04-inventory-service
        run: uv run alembic upgrade head

      - name: Migrate payment-service's own `payment` schema
        working-directory: examples/05-payment-service
        run: uv run alembic upgrade head

      - name: Migrate notification-service's own `notification` schema
        working-directory: examples/03-notification-service
        run: uv run alembic upgrade head

      - name: Migrate shipping-service's own `shipping` schema
        working-directory: examples/06-shipping-service
        run: uv run alembic upgrade head

      - name: Migrate order-service's own `order_svc` schema (also seeds its own forward-filled `customers` copy)
        # order-service owns its own `customers` snapshot from day one (no CDC
        # backfill from the monolith's historical rows) -- its own
        # `migrations/versions/0002_seed_customers.py` seeds the same
        # Ada/Grace rows the monolith's own seed creates, so this job's
        # checkout fixtures (customerId=1) resolve without a separate
        # forward-fill step.
        working-directory: examples/07-order-service
        run: uv run alembic upgrade head

      # examples/08-graphql-gateway owns no database and runs no migration --
      # it is a stateless, data-less aggregation gateway (its own
      # pyproject.toml description).

      - name: Start the inventory-service (uvicorn) on :8084 -- gRPC on :9004
        # Started first: order-service's checkout-time Reserve/Release calls
        # and the gateway's per-item stock field both depend on it over gRPC,
        # with no in-JVM/in-process fallback.
        working-directory: examples/04-inventory-service
        run: |
          mkdir -p logs
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8084 > uvicorn.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the inventory-service's gRPC server to be listening on :9004
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8084/health" | grep -q '"grpcServerListening":true'; then
              echo "inventory-service's gRPC server is listening."
              exit 0
            fi
            sleep 2
          done
          echo "inventory-service's gRPC server never came up." >&2
          curl -sf "http://localhost:8084/health" || true
          exit 1

      - name: Start the payment-service (uvicorn) on :8085 -- order.placed consumer + shipment.failed refund consumer + outbox relay run from its lifespan
        working-directory: examples/05-payment-service
        env:
          DATABASE_URL: postgresql://monolith:monolith@localhost:5432/monolith
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          mkdir -p logs
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8085 > uvicorn.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the payment-service's Kafka consumers to be assigned on :8085
        # GET /health reports consumerPartitionsAssigned AND
        # refundConsumerPartitionsAssigned -- payment-service's lifespan runs
        # BOTH the order.placed consumer and the shipment.failed refund
        # consumer. Waiting on both flags avoids a checkout, or a shipping
        # failure's refund, racing either consumer's group-join.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            body="$(curl -sf "http://localhost:8085/health" || true)"
            if grep -q '"consumerPartitionsAssigned":true' <<<"$body" \
                && grep -q '"refundConsumerPartitionsAssigned":true' <<<"$body"; then
              echo "payment-service's consumers have partitions assigned."
              exit 0
            fi
            sleep 2
          done
          echo "payment-service's consumers never got partitions assigned." >&2
          curl -sf "http://localhost:8085/health" || true
          exit 1

      - name: Start the review-service (uvicorn) on :8001
        working-directory: examples/02-review-service
        env:
          DATABASE_URL: postgresql://monolith:monolith@localhost:5432/monolith
        run: |
          mkdir -p logs
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8001 > uvicorn.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the review-service to be ready on :8001
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8001/api/reviews?sku=SKU-WIDGET-001" > /dev/null; then
              echo "review-service is up."
              exit 0
            fi
            sleep 2
          done
          echo "review-service did not become ready in time." >&2
          exit 1

      - name: Start the notification-service (uvicorn) on :8002 -- order.placed consumer runs from its lifespan
        working-directory: examples/03-notification-service
        env:
          DATABASE_URL: postgresql://monolith:monolith@localhost:5432/monolith
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          mkdir -p logs
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8002 > uvicorn.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the notification-service's Kafka consumer to be assigned on :8002
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8002/health" | grep -q '"consumerPartitionsAssigned":true'; then
              echo "notification-service's consumer has partitions assigned."
              exit 0
            fi
            sleep 2
          done
          echo "notification-service's consumer never got partitions assigned." >&2
          curl -sf "http://localhost:8002/health" || true
          exit 1

      - name: Start the shipping-service (uvicorn) on :8087 -- payment.captured consumer + relay + crash-resume scan run from its lifespan
        # ORDER_BASE_URL (the enrich step's target, r07 re-point away from the
        # decommissioned monolith's :8000) is set explicitly even though it
        # already matches app/config.py's own default, for the same
        # documentation-by-env-block discipline every other gate in this
        # workflow used.
        working-directory: examples/06-shipping-service
        env:
          DATABASE_URL: postgresql://monolith:monolith@localhost:5432/monolith
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          ORDER_BASE_URL: http://localhost:8088
        run: |
          mkdir -p logs
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8087 > uvicorn.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the shipping-service's Kafka consumer + crash-resume scan on :8087
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            body="$(curl -sf "http://localhost:8087/health" || true)"
            if grep -q '"consumerPartitionsAssigned":true' <<<"$body" \
                && grep -q '"resumeComplete":true' <<<"$body"; then
              echo "shipping-service's consumer is assigned and crash-resume is complete."
              exit 0
            fi
            sleep 2
          done
          echo "shipping-service never reported ready." >&2
          curl -sf "http://localhost:8087/health" || true
          exit 1

      - name: Start the order-service (uvicorn) on :8088 -- outbox write path + four-topic saga consumer + gRPC inventory client
        # THE CORE OF THIS GATE, alongside the gateway below. NO LIVE
        # MONOLITH ANYWHERE in this job's topology -- the proxy's own
        # `order_base_url` default (http://localhost:8088) already expects
        # this service here, no runtime override needed.
        working-directory: examples/07-order-service
        env:
          DATABASE_URL: postgresql://monolith:monolith@localhost:5432/monolith
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          mkdir -p logs
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8088 > uvicorn.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the order-service to be ready on :8088
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8088/api/orders" > /dev/null; then
              echo "order-service is up."
              exit 0
            fi
            sleep 2
          done
          echo "order-service did not become ready in time." >&2
          exit 1

      - name: Wait for the order-service's saga consumer to be assigned
        # GET /health reports consumerPartitionsAssigned for the ONE consumer
        # subscribed to all four saga-outcome topics (payment.captured/
        # declined, shipment.dispatched/failed) -- load-bearing, not
        # cosmetic: a freshly-started consumer group can take up to its
        # session-timeout window to be assigned partitions, independent of
        # the HTTP health check above being green.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8088/health" | grep -q '"consumerPartitionsAssigned":true'; then
              echo "order-service's saga consumer has partitions assigned."
              exit 0
            fi
            sleep 2
          done
          echo "order-service's saga consumer never got partitions assigned." >&2
          curl -sf "http://localhost:8088/health" || true
          exit 1

      - name: Start the graphql-gateway (uvicorn) on :8090 -- order+payment+shipping+review REST clients, inventory gRPC client
        # THE OTHER CORE OF THIS GATE. Owns no data, routes no request through
        # the proxy (its own front door) -- every downstream target is this
        # service's own committed default, already matching every port
        # started above, so no runtime overrides are needed.
        working-directory: examples/08-graphql-gateway
        run: |
          mkdir -p logs
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8090 > uvicorn.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the graphql-gateway to be ready on :8090
        # /health is pure liveness (deliberately does not probe any
        # downstream -- app/main.py's docstring). A short settle follows:
        # its REST/gRPC clients to every downstream service are
        # lazily-initialized on first use, and the suite's GraphQL Gateway
        # Contract folder is the first request this job ever sends it.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8090/health" > /dev/null; then
              echo "graphql-gateway is up."
              break
            fi
            sleep 2
          done
          if ! curl -sf "http://localhost:8090/health" > /dev/null; then
            echo "graphql-gateway did not become ready in time." >&2
            exit 1
          fi
          sleep 5

      - name: Start the strangler proxy (uvicorn) on :8888 -- flagless edge router, unconditional per-context routing
        # r07 DECOMMISSION: no `STRANGLER_*_ENABLED` flag left to set --
        # app/config.py's Settings carries only fixed per-context base URLs,
        # every one of which already matches the port a service above was
        # just started on, so no env overrides are needed here either.
        # `_select_backend` routes unconditionally by path prefix; a path
        # matching none of the six contexts is a real 404, never a silent
        # pass-through -- there is no monolith left to fall back to.
        working-directory: examples/01-strangler-proxy
        run: |
          mkdir -p logs
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8888 > uvicorn.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the strangler proxy to be ready on :8888
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8888/api/orders" > /dev/null; then
              echo "Proxy is up."
              exit 0
            fi
            sleep 2
          done
          echo "Proxy did not become ready in time." >&2
          exit 1

      - name: Set up Node (for newman)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install newman
        run: npm install -g newman@6.2.2   # pin: decisions.md version matrix

      - name: Run the FULL contract suite through the flagless edge router -- the contract gate
        # THE GATE: a non-zero newman exit code fails the job. One plain
        # `newman run` against the committed, unedited collection and
        # environment -- no `--folder` restriction, no `--env-var` overrides.
        # proxy.postman_environment.json already bakes every
        # `*ContractEnabled` flag `true`, so this single invocation exercises
        # Smoke, all 4 scenarios, all 6 per-context Context Contract folders,
        # Order Context Contract, and GraphQL Gateway Contract in one pass
        # against the fully-extracted, monolith-free mesh.
        run: |
          newman run tooling/newman/mea.postman_collection.json \
            -e tooling/newman/proxy.postman_environment.json

      - name: Kill the order-service (for the negative check)
        working-directory: examples/07-order-service
        run: |
          if [ -f uvicorn.pid ]; then kill "$(cat uvicorn.pid)" || true; fi

      - name: Negative check -- order-service down must go RED
        # Inverted: the STEP passes only when newman FAILS (non-zero exit).
        # order-service is the sole backend for /api/orders post-extraction;
        # with it down the proxy's catch-all route has no owning backend to
        # forward to and returns a real 502 the moment "Scenario 1 --
        # Happy-Path Checkout" places its order -- the scenario's very first
        # request. If newman exits zero instead, the proxy silently masked
        # the outage (or is still serving stale data), so the cutover is not
        # real -- fail the job.
        run: |
          if newman run tooling/newman/mea.postman_collection.json \
              -e tooling/newman/proxy.postman_environment.json \
              --folder "Scenario 1 — Happy-Path Checkout"; then
            echo "::error::Negative check failed: newman passed (exit 0) with order-service down; expected a RED run." >&2
            exit 1
          fi
          echo "Negative check OK: newman correctly exited non-zero with order-service down."

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "::group::examples/04-inventory-service/logs/inventory-service.log"
          cat examples/04-inventory-service/logs/inventory-service.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/04-inventory-service/uvicorn.out.log"
          cat examples/04-inventory-service/uvicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/05-payment-service/logs/payment-service.log"
          cat examples/05-payment-service/logs/payment-service.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/05-payment-service/uvicorn.out.log"
          cat examples/05-payment-service/uvicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/02-review-service/logs/review-service.log"
          cat examples/02-review-service/logs/review-service.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/02-review-service/uvicorn.out.log"
          cat examples/02-review-service/uvicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/03-notification-service/logs/notification-service.log"
          cat examples/03-notification-service/logs/notification-service.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/03-notification-service/uvicorn.out.log"
          cat examples/03-notification-service/uvicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/06-shipping-service/logs/shipping-service.log"
          cat examples/06-shipping-service/logs/shipping-service.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/06-shipping-service/uvicorn.out.log"
          cat examples/06-shipping-service/uvicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/07-order-service/logs/order-service.log"
          cat examples/07-order-service/logs/order-service.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/07-order-service/uvicorn.out.log"
          cat examples/07-order-service/uvicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/08-graphql-gateway/logs/graphql-gateway.log"
          cat examples/08-graphql-gateway/logs/graphql-gateway.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/08-graphql-gateway/uvicorn.out.log"
          cat examples/08-graphql-gateway/uvicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/01-strangler-proxy/uvicorn.out.log"
          cat examples/01-strangler-proxy/uvicorn.out.log 2>/dev/null || true
          echo "::endgroup::"

      - name: Stop all services
        if: always()
        run: |
          for pidfile in \
            examples/04-inventory-service/uvicorn.pid \
            examples/05-payment-service/uvicorn.pid \
            examples/02-review-service/uvicorn.pid \
            examples/03-notification-service/uvicorn.pid \
            examples/06-shipping-service/uvicorn.pid \
            examples/07-order-service/uvicorn.pid \
            examples/08-graphql-gateway/uvicorn.pid \
            examples/01-strangler-proxy/uvicorn.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" || true
            fi
          done

  # The one check the ruleset requires. Passes when every needed job
  # succeeded or was skipped by `changes`.
  code-ci-ok:
    name: code-ci-ok
    if: always()
    needs: [changes, contract-gate]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' <<<"$NEEDS"
