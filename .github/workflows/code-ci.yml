# code-ci.yml -- r01 walking-skeleton CI lane: the monolith-equivalence gate.
#
# Summary-job gate pattern (see
# ~/.claude/skills/lgtm-github/references/branch-protection.md): a cheap
# `changes` job decides whether the heavy job runs; `monolith-equivalence-gate`
# does the real work; `code-ci-ok` is the single required check, `if: always()`,
# and passes when every needed job is success-or-skipped. No `paths:` filter on
# `on:` -- a path-filtered-out run of a workflow with a required summary job
# reports nothing, which would wedge the ruleset.
#
# What the gate proves: the Newman behavior-equivalence suite captured against
# the monolith (tooling/newman/mea.postman_collection.json,
# DRQ-010/DRQ-022 in _plans/decisions.md) can run against a freshly migrated +
# seeded monolith in CI, not just on a developer's laptop. This is the r01
# walking-skeleton's only extraction target -- examples/00-monolith/ IS the
# system under test here, not a referent for something already extracted (that
# arrives starting r02, mirroring the Java sibling's per-context gates).
#
# Stack: Django 5.2 + DRF (uv, Python 3.14), gunicorn on :8000
# (examples/00-monolith/README.md's Quickstart), Postgres 18.6-alpine
# (.env.example's POSTGRES_IMAGE_TAG, matching compose.yaml), Newman 6.2.2 on
# Node 22 (decisions.md's version matrix).

name: Code CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Decides whether the heavy job runs. The workflow always runs (no `paths:`
  # filter on `on:` above), so the required summary job always reports.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! files="$(git diff --name-only "$base" "${{ github.sha }}" 2>/dev/null)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"   # cannot diff: run everything
          elif grep -qE '^(examples/00-monolith/|examples/01-strangler-proxy/|examples/02-review-service/|examples/03-notification-service/|examples/04-inventory-service/|examples/05-payment-service/|examples/06-shipping-service/|tooling/newman/|infra/|compose\.yaml$|\.env\.example$|\.github/workflows/code-ci\.yml$)' <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  monolith-equivalence-gate:
    name: monolith-equivalence-gate
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest

    # Postgres, pinned to the same tag/creds the project's compose stack and
    # the monolith's own settings.py defaults use (.env.example:
    # POSTGRES_IMAGE_TAG=18.6-alpine, POSTGRES_DB/_USER/_PASSWORD=monolith) --
    # the SAME contract as local dev, not a CI-only substitute.
    services:
      postgres:
        image: docker.io/library/postgres:18.6-alpine
        env:
          POSTGRES_DB: monolith
          POSTGRES_USER: monolith
          POSTGRES_PASSWORD: monolith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U monolith -d monolith"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://monolith:monolith@localhost:5432/monolith
      LOG_DIR: logs

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Install uv (pinned) + Python 3.14
        uses: astral-sh/setup-uv@v10.3.0   # no floating v10 tag; pin exact
        with:
          version: "0.13.1"            # decisions.md version matrix: uv 0.13.1
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "examples/00-monolith/uv.lock"

      - name: uv sync (monolith)
        # --locked: fail if uv.lock is out of date rather than silently
        # re-resolving, matching the Dockerfile's reproducibility discipline
        # (examples/00-monolith/Dockerfile: `uv sync --locked --no-dev`).
        working-directory: examples/00-monolith
        run: uv sync --locked --group dev

      - name: Migrate + seed the monolith's database
        working-directory: examples/00-monolith
        run: |
          set -euo pipefail
          uv run python manage.py migrate
          uv run python manage.py seed

      - name: Start the monolith (gunicorn) on :8000
        working-directory: examples/00-monolith
        run: |
          mkdir -p logs
          nohup uv run gunicorn config.wsgi -b 0.0.0.0:8000 > gunicorn.out.log 2>&1 &
          echo $! > gunicorn.pid

      - name: Wait for the monolith to be ready on :8000
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8000/api/orders" > /dev/null; then
              echo "Monolith is up."
              exit 0
            fi
            sleep 2
          done
          echo "Monolith did not become ready in time." >&2
          cat examples/00-monolith/logs/monolith.log 2>/dev/null || true
          cat examples/00-monolith/gunicorn.out.log 2>/dev/null || true
          exit 1

      - name: Set up Node (for newman)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install newman
        run: npm install -g newman@6.2.2   # pin: decisions.md version matrix

      - name: Run the behavior-equivalence suite against the monolith -- the equivalence gate
        # THE GATE: a non-zero newman exit code fails the job.
        run: |
          newman run tooling/newman/mea.postman_collection.json \
            -e tooling/newman/local.postman_environment.json

      - name: Dump monolith log on failure
        if: failure()
        run: |
          echo "::group::examples/00-monolith/logs/monolith.log"
          cat examples/00-monolith/logs/monolith.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/00-monolith/gunicorn.out.log"
          cat examples/00-monolith/gunicorn.out.log 2>/dev/null || true
          echo "::endgroup::"

      - name: Stop the monolith
        if: always()
        run: |
          if [ -f examples/00-monolith/gunicorn.pid ]; then
            kill "$(cat examples/00-monolith/gunicorn.pid)" || true
          fi

  # r02's extraction gate: the Review bounded context (DRQ-019) behind the
  # strangler proxy. Brings up all three processes -- monolith :8000,
  # review-service :8001, and the proxy :8888 with the cutover flag ON
  # (STRANGLER_REVIEW_ENABLED=true) -- and runs the Newman suite THROUGH the
  # proxy, not directly against review-service, so the gate proves the
  # cutover is transparent end-to-end: review traffic reaches the new
  # service, and non-review traffic (smoke + checkout) still reaches the
  # monolith unchanged.
  review-equivalence-gate:
    name: review-equivalence-gate
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest

    # Same Postgres pin/creds as monolith-equivalence-gate -- one shared
    # schema, migrated+seeded once by the monolith, read by both the
    # monolith and review-service (review-service owns no schema of its own;
    # see examples/02-review-service/AGENTS.md).
    services:
      postgres:
        image: docker.io/library/postgres:18.6-alpine
        env:
          POSTGRES_DB: monolith
          POSTGRES_USER: monolith
          POSTGRES_PASSWORD: monolith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U monolith -d monolith"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://monolith:monolith@localhost:5432/monolith
      LOG_DIR: logs

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Install uv (pinned) + Python 3.14
        uses: astral-sh/setup-uv@v10.3.0   # no floating v10 tag; pin exact
        with:
          version: "0.13.1"            # decisions.md version matrix: uv 0.13.1
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            examples/00-monolith/uv.lock
            examples/01-strangler-proxy/uv.lock
            examples/02-review-service/uv.lock

      - name: uv sync (monolith)
        working-directory: examples/00-monolith
        run: uv sync --locked --group dev

      - name: uv sync (strangler proxy)
        working-directory: examples/01-strangler-proxy
        run: uv sync --locked --group dev

      - name: uv sync (review service)
        working-directory: examples/02-review-service
        run: uv sync --locked --group dev

      - name: Migrate + seed the monolith's database
        # Shared schema -- also creates the seeded `reviewer` auth user that
        # review-service's POST /api/reviews HTTP Basic auth checks against.
        working-directory: examples/00-monolith
        run: |
          set -euo pipefail
          uv run python manage.py migrate
          uv run python manage.py seed

      - name: Start the monolith (gunicorn) on :8000
        working-directory: examples/00-monolith
        run: |
          mkdir -p logs
          nohup uv run gunicorn config.wsgi -b 0.0.0.0:8000 > gunicorn.out.log 2>&1 &
          echo $! > gunicorn.pid

      - name: Start the review-service (uvicorn) on :8001
        working-directory: examples/02-review-service
        env:
          DATABASE_URL: postgresql://monolith:monolith@localhost:5432/monolith
        run: |
          mkdir -p logs
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8001 > uvicorn.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Start the strangler proxy (uvicorn) on :8888 -- cutover flag ON
        working-directory: examples/01-strangler-proxy
        env:
          STRANGLER_REVIEW_ENABLED: 'true'
          STRANGLER_MONOLITH_BASE_URL: http://localhost:8000
          STRANGLER_REVIEW_BASE_URL: http://localhost:8001
        run: |
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8888 > uvicorn.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the monolith to be ready on :8000
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8000/api/orders" > /dev/null; then
              echo "Monolith is up."
              exit 0
            fi
            sleep 2
          done
          echo "Monolith did not become ready in time." >&2
          exit 1

      - name: Wait for the review-service to be ready on :8001
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8001/api/reviews" > /dev/null; then
              echo "review-service is up."
              exit 0
            fi
            sleep 2
          done
          echo "review-service did not become ready in time." >&2
          exit 1

      - name: Wait for the strangler proxy to be ready on :8888
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8888/api/orders" > /dev/null; then
              echo "Proxy is up."
              exit 0
            fi
            sleep 2
          done
          echo "Proxy did not become ready in time." >&2
          exit 1

      - name: Set up Node (for newman)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install newman
        run: npm install -g newman@6.2.2   # pin: decisions.md version matrix

      - name: Run the behavior-equivalence suite through the proxy -- the review cutover gate
        # THE GATE: a non-zero newman exit code fails the job. Runs through
        # the proxy on :8888 (not directly against review-service), proving
        # the cutover is transparent: the Review Context Contract folder
        # proves /api/reviews* now reaches review-service, while the Smoke
        # and checkout scenario folders prove everything else still reaches
        # the monolith unchanged.
        # --folder may be repeated to run more than one top-level folder.
        # "Review Context Contract" proves the cutover itself; "Smoke" and
        # the happy-path checkout scenario prove the proxy stays transparent
        # for everything that did NOT cut over (tooling/newman's existing
        # top-level folder names -- see mea.postman_collection.json).
        run: |
          newman run tooling/newman/mea.postman_collection.json \
            -e tooling/newman/proxy.postman_environment.json \
            --folder "Review Context Contract" \
            --folder "Smoke" \
            --folder "Scenario 1 — Happy-Path Checkout"

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "::group::examples/00-monolith/logs/monolith.log"
          cat examples/00-monolith/logs/monolith.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/00-monolith/gunicorn.out.log"
          cat examples/00-monolith/gunicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/02-review-service/logs/review-service.log"
          cat examples/02-review-service/logs/review-service.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/02-review-service/uvicorn.out.log"
          cat examples/02-review-service/uvicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/01-strangler-proxy/uvicorn.out.log"
          cat examples/01-strangler-proxy/uvicorn.out.log 2>/dev/null || true
          echo "::endgroup::"

      - name: Stop the monolith, review-service, and proxy
        if: always()
        run: |
          for pidfile in \
            examples/00-monolith/gunicorn.pid \
            examples/02-review-service/uvicorn.pid \
            examples/01-strangler-proxy/uvicorn.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" || true
            fi
          done

  # r03's extraction gate: the Notification bounded context (DRQ-0xx), the
  # first ASYNC extraction -- the monolith's own outbox_relay publishes
  # `order.placed` to Kafka, and (flag OFF) the monolith's own
  # order_placed_consumer rebuilds its read model from that same topic, so
  # the self-consumer is part of the flag-OFF equivalence contract, not an
  # implementation detail. Flag ON hands the topic to
  # examples/03-notification-service's own consumer instead. Both states are
  # proven through the proxy on :8888 with the SAME Newman collection -- only
  # the flag changes -- and a negative check proves the cutover is real (kill
  # notification-service while the flag is ON and Newman must go RED), not
  # just a dead-code path. See tooling/newman/README.md's "Running the r03
  # NEWMAN-ASYNC evidence through the strangler proxy" for the exact,
  # hand-verified recipe this job encodes.
  notification-equivalence-gate:
    name: notification-equivalence-gate
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest

    # Same Postgres pin/creds as the other gates, plus a single-node KRaft
    # Kafka broker (no ZooKeeper) -- env block ported from this repo's own
    # compose.yaml (`kafka` service), minus the DOCKER-only listener that
    # exists there just for the compose-network case. CLUSTER_ID is the same
    # fixed value as .env.example's KAFKA_CLUSTER_ID so this isn't "any
    # base64-ish string" drifting between local dev and CI.
    services:
      postgres:
        image: docker.io/library/postgres:18.6-alpine
        env:
          POSTGRES_DB: monolith
          POSTGRES_USER: monolith
          POSTGRES_PASSWORD: monolith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U monolith -d monolith"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      kafka:
        image: docker.io/apache/kafka:4.3.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
          KAFKA_NUM_PARTITIONS: 3
          KAFKA_DEFAULT_REPLICATION_FACTOR: 1
          KAFKA_MIN_INSYNC_REPLICAS: 1
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 30s

    env:
      DATABASE_URL: postgresql://monolith:monolith@localhost:5432/monolith
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      LOG_DIR: logs

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Install uv (pinned) + Python 3.14
        uses: astral-sh/setup-uv@v10.3.0   # no floating v10 tag; pin exact
        with:
          version: "0.13.1"            # decisions.md version matrix: uv 0.13.1
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            examples/00-monolith/uv.lock
            examples/01-strangler-proxy/uv.lock
            examples/03-notification-service/uv.lock

      - name: uv sync (monolith)
        working-directory: examples/00-monolith
        run: uv sync --locked --group dev

      - name: uv sync (strangler proxy)
        working-directory: examples/01-strangler-proxy
        run: uv sync --locked --group dev

      - name: uv sync (notification service)
        working-directory: examples/03-notification-service
        run: uv sync --locked --group dev

      - name: Migrate + seed the monolith's database
        working-directory: examples/00-monolith
        run: |
          set -euo pipefail
          uv run python manage.py migrate
          uv run python manage.py seed

      - name: Migrate notification-service's own `notification` schema
        working-directory: examples/03-notification-service
        run: uv run alembic upgrade head

      - name: Start the monolith (gunicorn) on :8000
        working-directory: examples/00-monolith
        run: |
          mkdir -p logs
          nohup uv run gunicorn config.wsgi -b 0.0.0.0:8000 > gunicorn.out.log 2>&1 &
          echo $! > gunicorn.pid

      - name: Start the outbox relay
        # Publishes the monolith's outbox rows (incl. `order.placed`) to
        # Kafka at-least-once -- required for BOTH flag states, since the
        # topic is the only path from "an order was placed" to either
        # consumer (the monolith's own, or notification-service's).
        working-directory: examples/00-monolith
        run: |
          nohup uv run python manage.py outbox_relay > relay.out.log 2>&1 &
          echo $! > relay.pid

      - name: Start the monolith's own order.placed self-consumer
        # Required for the flag-OFF pass: with STRANGLER_NOTIFICATION_ENABLED
        # unset, the proxy still routes to the monolith, whose Notification
        # read model is rebuilt by THIS consumer, not notification-service's.
        working-directory: examples/00-monolith
        run: |
          nohup uv run python manage.py order_placed_consumer > consumer.out.log 2>&1 &
          echo $! > consumer.pid

      - name: Start the notification-service (uvicorn) on :8002
        working-directory: examples/03-notification-service
        env:
          DATABASE_URL: postgresql://monolith:monolith@localhost:5432/monolith
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          mkdir -p logs
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8002 > uvicorn.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the monolith to be ready on :8000
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8000/api/orders" > /dev/null; then
              echo "Monolith is up."
              exit 0
            fi
            sleep 2
          done
          echo "Monolith did not become ready in time." >&2
          exit 1

      - name: Wait for the notification-service's Kafka consumer to be assigned on :8002
        # GET /health reports consumerPartitionsAssigned -- app/main.py's own
        # CI-readiness contract. Waiting on this (not just process liveness)
        # avoids a flag-ON Newman run racing the consumer's group-join.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8002/health" | grep -q '"consumerPartitionsAssigned":true'; then
              echo "notification-service's consumer has partitions assigned."
              exit 0
            fi
            sleep 2
          done
          echo "notification-service's consumer never got partitions assigned." >&2
          curl -sf "http://localhost:8002/health" || true
          exit 1

      - name: Start the strangler proxy (uvicorn) on :8888 -- notification cutover flag ON
        working-directory: examples/01-strangler-proxy
        env:
          STRANGLER_NOTIFICATION_ENABLED: 'true'
          STRANGLER_MONOLITH_BASE_URL: http://localhost:8000
          STRANGLER_NOTIFICATION_BASE_URL: http://localhost:8002
        run: |
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8888 > uvicorn-flag-on.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the strangler proxy to be ready on :8888
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8888/api/orders" > /dev/null; then
              echo "Proxy is up."
              exit 0
            fi
            sleep 2
          done
          echo "Proxy did not become ready in time." >&2
          exit 1

      - name: Set up Node (for newman)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install newman
        run: npm install -g newman@6.2.2   # pin: decisions.md version matrix

      - name: Run the behavior-equivalence suite through the proxy -- notification cutover flag ON
        # THE GATE (half 1 of 2): notifications served by
        # examples/03-notification-service. --env-var is required, not
        # --global-var -- it populates the *environment* scope the
        # Notification Context Contract folder's guard reads (see
        # tooling/newman/README.md); a plain collection variable would never
        # see it.
        run: |
          newman run tooling/newman/mea.postman_collection.json \
            -e tooling/newman/proxy.postman_environment.json \
            --env-var notificationContractEnabled=true

      - name: Flip the strangler proxy to flag OFF
        # Same proxy contract as review-equivalence-gate's cutover test:
        # only the flag changes, same collection, same environment file.
        working-directory: examples/01-strangler-proxy
        env:
          STRANGLER_MONOLITH_BASE_URL: http://localhost:8000
          STRANGLER_NOTIFICATION_BASE_URL: http://localhost:8002
        run: |
          if [ -f uvicorn.pid ]; then kill "$(cat uvicorn.pid)" || true; fi
          sleep 1
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8888 > uvicorn-flag-off.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the strangler proxy to be ready on :8888 (flag OFF)
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8888/api/orders" > /dev/null; then
              echo "Proxy is up."
              exit 0
            fi
            sleep 2
          done
          echo "Proxy did not become ready in time." >&2
          exit 1

      - name: Run the behavior-equivalence suite through the proxy -- notification cutover flag OFF
        # THE GATE (half 2 of 2): notifications served by the monolith's own
        # order.placed self-consumer -- proves the flag-OFF path is still a
        # real, working equivalent, not a code path nothing exercises.
        run: |
          newman run tooling/newman/mea.postman_collection.json \
            -e tooling/newman/proxy.postman_environment.json \
            --env-var notificationContractEnabled=true

      - name: Flip the strangler proxy back to flag ON (for the negative check)
        working-directory: examples/01-strangler-proxy
        env:
          STRANGLER_NOTIFICATION_ENABLED: 'true'
          STRANGLER_MONOLITH_BASE_URL: http://localhost:8000
          STRANGLER_NOTIFICATION_BASE_URL: http://localhost:8002
        run: |
          if [ -f uvicorn.pid ]; then kill "$(cat uvicorn.pid)" || true; fi
          sleep 1
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8888 > uvicorn-flag-on-2.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the strangler proxy to be ready on :8888 (flag ON, negative check)
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8888/api/orders" > /dev/null; then
              echo "Proxy is up."
              exit 0
            fi
            sleep 2
          done
          echo "Proxy did not become ready in time." >&2
          exit 1

      - name: Kill the notification-service (for the negative check)
        working-directory: examples/03-notification-service
        run: |
          if [ -f uvicorn.pid ]; then kill "$(cat uvicorn.pid)" || true; fi

      - name: Negative check -- flag ON with notification-service down must go RED
        # Inverted: the STEP passes only when newman FAILS (non-zero exit).
        # The Notification Context Contract folder's own N2 bounded-wait
        # (20 x 750ms, ~15s budget) is the poll budget here -- no outer retry
        # loop needed. If newman exits zero, the cutover is not real (the
        # proxy masked the outage), so fail the job.
        run: |
          if newman run tooling/newman/mea.postman_collection.json \
              -e tooling/newman/proxy.postman_environment.json \
              --folder "Notification Context Contract" \
              --env-var notificationContractEnabled=true; then
            echo "::error::Negative check failed: newman passed (exit 0) with notification-service down; expected a RED run." >&2
            exit 1
          fi
          echo "Negative check OK: newman correctly exited non-zero with notification-service down."

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "::group::examples/00-monolith/logs/monolith.log"
          cat examples/00-monolith/logs/monolith.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/00-monolith/gunicorn.out.log"
          cat examples/00-monolith/gunicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/00-monolith/relay.out.log"
          cat examples/00-monolith/relay.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/00-monolith/consumer.out.log"
          cat examples/00-monolith/consumer.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/03-notification-service/logs/notification-service.log"
          cat examples/03-notification-service/logs/notification-service.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/03-notification-service/uvicorn.out.log"
          cat examples/03-notification-service/uvicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/01-strangler-proxy/uvicorn-flag-on.out.log"
          cat examples/01-strangler-proxy/uvicorn-flag-on.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/01-strangler-proxy/uvicorn-flag-off.out.log"
          cat examples/01-strangler-proxy/uvicorn-flag-off.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/01-strangler-proxy/uvicorn-flag-on-2.out.log"
          cat examples/01-strangler-proxy/uvicorn-flag-on-2.out.log 2>/dev/null || true
          echo "::endgroup::"

      - name: Stop the monolith, relay, self-consumer, notification-service, and proxy
        if: always()
        run: |
          for pidfile in \
            examples/00-monolith/gunicorn.pid \
            examples/00-monolith/relay.pid \
            examples/00-monolith/consumer.pid \
            examples/03-notification-service/uvicorn.pid \
            examples/01-strangler-proxy/uvicorn.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" || true
            fi
          done

  # r04's extraction gate: the Inventory bounded context (ch.19/DRQ-039/
  # DRQ-041/DRQ-042/DRQ-044), extracted onto examples/04-inventory-service --
  # a standalone FastAPI service with its OWN `inventory` Postgres schema
  # PLUS a net-new gRPC server (:9004) that is the synchronous
  # order<->inventory anti-corruption-layer contract
  # (CheckStock/Reserve/Release/GetStock). No Kafka/Debezium here: the
  # transition-only CDC consumer (INVENTORY_CDC_ENABLED) is flag-gated off
  # and is not part of the end-state this gate proves -- see
  # examples/04-inventory-service/CUTOVER.md. Postgres-only, matching
  # monolith-equivalence-gate and review-equivalence-gate.
  #
  # Two independent cutover dimensions (see tooling/newman/README.md's "The
  # r04 NEWMAN-GRPC lane"): the monolith's own INVENTORY_MODE
  # (local/grpc, where checkout-time reserve/release happens) and the
  # proxy's STRANGLER_INVENTORY_ENABLED (where GET /api/inventory* reads are
  # served). This gate proves BOTH proven combinations -- fully-gRPC and
  # fully-local (reversibility) -- plus a negative check (inventory-service
  # killed while fully-gRPC) that must go RED, proving the cutover is real
  # rather than a dead code path.
  inventory-equivalence-gate:
    name: inventory-equivalence-gate
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest

    # Same Postgres pin/creds as monolith-equivalence-gate/
    # review-equivalence-gate -- NO Kafka service container, this gate's
    # runtime never touches a broker.
    services:
      postgres:
        image: docker.io/library/postgres:18.6-alpine
        env:
          POSTGRES_DB: monolith
          POSTGRES_USER: monolith
          POSTGRES_PASSWORD: monolith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U monolith -d monolith"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://monolith:monolith@localhost:5432/monolith
      LOG_DIR: logs

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Proto drift guard -- vendored inventory ACL proto must match the canonical one
        # Fails fast, before any dependency install, if
        # examples/00-monolith/order/proto's vendored copy of the inventory
        # ACL proto has drifted from examples/04-inventory-service/proto's
        # canonical source (scripts/check-proto-drift.sh: byte-identical
        # sha256 check, exits non-zero on drift or a missing file).
        run: bash scripts/check-proto-drift.sh

      - name: Install uv (pinned) + Python 3.14
        uses: astral-sh/setup-uv@v10.3.0   # no floating v10 tag; pin exact
        with:
          version: "0.13.1"            # decisions.md version matrix: uv 0.13.1
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            examples/00-monolith/uv.lock
            examples/01-strangler-proxy/uv.lock
            examples/04-inventory-service/uv.lock

      - name: uv sync (monolith)
        working-directory: examples/00-monolith
        run: uv sync --locked --group dev

      - name: uv sync (strangler proxy)
        working-directory: examples/01-strangler-proxy
        run: uv sync --locked --group dev

      - name: uv sync (inventory service)
        working-directory: examples/04-inventory-service
        run: uv sync --locked --group dev

      - name: Migrate + seed the monolith's database
        # Owns `public.inventory_items` as always (SMELL[ch.18] -- unchanged
        # until the monolith module itself is decommissioned).
        working-directory: examples/00-monolith
        run: |
          set -euo pipefail
          uv run python manage.py migrate
          uv run python manage.py seed

      - name: Migrate + seed inventory-service's own `inventory` schema
        # alembic upgrade head both creates the schema/table AND seeds the
        # same three demo SKUs (idempotent ON CONFLICT DO NOTHING), so
        # GET /api/inventory returns an identical dataset whichever side
        # currently serves the route.
        working-directory: examples/04-inventory-service
        run: uv run alembic upgrade head

      - name: Start the inventory-service (uvicorn) on :8084 -- gRPC on :9004
        working-directory: examples/04-inventory-service
        run: |
          mkdir -p logs
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8084 > uvicorn.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the inventory-service's gRPC server to be listening on :9004
        # /health reports grpcServerListening, not just HTTP process
        # liveness -- same CI-readiness contract as notification-service's
        # consumerPartitionsAssigned check above.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8084/health" | grep -q '"grpcServerListening":true'; then
              echo "inventory-service's gRPC server is listening."
              exit 0
            fi
            sleep 2
          done
          echo "inventory-service's gRPC server never came up." >&2
          curl -sf "http://localhost:8084/health" || true
          exit 1

      - name: Start the monolith (gunicorn) on :8000 -- INVENTORY_MODE=grpc
        working-directory: examples/00-monolith
        env:
          INVENTORY_MODE: grpc
          INVENTORY_GRPC_TARGET: localhost:9004
        run: |
          mkdir -p logs
          nohup uv run gunicorn config.wsgi -b 0.0.0.0:8000 > gunicorn.out.log 2>&1 &
          echo $! > gunicorn.pid

      - name: Wait for the monolith to be ready on :8000
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8000/api/orders" > /dev/null; then
              echo "Monolith is up."
              exit 0
            fi
            sleep 2
          done
          echo "Monolith did not become ready in time." >&2
          exit 1

      - name: Start the strangler proxy (uvicorn) on :8888 -- inventory cutover flag ON
        working-directory: examples/01-strangler-proxy
        env:
          STRANGLER_INVENTORY_ENABLED: 'true'
          STRANGLER_MONOLITH_BASE_URL: http://localhost:8000
          STRANGLER_INVENTORY_BASE_URL: http://localhost:8084
        run: |
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8888 > uvicorn-flag-on.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the strangler proxy to be ready on :8888
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8888/api/orders" > /dev/null; then
              echo "Proxy is up."
              exit 0
            fi
            sleep 2
          done
          echo "Proxy did not become ready in time." >&2
          exit 1

      - name: Set up Node (for newman)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install newman
        run: npm install -g newman@6.2.2   # pin: decisions.md version matrix

      - name: Run the behavior-equivalence suite through the proxy -- fully-gRPC
        # THE GATE (1 of 2): checkout-time reserve/release over gRPC
        # (INVENTORY_MODE=grpc) AND GET /api/inventory* reads routed to
        # inventory-service (STRANGLER_INVENTORY_ENABLED=true).
        run: |
          newman run tooling/newman/mea.postman_collection.json \
            -e tooling/newman/proxy.postman_environment.json \
            --env-var inventoryContractEnabled=true

      - name: Flip the monolith to INVENTORY_MODE=local (reversibility)
        working-directory: examples/00-monolith
        env:
          INVENTORY_MODE: local
        run: |
          if [ -f gunicorn.pid ]; then kill "$(cat gunicorn.pid)" || true; fi
          sleep 1
          nohup uv run gunicorn config.wsgi -b 0.0.0.0:8000 > gunicorn-local.out.log 2>&1 &
          echo $! > gunicorn.pid

      - name: Wait for the monolith to be ready on :8000 (INVENTORY_MODE=local)
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8000/api/orders" > /dev/null; then
              echo "Monolith is up."
              exit 0
            fi
            sleep 2
          done
          echo "Monolith did not become ready in time." >&2
          exit 1

      - name: Flip the strangler proxy to inventory flag OFF (reversibility)
        # Same proxy contract as the other gates' cutover tests: only the
        # flag changes, same collection, same environment file.
        working-directory: examples/01-strangler-proxy
        env:
          STRANGLER_MONOLITH_BASE_URL: http://localhost:8000
          STRANGLER_INVENTORY_BASE_URL: http://localhost:8084
        run: |
          if [ -f uvicorn.pid ]; then kill "$(cat uvicorn.pid)" || true; fi
          sleep 1
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8888 > uvicorn-flag-off.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the strangler proxy to be ready on :8888 (flag OFF)
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8888/api/orders" > /dev/null; then
              echo "Proxy is up."
              exit 0
            fi
            sleep 2
          done
          echo "Proxy did not become ready in time." >&2
          exit 1

      - name: Run the behavior-equivalence suite through the proxy -- fully-local (reversibility)
        # THE GATE (2 of 2): checkout-time reserve/release back in-process
        # (INVENTORY_MODE=local) AND GET /api/inventory* reads served by the
        # monolith again (STRANGLER_INVENTORY_ENABLED unset) -- proves the
        # cutover is reversible, not a one-way door.
        run: |
          newman run tooling/newman/mea.postman_collection.json \
            -e tooling/newman/proxy.postman_environment.json \
            --env-var inventoryContractEnabled=true

      - name: Flip the monolith back to INVENTORY_MODE=grpc (for the negative check)
        working-directory: examples/00-monolith
        env:
          INVENTORY_MODE: grpc
          INVENTORY_GRPC_TARGET: localhost:9004
        run: |
          if [ -f gunicorn.pid ]; then kill "$(cat gunicorn.pid)" || true; fi
          sleep 1
          nohup uv run gunicorn config.wsgi -b 0.0.0.0:8000 > gunicorn-grpc-2.out.log 2>&1 &
          echo $! > gunicorn.pid

      - name: Wait for the monolith to be ready on :8000 (INVENTORY_MODE=grpc, negative check)
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8000/api/orders" > /dev/null; then
              echo "Monolith is up."
              exit 0
            fi
            sleep 2
          done
          echo "Monolith did not become ready in time." >&2
          exit 1

      - name: Flip the strangler proxy back to inventory flag ON (for the negative check)
        working-directory: examples/01-strangler-proxy
        env:
          STRANGLER_INVENTORY_ENABLED: 'true'
          STRANGLER_MONOLITH_BASE_URL: http://localhost:8000
          STRANGLER_INVENTORY_BASE_URL: http://localhost:8084
        run: |
          if [ -f uvicorn.pid ]; then kill "$(cat uvicorn.pid)" || true; fi
          sleep 1
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8888 > uvicorn-flag-on-2.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the strangler proxy to be ready on :8888 (flag ON, negative check)
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8888/api/orders" > /dev/null; then
              echo "Proxy is up."
              exit 0
            fi
            sleep 2
          done
          echo "Proxy did not become ready in time." >&2
          exit 1

      - name: Kill the inventory-service (for the negative check)
        working-directory: examples/04-inventory-service
        run: |
          if [ -f uvicorn.pid ]; then kill "$(cat uvicorn.pid)" || true; fi

      - name: Negative check -- inventory-service down with fully-gRPC must go RED
        # Inverted: the STEP passes only when newman FAILS (non-zero exit).
        # Covers both halves of the ACL contract: the Inventory Context
        # Contract folder's reads (proxy's gRPC-mode route now has nothing to
        # read from) AND Scenario 1's happy-path checkout (the monolith's
        # remote Reserve call now fails with gRPC UNAVAILABLE, mapped to a
        # real 503 INVENTORY_UNAVAILABLE) -- proving the cutover is real on
        # both the read and the write path, not a masked success on either.
        run: |
          if newman run tooling/newman/mea.postman_collection.json \
              -e tooling/newman/proxy.postman_environment.json \
              --folder "Inventory Context Contract" \
              --folder "Scenario 1 — Happy-Path Checkout" \
              --env-var inventoryContractEnabled=true; then
            echo "::error::Negative check failed: newman passed (exit 0) with inventory-service down; expected a RED run." >&2
            exit 1
          fi
          echo "Negative check OK: newman correctly exited non-zero with inventory-service down."

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "::group::examples/00-monolith/logs/monolith.log"
          cat examples/00-monolith/logs/monolith.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/00-monolith/gunicorn.out.log"
          cat examples/00-monolith/gunicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/00-monolith/gunicorn-local.out.log"
          cat examples/00-monolith/gunicorn-local.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/00-monolith/gunicorn-grpc-2.out.log"
          cat examples/00-monolith/gunicorn-grpc-2.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/04-inventory-service/logs/inventory-service.log"
          cat examples/04-inventory-service/logs/inventory-service.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/04-inventory-service/uvicorn.out.log"
          cat examples/04-inventory-service/uvicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/01-strangler-proxy/uvicorn-flag-on.out.log"
          cat examples/01-strangler-proxy/uvicorn-flag-on.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/01-strangler-proxy/uvicorn-flag-off.out.log"
          cat examples/01-strangler-proxy/uvicorn-flag-off.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/01-strangler-proxy/uvicorn-flag-on-2.out.log"
          cat examples/01-strangler-proxy/uvicorn-flag-on-2.out.log 2>/dev/null || true
          echo "::endgroup::"

      - name: Stop the monolith, inventory-service, and proxy
        if: always()
        run: |
          for pidfile in \
            examples/00-monolith/gunicorn.pid \
            examples/04-inventory-service/uvicorn.pid \
            examples/01-strangler-proxy/uvicorn.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" || true
            fi
          done

  # r05's extraction gate: the Payment bounded context (ch.23-25), the first
  # CHOREOGRAPHED (no orchestrator) extraction -- examples/05-payment-service
  # reacts to the monolith's own `order.placed` event over Kafka, captures or
  # declines payment, and publishes `payment.captured`/`payment.declined` from
  # its OWN transactional outbox into its OWN `payment` Postgres schema. The
  # monolith's `order_saga_listener` consumes THOSE events in turn to finish
  # the order (confirm + ship, or release + decline). See
  # examples/05-payment-service/CUTOVER.md's two independent cutover
  # dimensions and tooling/newman/GOLDEN-BASELINE.md's "r05 CUTOVER" section
  # for the hand-verified recipe this job encodes (scoped down to payment +
  # inventory coverage -- review-service stays off, same as
  # inventory-equivalence-gate, since the monolith still serves /api/reviews
  # unchanged when STRANGLER_REVIEW_ENABLED is unset; notification-service
  # stays off too, since the Notification Context Contract folder is an
  # inert, self-guarding no-op without notificationContractEnabled=true).
  #
  # Choreographed payment ALWAYS reserves inventory over gRPC regardless of
  # PAYMENT_MODE (CUTOVER.md), so this gate also brings up
  # examples/04-inventory-service (gRPC :9004) with INVENTORY_MODE=grpc --
  # same bring-up as inventory-equivalence-gate, plus payment-service and its
  # Kafka dependency on top.
  payment-equivalence-gate:
    name: payment-equivalence-gate
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest

    # Same Postgres pin/creds as the other gates, plus the same single-node
    # KRaft Kafka service container as notification-equivalence-gate -- the
    # order.placed -> payment-service -> payment.captured/declined ->
    # order_saga_listener round trip is a real Kafka round trip, not a
    # Kafka-free lane.
    services:
      postgres:
        image: docker.io/library/postgres:18.6-alpine
        env:
          POSTGRES_DB: monolith
          POSTGRES_USER: monolith
          POSTGRES_PASSWORD: monolith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U monolith -d monolith"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      kafka:
        image: docker.io/apache/kafka:4.3.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
          KAFKA_NUM_PARTITIONS: 3
          KAFKA_DEFAULT_REPLICATION_FACTOR: 1
          KAFKA_MIN_INSYNC_REPLICAS: 1
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 30s

    env:
      DATABASE_URL: postgresql://monolith:monolith@localhost:5432/monolith
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      LOG_DIR: logs

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Proto drift guard -- vendored inventory ACL proto must match the canonical one
        # Same guard as inventory-equivalence-gate: this gate also brings up
        # inventory-service (choreographed payment reserves over gRPC), so
        # the same drift class would bite it too.
        run: bash scripts/check-proto-drift.sh

      - name: Install uv (pinned) + Python 3.14
        uses: astral-sh/setup-uv@v10.3.0   # no floating v10 tag; pin exact
        with:
          version: "0.13.1"            # decisions.md version matrix: uv 0.13.1
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            examples/00-monolith/uv.lock
            examples/01-strangler-proxy/uv.lock
            examples/04-inventory-service/uv.lock
            examples/05-payment-service/uv.lock

      - name: uv sync (monolith)
        working-directory: examples/00-monolith
        run: uv sync --locked --group dev

      - name: uv sync (strangler proxy)
        working-directory: examples/01-strangler-proxy
        run: uv sync --locked --group dev

      - name: uv sync (inventory service)
        working-directory: examples/04-inventory-service
        run: uv sync --locked --group dev

      - name: uv sync (payment service)
        working-directory: examples/05-payment-service
        run: uv sync --locked --group dev

      - name: Migrate + seed the monolith's database
        working-directory: examples/00-monolith
        run: |
          set -euo pipefail
          uv run python manage.py migrate
          uv run python manage.py seed

      - name: Migrate + seed inventory-service's own `inventory` schema
        working-directory: examples/04-inventory-service
        run: uv run alembic upgrade head

      - name: Migrate payment-service's own `payment` schema
        working-directory: examples/05-payment-service
        run: uv run alembic upgrade head

      - name: Start the inventory-service (uvicorn) on :8084 -- gRPC on :9004
        working-directory: examples/04-inventory-service
        run: |
          mkdir -p logs
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8084 > uvicorn.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the inventory-service's gRPC server to be listening on :9004
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8084/health" | grep -q '"grpcServerListening":true'; then
              echo "inventory-service's gRPC server is listening."
              exit 0
            fi
            sleep 2
          done
          echo "inventory-service's gRPC server never came up." >&2
          curl -sf "http://localhost:8084/health" || true
          exit 1

      - name: Start the payment-service (uvicorn) on :8085 -- consumer + outbox relay run from its lifespan
        working-directory: examples/05-payment-service
        env:
          DATABASE_URL: postgresql://monolith:monolith@localhost:5432/monolith
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          mkdir -p logs
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8085 > uvicorn.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the payment-service's Kafka consumer to be assigned on :8085
        # GET /health reports consumerPartitionsAssigned, same CI-readiness
        # contract as notification-service's -- avoids a choreographed
        # checkout racing the consumer's group-join.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8085/health" | grep -q '"consumerPartitionsAssigned":true'; then
              echo "payment-service's consumer has partitions assigned."
              exit 0
            fi
            sleep 2
          done
          echo "payment-service's consumer never got partitions assigned." >&2
          curl -sf "http://localhost:8085/health" || true
          exit 1

      - name: Start the monolith (gunicorn) on :8000 -- INVENTORY_MODE=grpc, PAYMENT_MODE=choreographed
        working-directory: examples/00-monolith
        env:
          INVENTORY_MODE: grpc
          INVENTORY_GRPC_TARGET: localhost:9004
          PAYMENT_MODE: choreographed
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          mkdir -p logs
          nohup uv run gunicorn config.wsgi -b 0.0.0.0:8000 > gunicorn.out.log 2>&1 &
          echo $! > gunicorn.pid

      - name: Wait for the monolith to be ready on :8000
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8000/api/orders" > /dev/null; then
              echo "Monolith is up."
              exit 0
            fi
            sleep 2
          done
          echo "Monolith did not become ready in time." >&2
          exit 1

      - name: Start the monolith's outbox relay, order.placed self-consumer, and order saga listener
        # Same env as the monolith's gunicorn process -- all three background
        # `manage.py` commands need PAYMENT_MODE=choreographed/
        # INVENTORY_GRPC_TARGET visible too, since order_saga_listener calls
        # straight into order.services's same dispatch helpers gunicorn does
        # (compensating gRPC Release on decline/ship-fail).
        working-directory: examples/00-monolith
        env:
          INVENTORY_MODE: grpc
          INVENTORY_GRPC_TARGET: localhost:9004
          PAYMENT_MODE: choreographed
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          nohup uv run python manage.py outbox_relay > relay.out.log 2>&1 &
          echo $! > relay.pid
          nohup uv run python manage.py order_placed_consumer > consumer.out.log 2>&1 &
          echo $! > consumer.pid
          nohup uv run python manage.py order_saga_listener > saga.out.log 2>&1 &
          echo $! > saga.pid

      - name: Start the strangler proxy (uvicorn) on :8888 -- inventory/payment flags ON
        # Only the flags for services THIS gate actually starts are enabled.
        # review-service and notification-service are not running here (same
        # scoping inventory-equivalence-gate uses for review-service) --
        # STRANGLER_REVIEW_ENABLED/STRANGLER_NOTIFICATION_ENABLED stay unset,
        # so app/main.py's routing (`if settings.review_enabled and
        # path.startswith("/api/reviews")`) falls through to
        # STRANGLER_MONOLITH_BASE_URL for both, which still serves
        # /api/reviews and /api/notifications unchanged -- flipping either
        # flag ON with nothing listening on :8001/:8002 would break routing,
        # not prove anything.
        working-directory: examples/01-strangler-proxy
        env:
          STRANGLER_INVENTORY_ENABLED: 'true'
          STRANGLER_PAYMENT_ENABLED: 'true'
          STRANGLER_MONOLITH_BASE_URL: http://localhost:8000
          STRANGLER_INVENTORY_BASE_URL: http://localhost:8084
          STRANGLER_PAYMENT_BASE_URL: http://localhost:8085
        run: |
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8888 > uvicorn.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the strangler proxy to be ready on :8888
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8888/api/orders" > /dev/null; then
              echo "Proxy is up."
              exit 0
            fi
            sleep 2
          done
          echo "Proxy did not become ready in time." >&2
          exit 1

      - name: Set up Node (for newman)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install newman
        run: npm install -g newman@6.2.2   # pin: decisions.md version matrix

      - name: Run the behavior-equivalence suite through the proxy -- fully-choreographed
        # THE GATE: the whole collection runs (no --folder restriction), with
        # checkout-time reserve/release over gRPC and payment charged
        # asynchronously by payment-service. The bounded-wait polls
        # (Scenario 1/3/4's *c steps) converge to a real terminal status --
        # CONFIRMED/PAYMENT_DECLINED/SHIPPING_FAILED -- over a genuine Kafka
        # round trip through payment-service and back through
        # order_saga_listener, not an instant resolve. Payment Context
        # Contract and Inventory Context Contract are exercised for real
        # (both --env-var guards set). Review Context Contract passes via the
        # monolith's own unchanged /api/reviews (review-service isn't running
        # and its flag is off, see the proxy step above). Notification
        # Context Contract stays an inert, self-guarding no-op (no
        # --env-var notificationContractEnabled=true passed, and it's the
        # collection's last folder so the guard ends the run there without
        # stranding anything already executed).
        run: |
          newman run tooling/newman/mea.postman_collection.json \
            -e tooling/newman/proxy.postman_environment.json \
            --env-var paymentContractEnabled=true \
            --env-var inventoryContractEnabled=true

      - name: Kill the payment-service (for the negative check)
        # THE HONESTY PROOF: with the stack otherwise unchanged and still
        # fully-choreographed, kill payment-service's consumer+relay. A
        # checkout still returns 202/PENDING (the reservation and
        # order-persist steps don't need payment-service at all), but there
        # is no longer anything to capture payment, so the order must get
        # stuck PENDING rather than falsely resolving CONFIRMED.
        working-directory: examples/05-payment-service
        run: |
          if [ -f uvicorn.pid ]; then kill "$(cat uvicorn.pid)" || true; fi

      - name: Negative check -- stuck-PENDING honesty, payment-service down must go RED
        # Inverted: the STEP passes only when newman FAILS (non-zero exit).
        # Scenario 1's own bounded-wait poll (1c, 20 x 750ms, ~15s budget) is
        # the poll budget here -- no outer retry loop needed. The order stays
        # PENDING for the whole budget, so the poll's terminal-CONFIRMED
        # assertion fails and newman exits non-zero. If newman exits zero,
        # the cutover is not real (the stack is reporting a false CONFIRMED
        # with no payment decision ever made), so fail the job.
        run: |
          if newman run tooling/newman/mea.postman_collection.json \
              -e tooling/newman/proxy.postman_environment.json \
              --folder "Scenario 1 — Happy-Path Checkout" \
              --env-var paymentContractEnabled=true \
              --env-var inventoryContractEnabled=true; then
            echo "::error::Negative check failed: newman passed (exit 0) with payment-service down; expected a RED run (order stuck PENDING)." >&2
            exit 1
          fi
          echo "Negative check OK: newman correctly exited non-zero with payment-service down (order stuck PENDING)."

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "::group::examples/00-monolith/logs/monolith.log"
          cat examples/00-monolith/logs/monolith.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/00-monolith/gunicorn.out.log"
          cat examples/00-monolith/gunicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/00-monolith/relay.out.log"
          cat examples/00-monolith/relay.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/00-monolith/consumer.out.log"
          cat examples/00-monolith/consumer.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/00-monolith/saga.out.log"
          cat examples/00-monolith/saga.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/05-payment-service/logs/payment-service.log"
          cat examples/05-payment-service/logs/payment-service.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/05-payment-service/uvicorn.out.log"
          cat examples/05-payment-service/uvicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/04-inventory-service/logs/inventory-service.log"
          cat examples/04-inventory-service/logs/inventory-service.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/04-inventory-service/uvicorn.out.log"
          cat examples/04-inventory-service/uvicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/01-strangler-proxy/uvicorn.out.log"
          cat examples/01-strangler-proxy/uvicorn.out.log 2>/dev/null || true
          echo "::endgroup::"

      - name: Stop the monolith, its background commands, payment-service, inventory-service, and proxy
        if: always()
        run: |
          for pidfile in \
            examples/00-monolith/gunicorn.pid \
            examples/00-monolith/relay.pid \
            examples/00-monolith/consumer.pid \
            examples/00-monolith/saga.pid \
            examples/05-payment-service/uvicorn.pid \
            examples/04-inventory-service/uvicorn.pid \
            examples/01-strangler-proxy/uvicorn.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" || true
            fi
          done

  # r06's extraction gate: the Shipping bounded context (ch.26), the first
  # ORCHESTRATED (DB-backed saga, no gRPC, no Camel) extraction --
  # examples/06-shipping-service reacts to 05-payment-service's own
  # `payment.captured` event over Kafka, drives a four-step saga
  # (enrich -> dispatch -> book_carrier -> emit) against the monolith's OWN
  # `GET /api/orders/{id}` (MONOLITH_BASE_URL, the enrich step's only
  # outbound call), and publishes `shipment.dispatched`/`shipment.failed`
  # from its OWN transactional outbox into its OWN `shipping` Postgres
  # schema. The monolith's `order_saga_listener` consumes those events in
  # turn to finish the order (CONFIRMED on dispatched, compensating
  # release+decline-equivalent handling on failed) -- same listener process
  # payment-equivalence-gate already starts, now also carrying
  # SHIPPING_MODE=orchestrated.
  #
  # Orchestrated shipping still rides on top of choreographed payment, which
  # ALWAYS reserves inventory over gRPC (CUTOVER.md, same as
  # payment-equivalence-gate), so this gate's topology is
  # payment-equivalence-gate's PLUS shipping-service: inventory-service
  # (gRPC :9004), payment-service, shipping-service, the monolith (with its
  # three background commands), and the proxy with all three cutover flags
  # ON. See examples/06-shipping-service/README.md's "orchestrated" story
  # and AGENTS.md's "no monolith original for the write path" note -- the
  # monolith's own SHIPPING_MODE=inprocess default is what r05 and earlier
  # gates already exercise implicitly; this gate is the first to flip it.
  shipping-equivalence-gate:
    name: shipping-equivalence-gate
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest

    # Same Postgres + Kafka service containers as payment-equivalence-gate --
    # shipping-service's payment.captured consumer and outbox relay are a
    # real Kafka round trip, not a Kafka-free lane.
    services:
      postgres:
        image: docker.io/library/postgres:18.6-alpine
        env:
          POSTGRES_DB: monolith
          POSTGRES_USER: monolith
          POSTGRES_PASSWORD: monolith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U monolith -d monolith"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      kafka:
        image: docker.io/apache/kafka:4.3.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
          KAFKA_NUM_PARTITIONS: 3
          KAFKA_DEFAULT_REPLICATION_FACTOR: 1
          KAFKA_MIN_INSYNC_REPLICAS: 1
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 30s

    env:
      DATABASE_URL: postgresql://monolith:monolith@localhost:5432/monolith
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      LOG_DIR: logs

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Proto drift guard -- vendored inventory ACL proto must match the canonical one
        # Same guard as inventory-equivalence-gate/payment-equivalence-gate:
        # this gate also brings up inventory-service (choreographed payment
        # still reserves over gRPC underneath the orchestrated shipping
        # saga), so the same drift class would bite it too.
        run: bash scripts/check-proto-drift.sh

      - name: Install uv (pinned) + Python 3.14
        uses: astral-sh/setup-uv@v10.3.0   # no floating v10 tag; pin exact
        with:
          version: "0.13.1"            # decisions.md version matrix: uv 0.13.1
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            examples/00-monolith/uv.lock
            examples/01-strangler-proxy/uv.lock
            examples/04-inventory-service/uv.lock
            examples/05-payment-service/uv.lock
            examples/06-shipping-service/uv.lock

      - name: uv sync (monolith)
        working-directory: examples/00-monolith
        run: uv sync --locked --group dev

      - name: uv sync (strangler proxy)
        working-directory: examples/01-strangler-proxy
        run: uv sync --locked --group dev

      - name: uv sync (inventory service)
        working-directory: examples/04-inventory-service
        run: uv sync --locked --group dev

      - name: uv sync (payment service)
        working-directory: examples/05-payment-service
        run: uv sync --locked --group dev

      - name: uv sync (shipping service)
        working-directory: examples/06-shipping-service
        run: uv sync --locked --group dev

      - name: Migrate + seed the monolith's database
        working-directory: examples/00-monolith
        run: |
          set -euo pipefail
          uv run python manage.py migrate
          uv run python manage.py seed

      - name: Migrate + seed inventory-service's own `inventory` schema
        working-directory: examples/04-inventory-service
        run: uv run alembic upgrade head

      - name: Migrate payment-service's own `payment` schema
        working-directory: examples/05-payment-service
        run: uv run alembic upgrade head

      - name: Migrate shipping-service's own `shipping` schema
        working-directory: examples/06-shipping-service
        run: uv run alembic upgrade head

      - name: Start the inventory-service (uvicorn) on :8084 -- gRPC on :9004
        working-directory: examples/04-inventory-service
        run: |
          mkdir -p logs
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8084 > uvicorn.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the inventory-service's gRPC server to be listening on :9004
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8084/health" | grep -q '"grpcServerListening":true'; then
              echo "inventory-service's gRPC server is listening."
              exit 0
            fi
            sleep 2
          done
          echo "inventory-service's gRPC server never came up." >&2
          curl -sf "http://localhost:8084/health" || true
          exit 1

      - name: Start the payment-service (uvicorn) on :8085 -- consumer + outbox relay run from its lifespan
        working-directory: examples/05-payment-service
        env:
          DATABASE_URL: postgresql://monolith:monolith@localhost:5432/monolith
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          mkdir -p logs
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8085 > uvicorn.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the payment-service's Kafka consumer to be assigned on :8085
        # GET /health reports consumerPartitionsAssigned AND
        # refundConsumerPartitionsAssigned -- payment-service's lifespan runs
        # BOTH the order.placed consumer and the shipment.failed refund
        # consumer, plus its own outbox relay. Waiting on both assignment
        # flags avoids a choreographed checkout, or a shipment-failure
        # refund, racing either consumer's group-join.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            body="$(curl -sf "http://localhost:8085/health" || true)"
            if grep -q '"consumerPartitionsAssigned":true' <<<"$body" \
                && grep -q '"refundConsumerPartitionsAssigned":true' <<<"$body"; then
              echo "payment-service's consumers have partitions assigned."
              exit 0
            fi
            sleep 2
          done
          echo "payment-service's consumers never got partitions assigned." >&2
          curl -sf "http://localhost:8085/health" || true
          exit 1

      - name: Start the shipping-service (uvicorn) on :8087 -- payment.captured consumer + relay + crash-resume scan run from its lifespan
        working-directory: examples/06-shipping-service
        env:
          DATABASE_URL: postgresql://monolith:monolith@localhost:5432/monolith
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          MONOLITH_BASE_URL: http://localhost:8000
        run: |
          mkdir -p logs
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8087 > uvicorn.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the shipping-service's Kafka consumer + crash-resume scan on :8087
        # GET /health reports consumerPartitionsAssigned AND resumeComplete
        # (app/main.py) -- the crash-resume scan runs BEFORE the lifespan
        # reports ready, so waiting on both flags avoids a checkout's
        # payment.captured event racing either the consumer's group-join or
        # an in-flight saga this instance is still resuming from a prior
        # process.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            body="$(curl -sf "http://localhost:8087/health" || true)"
            if grep -q '"consumerPartitionsAssigned":true' <<<"$body" \
                && grep -q '"resumeComplete":true' <<<"$body"; then
              echo "shipping-service's consumer is assigned and crash-resume is complete."
              exit 0
            fi
            sleep 2
          done
          echo "shipping-service never reported ready." >&2
          curl -sf "http://localhost:8087/health" || true
          exit 1

      - name: Start the monolith (gunicorn) on :8000 -- INVENTORY_MODE=grpc, PAYMENT_MODE=choreographed, SHIPPING_MODE=orchestrated
        working-directory: examples/00-monolith
        env:
          INVENTORY_MODE: grpc
          INVENTORY_GRPC_TARGET: localhost:9004
          PAYMENT_MODE: choreographed
          SHIPPING_MODE: orchestrated
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          mkdir -p logs
          nohup uv run gunicorn config.wsgi -b 0.0.0.0:8000 > gunicorn.out.log 2>&1 &
          echo $! > gunicorn.pid

      - name: Wait for the monolith to be ready on :8000
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8000/api/orders" > /dev/null; then
              echo "Monolith is up."
              exit 0
            fi
            sleep 2
          done
          echo "Monolith did not become ready in time." >&2
          exit 1

      - name: Start the monolith's outbox relay, order.placed self-consumer, and order saga listener
        # Same env as the monolith's gunicorn process -- all three background
        # `manage.py` commands need SHIPPING_MODE=orchestrated visible too,
        # since order_saga_listener now also reacts to
        # shipment.dispatched/shipment.failed (same listener process
        # payment-equivalence-gate already starts for payment.captured/
        # payment.declined).
        working-directory: examples/00-monolith
        env:
          INVENTORY_MODE: grpc
          INVENTORY_GRPC_TARGET: localhost:9004
          PAYMENT_MODE: choreographed
          SHIPPING_MODE: orchestrated
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          nohup uv run python manage.py outbox_relay > relay.out.log 2>&1 &
          echo $! > relay.pid
          nohup uv run python manage.py order_placed_consumer > consumer.out.log 2>&1 &
          echo $! > consumer.pid
          nohup uv run python manage.py order_saga_listener > saga.out.log 2>&1 &
          echo $! > saga.pid

      - name: Start the strangler proxy (uvicorn) on :8888 -- inventory/payment/shipping flags ON
        # Only the flags for services THIS gate actually starts are enabled,
        # same scoping as payment-equivalence-gate -- STRANGLER_REVIEW_ENABLED
        # and STRANGLER_NOTIFICATION_ENABLED stay unset, so /api/reviews and
        # /api/notifications still fall through to STRANGLER_MONOLITH_BASE_URL
        # unchanged.
        working-directory: examples/01-strangler-proxy
        env:
          STRANGLER_INVENTORY_ENABLED: 'true'
          STRANGLER_PAYMENT_ENABLED: 'true'
          STRANGLER_SHIPPING_ENABLED: 'true'
          STRANGLER_MONOLITH_BASE_URL: http://localhost:8000
          STRANGLER_INVENTORY_BASE_URL: http://localhost:8084
          STRANGLER_PAYMENT_BASE_URL: http://localhost:8085
          STRANGLER_SHIPPING_BASE_URL: http://localhost:8087
        run: |
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8888 > uvicorn.out.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for the strangler proxy to be ready on :8888
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8888/api/orders" > /dev/null; then
              echo "Proxy is up."
              exit 0
            fi
            sleep 2
          done
          echo "Proxy did not become ready in time." >&2
          exit 1

      - name: Set up Node (for newman)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install newman
        run: npm install -g newman@6.2.2   # pin: decisions.md version matrix

      - name: Run the behavior-equivalence suite through the proxy -- fully-orchestrated
        # THE GATE: the whole collection runs (no --folder restriction), with
        # checkout-time reserve/release over gRPC, payment charged
        # asynchronously by payment-service, and shipping driven by
        # shipping-service's saga off payment.captured. The bounded-wait
        # polls (Scenario 1/3/4's *c steps) already tolerate the
        # PENDING -> AWAITING_SHIPMENT -> CONFIRMED path (NON_TERMINAL_STATUSES
        # includes AWAITING_SHIPMENT) and converge to a real terminal status
        # over genuine Kafka round trips through payment-service AND
        # shipping-service and back through order_saga_listener. Payment
        # Context Contract, Inventory Context Contract, and Shipping Context
        # Contract are all exercised for real (all three --env-var guards
        # set). Review Context Contract passes via the monolith's own
        # unchanged /api/reviews. Notification Context Contract stays an
        # inert, self-guarding no-op (no --env-var
        # notificationContractEnabled=true passed).
        run: |
          newman run tooling/newman/mea.postman_collection.json \
            -e tooling/newman/proxy.postman_environment.json \
            --env-var paymentContractEnabled=true \
            --env-var inventoryContractEnabled=true \
            --env-var shippingContractEnabled=true

      - name: Kill the shipping-service (for the negative check)
        # THE HONESTY PROOF: with the stack otherwise unchanged and still
        # fully-orchestrated, kill shipping-service. A checkout still returns
        # 202/PENDING and payment still captures (neither needs
        # shipping-service), so the order advances to AWAITING_SHIPMENT --
        # but there is no longer anything to run the shipping saga, so the
        # order must get stuck AWAITING_SHIPMENT rather than falsely
        # resolving CONFIRMED.
        working-directory: examples/06-shipping-service
        run: |
          if [ -f uvicorn.pid ]; then kill "$(cat uvicorn.pid)" || true; fi

      - name: Negative check -- stuck-AWAITING_SHIPMENT honesty, shipping-service down must go RED
        # Inverted: the STEP passes only when newman FAILS (non-zero exit).
        # Scenario 1's own bounded-wait poll (1c, 20 x 750ms, ~15s budget) is
        # the poll budget here -- no outer retry loop needed. The order stays
        # AWAITING_SHIPMENT for the whole budget (NON_TERMINAL_STATUSES
        # tolerates it, but the poll's terminal-CONFIRMED assertion still
        # fails once the budget is exhausted), so newman exits non-zero. If
        # newman exits zero, the cutover is not real (the stack is reporting
        # a false CONFIRMED with no shipping saga ever run), so fail the job.
        run: |
          if newman run tooling/newman/mea.postman_collection.json \
              -e tooling/newman/proxy.postman_environment.json \
              --folder "Scenario 1 — Happy-Path Checkout" \
              --env-var paymentContractEnabled=true \
              --env-var inventoryContractEnabled=true \
              --env-var shippingContractEnabled=true; then
            echo "::error::Negative check failed: newman passed (exit 0) with shipping-service down; expected a RED run (order stuck AWAITING_SHIPMENT)." >&2
            exit 1
          fi
          echo "Negative check OK: newman correctly exited non-zero with shipping-service down (order stuck AWAITING_SHIPMENT)."

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "::group::examples/00-monolith/logs/monolith.log"
          cat examples/00-monolith/logs/monolith.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/00-monolith/gunicorn.out.log"
          cat examples/00-monolith/gunicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/00-monolith/relay.out.log"
          cat examples/00-monolith/relay.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/00-monolith/consumer.out.log"
          cat examples/00-monolith/consumer.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/00-monolith/saga.out.log"
          cat examples/00-monolith/saga.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/04-inventory-service/logs/inventory-service.log"
          cat examples/04-inventory-service/logs/inventory-service.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/04-inventory-service/uvicorn.out.log"
          cat examples/04-inventory-service/uvicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/05-payment-service/logs/payment-service.log"
          cat examples/05-payment-service/logs/payment-service.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/05-payment-service/uvicorn.out.log"
          cat examples/05-payment-service/uvicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/06-shipping-service/logs/shipping-service.log"
          cat examples/06-shipping-service/logs/shipping-service.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/06-shipping-service/uvicorn.out.log"
          cat examples/06-shipping-service/uvicorn.out.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::examples/01-strangler-proxy/uvicorn.out.log"
          cat examples/01-strangler-proxy/uvicorn.out.log 2>/dev/null || true
          echo "::endgroup::"

      - name: Stop the monolith, its background commands, shipping-service, payment-service, inventory-service, and proxy
        if: always()
        run: |
          for pidfile in \
            examples/00-monolith/gunicorn.pid \
            examples/00-monolith/relay.pid \
            examples/00-monolith/consumer.pid \
            examples/00-monolith/saga.pid \
            examples/06-shipping-service/uvicorn.pid \
            examples/05-payment-service/uvicorn.pid \
            examples/04-inventory-service/uvicorn.pid \
            examples/01-strangler-proxy/uvicorn.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" || true
            fi
          done

  # The one check the ruleset requires. Passes when every needed job
  # succeeded or was skipped by `changes`.
  code-ci-ok:
    name: code-ci-ok
    if: always()
    needs: [changes, monolith-equivalence-gate, review-equivalence-gate, notification-equivalence-gate, inventory-equivalence-gate, payment-equivalence-gate, shipping-equivalence-gate]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' <<<"$NEEDS"
