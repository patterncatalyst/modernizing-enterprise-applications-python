# OpenShift Service Mesh 3 (Sail operator), cluster-wide in
# openshift-operators. Pinned: installPlanApproval Manual + startingCSV, and
# install_operator (lib.sh) approves only the InstallPlan naming this CSV.
# Before each use, re-check the newest CSV in the channel:
#   oc get packagemanifest servicemeshoperator3 -n openshift-marketplace \
#     -o jsonpath='{range .status.channels[*]}{.name}  {.currentCSV}{"\n"}{end}'
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: servicemeshoperator3
  namespace: openshift-operators
  labels:
    app.kubernetes.io/part-of: mea
spec:
  name: servicemeshoperator3
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  channel: stable-3.4
  startingCSV: servicemeshoperator3.v3.4.3
  installPlanApproval: Manual
