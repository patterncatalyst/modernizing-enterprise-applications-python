# Kiali for OSSM 3, cluster-wide in openshift-operators. Pinned:
# installPlanApproval Manual + startingCSV, and install_operator (lib.sh)
# approves only the InstallPlan naming this CSV. Before each use, re-check
# the newest CSV in the channel:
#   oc get packagemanifest kiali-ossm -n openshift-marketplace \
#     -o jsonpath='{range .status.channels[*]}{.name}  {.currentCSV}{"\n"}{end}'
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: kiali-ossm
  namespace: openshift-operators
  labels:
    app.kubernetes.io/part-of: mea
spec:
  name: kiali-ossm
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  channel: stable
  startingCSV: kiali-operator.v2.27.5
  installPlanApproval: Manual
