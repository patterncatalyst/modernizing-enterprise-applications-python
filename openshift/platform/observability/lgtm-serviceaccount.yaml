# lgtm-serviceaccount.yaml -- the otel-lgtm Pod's identity and SCC grant,
# applied by install-infra.sh (so the anyuid binding exists before
# install-observability.sh needs it) and re-applied, idempotently, by
# install-observability.sh itself.
#
# anyuid, not restricted-v2: the grafana/otel-lgtm:0.36.0 image's startup
# script (run-all.sh) writes to paths it expects to own as root (Grafana's
# /otel-lgtm/grafana data dir, Loki/Tempo/Mimir state under /data) -- the
# ONLY exception to restricted-v2 in this topology (DRQ-107), and ONLY
# `runAsUser: 0` is set on its container, deliberately with NO
# seccompProfile (adding one flips admission back to restricted-v2 and the
# write fails again).
#
# The Prometheus receiver in otelcol-configmap.yaml's `prometheus/
# istio-mesh` job does Kubernetes service-discovery of pods in this
# namespace to find istio-proxy sidecars to scrape -- the ClusterRole below
# grants that, scoped to this namespace by the RoleBinding (not a
# ClusterRoleBinding).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lgtm
  labels:
    app.kubernetes.io/name: lgtm
    app.kubernetes.io/part-of: mea
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mea-lgtm-prometheus-sd
  labels:
    app.kubernetes.io/name: lgtm
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mea-lgtm-prometheus-sd
  labels:
    app.kubernetes.io/name: lgtm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mea-lgtm-prometheus-sd
subjects:
  - kind: ServiceAccount
    name: lgtm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lgtm-anyuid
  labels:
    app.kubernetes.io/name: lgtm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: lgtm
