# lgtm-deployment.yaml -- the all-in-one grafana/otel-lgtm image (Collector
# + Tempo + Loki + Mimir + Grafana in one container), same image/tag as
# deploy/k8s/observability/lgtm-deployment.yaml (ch.30, minikube), ported to
# the platform tier here instead of the core Helm chart -- it is optional,
# install-observability.sh-only infrastructure, not part of the live-core
# topology deploy.sh renders by default.
#
# NO `istio.io/rev` label on the pod template -- this is the observability
# backend, deliberately unmeshed, same reasoning as postgres/kafka: a meshed
# backend would wrap its own OTLP ingest in mTLS and collide with both the
# app-level OTel exporters and Istio's own trace-export client, both of
# which dial it in plaintext.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  labels:
    app.kubernetes.io/name: lgtm
    app.kubernetes.io/part-of: mea
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lgtm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lgtm
        app.kubernetes.io/part-of: mea
    spec:
      serviceAccountName: lgtm
      containers:
        - name: lgtm
          image: docker.io/grafana/otel-lgtm:0.36.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: grafana
              containerPort: 3000
            - name: prometheus
              containerPort: 9090
            - name: loki
              containerPort: 3100
            - name: tempo
              containerPort: 3200
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: otelcol-config
              mountPath: /otel-lgtm/otelcol-config.yaml
              subPath: otelcol-config.yaml
            - name: grafana-datasources
              mountPath: /otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml
              subPath: datasources.yaml
          # anyuid, runAsUser: 0 ONLY -- the one exception to restricted-v2
          # in this topology (DRQ-107). No seccompProfile: setting one here
          # flips admission back to restricted-v2 and the image's
          # root-owned writes under /otel-lgtm /data fail again.
          securityContext:
            runAsUser: 0
      volumes:
        - name: otelcol-config
          configMap:
            name: lgtm-otelcol-config
        - name: grafana-datasources
          configMap:
            name: lgtm-grafana-datasources
