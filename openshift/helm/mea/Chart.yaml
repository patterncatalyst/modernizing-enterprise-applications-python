apiVersion: v2
name: mea
description: >-
  The modernized Django-to-FastAPI system (strangler proxy + six extracted
  bounded contexts + GraphQL gateway, with Postgres and KRaft Kafka) deployed
  to OpenShift. The OpenShift counterpart to deploy/k8s/ (the minikube path,
  ch.29/30) -- same eight-workload topology, but Routes for ingress, the
  exposed internal image registry for images, and SCCs instead of a pinned
  UID. See ch.33, Appendix A: Deploying to OpenShift.
type: application
version: 1.0.0
appVersion: "1.0"
keywords:
  - fastapi
  - strangler-fig
  - openshift
maintainers:
  - name: patterncatalyst
