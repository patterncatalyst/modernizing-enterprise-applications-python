{{- $dns := include "mea.dns" . -}}
# Dev-only Postgres credential -- the Helm port of
# deploy/k8s/base/app-secret.yaml. Republishes the repo's existing demo
# credential (compose.yaml/.env.example: POSTGRES_USER=monolith,
# POSTGRES_PASSWORD=monolith, POSTGRES_DB=monolith) as a Secret the
# Deployments and the bootstrap Job secretKeyRef instead of hardcoding it a
# second time. `database-url` is the single connection string every one of
# the six DB-backed services (review-/notification-/inventory-/payment-/
# shipping-/order-service) consumes via DATABASE_URL -- see
# configmap-app.yaml's header for why there is exactly one value, not six.
#
# PRODUCTION: a real deployment never ships credentials this way. Replace
# with a SealedSecret (bitnami-labs/sealed-secrets) or an ExternalSecret
# (external-secrets.io, synced from Vault/Bitwarden/a cloud secret manager).
apiVersion: v1
kind: Secret
metadata:
  name: mea-postgres-app
  labels:
    {{- include "mea.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
  database-url: "postgresql://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@postgres.{{ $dns }}:5432/{{ .Values.postgres.database }}"
