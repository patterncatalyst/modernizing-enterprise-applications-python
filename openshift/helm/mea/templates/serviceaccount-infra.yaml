# The infra StatefulSets (postgres, kafka) run under this ServiceAccount,
# which is granted the `nonroot-v2` SCC so their upstream images can keep
# the specific non-root UIDs they require (postgres 70, kafka 1000).
# OpenShift's default `restricted-v2` SCC would otherwise overwrite those
# with a random namespace UID and the images' data-dir ownership
# assumptions would break.
#
# The grant works by RoleBinding the SA to the cluster role OpenShift
# auto-generates for every SCC: `system:openshift:scc:<scc-name>`, whose
# single `use` permission on that SCC is what admission checks. (CLI
# equivalent: `oc adm policy add-scc-to-user {{ .Values.infra.scc }} -z {{ .Values.infra.serviceAccountName }}`.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.infra.serviceAccountName }}
  labels:
    {{- include "mea.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.infra.serviceAccountName }}-scc
  labels:
    {{- include "mea.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:{{ .Values.infra.scc }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.infra.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
