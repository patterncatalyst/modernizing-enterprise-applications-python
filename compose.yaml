# compose.yaml — r01 walking-skeleton local infra/observability stack
#
# Python sibling of ~/Dev/modernizing-enterprise-applications. Docker-primary,
# podman-compatible: this file uses only the plain Compose Specification (no
# engine-specific keys), so either engine's compose plugin parses it:
#
#   docker compose --env-file .env up -d
#   podman compose --env-file .env up -d
#   docker compose ps
#   docker compose down            # keep volumes
#   docker compose down -v         # wipe volumes (fresh Kafka/Postgres state)
#
# Never the legacy hyphenated `docker-compose` v1 binary.
#
# r07 DECOMMISSION: this file never ran any application process (monolith or
# otherwise) as a compose service — every app process in this project is
# started directly (`uv run uvicorn ...` / `uv run python manage.py
# runserver ...`), not containerized here; this file is infra-only (the
# database, the broker, the CDC transition tool, the observability backend).
# `examples/00-monolith` is now FROZEN (see its own README.md) and is no
# longer started by `scripts/`/`demos/` as part of the live topology — every
# bounded context it used to serve now has its own extracted service
# (`examples/02`-`08`), fronted by `examples/01-strangler-proxy`'s flagless
# edge router. Postgres below is unchanged: every extracted service (plus,
# if ever rebooted in break-glass mode, the frozen monolith) still connects
# to the SAME instance, each owning its own schema.
#
# Services:
#   - postgres : the shared Postgres instance every service (frozen monolith
#                included, if rebooted) connects to at
#                postgresql://monolith:monolith@localhost:5432/monolith,
#                each owning its own schema. r01's only infra dependency.
#                infra/db/init/00-init.sql provisions the extensions the
#                first Flyway/Alembic migration will want; the `monolith`
#                db/user themselves come from the POSTGRES_DB/POSTGRES_USER/
#                POSTGRES_PASSWORD env vars below, which the official image
#                creates automatically on first start (empty volume) before
#                running anything in /docker-entrypoint-initdb.d/.
#   - kafka    : single-broker KRaft-mode Kafka (no ZooKeeper). NOT needed by
#                the r01 monolith — present now so later iterations' event-
#                driven extractions (mirroring the Java book's r04+) have a
#                broker to target without a second infra PR. Env block is
#                ported verbatim from the Java repo's compose.yaml, which is
#                health-tuned (advertised listeners, controller quorum,
#                replication factors) for a single-node KRaft cluster.
#   - lgtm     : grafana/otel-lgtm — Grafana + Tempo + Mimir + Loki + an
#                embedded OTel Collector (config replaced by
#                infra/otelcol/config.yaml). NOT needed by the r01 monolith
#                either — present now so instrumentation added in later
#                iterations has a backend to send to immediately.
#   - connect  : Kafka Connect running the Debezium Postgres connector
#                (r04, inventory extraction — DRQ-040 sibling). This is
#                TRANSITION-ONLY infrastructure: a one-time CDC backfill
#                that streams the monolith's shared public.inventory_items
#                table into examples/04-inventory-service's OWN schema
#                during the extraction window, then is RETIRED
#                (scripts/retire-debezium.sh) once cutover completes — see
#                infra/debezium/README.md. NOT part of the CI equivalence
#                gate; the running system does not depend on it after
#                cutover. REST API on host port
#                ${CONNECT_HOST_PORT:-8086}, NOT 8083.
#
# postgres also gained a logical-replication `command:` at r04 (below) so
# Debezium can tail its WAL via pgoutput — requires a container restart to
# take effect; existing data in the postgres-data volume survives.
#
# apicurio : ch.28 (DRQ-038 follow-up, DRQ-076) Avro + Apicurio Schema
#            Registry service, used ONLY by examples/09-schema-registry-demo
#            -- a DEMONSTRATOR, additive to the live topology. No other
#            service in this stack (examples/00 through examples/08, the
#            strangler proxy, or any Newman contract suite -- DRQ-036/038)
#            depends on it, reads from it, or has its JSON event flows
#            touched by it in any way. Mirrors the Java sibling's
#            compose.yaml apicurio block (same image, same in-memory H2
#            storage, same healthcheck shape).
#
# Image tags are pinned once in .env (gitignored) / .env.example (tracked).
# Re-verify tags with `skopeo list-tags` before bumping — see .env.example's
# header for the verification date and method.

services:
  # ─── Postgres — the monolith's database ─────────────────────────────────
  postgres:
    image: docker.io/library/postgres:${POSTGRES_IMAGE_TAG}
    container_name: meap-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    # LOGICAL replication (r04, CDC backfill — see infra/debezium/README.md)
    # — required for the Debezium Postgres connector to tail the WAL via
    # pgoutput. Enabling this needs a container RESTART to take effect
    # (handled automatically by `docker compose up -d`); the postgres-data
    # named volume persists across it, so existing data is not lost.
    # max_replication_slots/max_wal_senders=4 leaves headroom beyond the
    # single `meap_inventory_slot` this stack currently uses.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    volumes:
      - postgres-data:/var/lib/postgresql:Z
      - ./infra/db/init:/docker-entrypoint-initdb.d:Z
    mem_limit: 1g
    healthcheck:
      # -h 127.0.0.1: TCP, not the Unix socket. The image's initdb phase runs
      # a temporary server on the socket only and then restarts, so a socket
      # probe can report ready before the real server listens.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ─── Kafka (KRaft mode, single broker) — present for later iterations ───
  kafka:
    image: docker.io/apache/kafka:${KAFKA_IMAGE_TAG}
    container_name: meap-kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"   # PLAINTEXT for clients on the host
      - "9094:9094"                        # PLAINTEXT for clients inside the compose network
    environment:
      # KRaft mode — broker + controller roles combined, single node.
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,DOCKER://0.0.0.0:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,DOCKER://kafka:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_MIN_INSYNC_REPLICAS=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - CLUSTER_ID=${KAFKA_CLUSTER_ID}
    volumes:
      - kafka-data:/var/lib/kafka/data:Z
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ─── Kafka Connect (Debezium Postgres connector) — CDC, r04, DRQ-040 ────
  # Standalone Kafka Connect distributed-mode worker running the Debezium
  # Postgres connector image. Registration (idempotent create-or-update) is
  # a separate step — see scripts/register-debezium.sh — not baked into
  # this compose file, so the connector config
  # (infra/debezium/inventory-connector.json) can evolve without a
  # container rebuild. Image lives on quay.io: Debezium does not publish to
  # Docker Hub.
  connect:
    image: quay.io/debezium/connect:${CONNECT_IMAGE_TAG}
    container_name: meap-connect
    ports:
      - "${CONNECT_HOST_PORT:-8086}:8083"   # host 8086 (NOT 8083 — notification-service binds :8083 locally); container always binds 8083
    environment:
      - BOOTSTRAP_SERVERS=kafka:9094
      - GROUP_ID=meap-connect-cluster
      - CONFIG_STORAGE_TOPIC=meap-connect-configs
      - OFFSET_STORAGE_TOPIC=meap-connect-offsets
      - STATUS_STORAGE_TOPIC=meap-connect-status
      - CONFIG_STORAGE_REPLICATION_FACTOR=1
      - OFFSET_STORAGE_REPLICATION_FACTOR=1
      - STATUS_STORAGE_REPLICATION_FACTOR=1
      # Bound the heap. Without HEAP_OPTS, connect-distributed.sh defaults
      # to -Xmx2G inside this container's memory limit; 3.7.0.Final scans
      # many connector plugins at boot, the heap grows past the cgroup
      # limit, and the kernel OOM-kills the worker in a restart loop.
      - HEAP_OPTS=-Xms256m -Xmx768m
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # 768m heap + metaspace/threads/direct buffers.
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s
    restart: unless-stopped

  # ─── Observability backend — present for later iterations ───────────────
  lgtm:
    image: docker.io/grafana/otel-lgtm:${LGTM_IMAGE_TAG}
    container_name: meap-lgtm
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (preferred — see the lgtm-docker-stack skill's otlp-endpoints reference)
      # Prometheus query + OTLP metrics ingest. Host port 19090, not 9090:
      # Cockpit owns 9090 on Fedora Server and RHEL.
      - "${PROMETHEUS_HOST_PORT:-19090}:9090"
      - "3100:3100"   # Loki
      - "3200:3200"   # Tempo
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./infra/otelcol/config.yaml:/otel-lgtm/otelcol-config.yaml:Z
      # Mounted over the image's own default provisioning filename so ours
      # wins the uid collision (see infra/grafana/datasources.yaml's header).
      - ./infra/grafana/datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml:Z
    mem_limit: 2g
    # NOTE: the otel-lgtm image does not ship wget; curl IS present.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # ─── Apicurio Schema Registry — examples/09-schema-registry-demo ONLY ────
  # ch.28 (DRQ-038 follow-up, DRQ-076): an Avro + Apicurio Schema Registry
  # DEMONSTRATOR. BLAST RADIUS: used exclusively by
  # examples/09-schema-registry-demo, which publishes a field-for-field
  # Avro mirror of order.placed to its OWN order.events.avro.demo topic to
  # teach schema registration + BACKWARD-compatibility evolution checking.
  # The live JSON event flows (examples/00-monolith through
  # examples/07-order-service, DRQ-036/038) are completely UNCHANGED by
  # this service's presence — nothing else in this compose file, no Newman
  # contract suite, and no other example reads from or depends on it.
  # APICURIO_STORAGE_KIND=sql / APICURIO_STORAGE_SQL_KIND=h2: in-memory
  # (embedded H2), ephemeral, wiped on every container restart — no
  # external dependency, matching the Java sibling's identical compose.yaml
  # block.
  apicurio:
    image: quay.io/apicurio/apicurio-registry:${APICURIO_IMAGE_TAG}
    container_name: meap-apicurio
    ports:
      - "${APICURIO_HOST_PORT:-8095}:8080"
    environment:
      - APICURIO_STORAGE_KIND=sql
      - APICURIO_STORAGE_SQL_KIND=h2
    mem_limit: 512m
    healthcheck:
      # Apicurio Registry 3.3 serves health on the management interface
      # (container port 9000, not published here); /health/ready on 8080
      # is a 404.
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:

networks:
  default:
    name: meap-infra
