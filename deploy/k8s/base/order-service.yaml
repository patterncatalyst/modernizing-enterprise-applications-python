# order-service -- owns its own `order_svc` Postgres schema, 5-table CQRS
# model (examples/07-order-service, the LAST extraction). `placeOrder`
# writes `order.placed` to its own transactional outbox (relayed by
# `app/relay.py::OutboxRelay`); FOUR reactions
# (`handle_payment_captured`/`handle_payment_declined`/
# `handle_shipment_dispatched`/`handle_shipment_failed`) consume
# `payment.captured`/`payment.declined`/`shipment.dispatched`/
# `shipment.failed` on ONE consumer group (`app/consumer.py::OrderSagaConsumer`)
# -- the exact four topics the monolith's own `order_saga_listener` used to
# subscribe to in one group. Also a gRPC CLIENT of inventory-service
# (`INVENTORY_GRPC_TARGET`, never a listener -- no second port). `alembic
# upgrade head` runs as the container's own startup command, seeding
# customers Ada/Grace idempotently.
#
# Graceful shutdown: the WIDEST fan-in of any service in this topology --
# FOUR inbound Kafka channels in one consumer group plus the outbox relay's
# one outgoing channel, five channels total on one process. Longer
# terminationGracePeriodSeconds + a short preStop sleep give the consumer
# group time to commit offsets and leave the group cleanly (avoiding a
# rebalance storm) before SIGTERM reaches the process; every other
# Kafka-consuming service here has at most one inbound channel and a shorter
# grace period.
#
# HTTP_PORT/CONSUMER_GROUP set directly (see notification-service.yaml's
# comment). INVENTORY_GRPC_TARGET/OUTBOX_POLL_MS/topic names come from the
# shared ConfigMap.
#
# Health: `/health` -- httpGet probes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: mea
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: mea
    app.kubernetes.io/component: bounded-context
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/part-of: mea
        app.kubernetes.io/component: bounded-context
    spec:
      # Widest fan-in in this topology (four inbound Kafka channels on one
      # consumer group + the outbox relay's outgoing channel) -- see header
      # comment. 60s total grace + a 15s preStop sleep so the consumer group
      # can commit offsets and leave cleanly before SIGTERM.
      terminationGracePeriodSeconds: 60
      containers:
        - name: order-service
          image: mea/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
          envFrom:
            - configMapRef:
                name: mea-app-config
          env:
            - name: HTTP_PORT
              value: "8088"
            - name: CONSUMER_GROUP
              value: "order-service"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mea-postgres-app
                  key: database-url
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 320Mi
            limits:
              cpu: 600m
              memory: 640Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: mea
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: mea
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order-service
  ports:
    - name: http
      port: 8088
      targetPort: http
