# inventory-service -- owns its own `inventory` Postgres schema
# (examples/04-inventory-service). Two protocol surfaces, two ports, one
# process: HTTP read surface (:8084) and a separate gRPC server (:9004, the
# order<->inventory ACL contract -- CheckStock/Reserve/Release/GetStock).
# `alembic upgrade head` runs as the container's own startup command,
# seeding the 3 demo skus idempotently before uvicorn binds.
#
# INVENTORY_CDC_ENABLED/_TOPIC/_GROUP (transition-only CDC consumer, OFF by
# default) come from the shared ConfigMap. HTTP_PORT/GRPC_PORT are set
# directly here (the shared-ConfigMap `HTTP_PORT` key would collide with
# every other HTTP_PORT-reading service's own distinct port need).
#
# Health: `/health` reports `grpcServerListening` once the gRPC server has
# bound :9004 -- httpGet probes on the HTTP port (:8084) cover both
# surfaces becoming ready together.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: mea
  labels:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/part-of: mea
    app.kubernetes.io/component: bounded-context
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service
        app.kubernetes.io/part-of: mea
        app.kubernetes.io/component: bounded-context
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: inventory-service
          image: mea/inventory-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
            - name: grpc
              containerPort: 9004
          envFrom:
            - configMapRef:
                name: mea-app-config
          env:
            - name: HTTP_PORT
              value: "8084"
            - name: GRPC_PORT
              value: "9004"
            # r10/ch.30 -- the one per-service OTEL key: OTEL_SDK_DISABLED/
            # OTEL_EXPORTER_OTLP_ENDPOINT/_PROTOCOL come from mea-app-config
            # above (shared, same value for all three instrumented
            # services); OTEL_SERVICE_NAME can't live there since it needs a
            # different value per Deployment.
            - name: OTEL_SERVICE_NAME
              value: "inventory-service"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mea-postgres-app
                  key: database-url
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: mea
  labels:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/part-of: mea
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inventory-service
  ports:
    - name: http
      port: 8084
      targetPort: http
    - name: grpc
      port: 9004
      targetPort: grpc
