# payment-service -- owns its own `payment` Postgres schema (examples/05-
# payment-service). Choreographed: consumes `order.placed` AND
# `shipment.failed` (refund trigger), produces `payment.captured`/
# `payment.declined`/`payment.refunded` via its own transactional outbox +
# its own relay (`app/relay.py`). `alembic upgrade head` runs as the
# container's own startup command.
#
# HTTP_PORT/CONSUMER_GROUP set directly (see notification-service.yaml's
# comment on why these can't live in the shared ConfigMap). OUTBOX_POLL_MS
# comes from the shared ConfigMap (same 1000ms value as shipping-/order-
# service).
#
# Health: `/health` reports consumer partition-assignment -- httpGet probes.
#
# Graceful shutdown: one inbound Kafka channel + the outbox relay's outgoing
# producer; main.py cancels both tasks on shutdown.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: mea
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: mea
    app.kubernetes.io/component: bounded-context
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
        app.kubernetes.io/part-of: mea
        app.kubernetes.io/component: bounded-context
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: payment-service
          image: mea/payment-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: mea-app-config
          env:
            - name: HTTP_PORT
              value: "8085"
            - name: CONSUMER_GROUP
              value: "payment-service"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mea-postgres-app
                  key: database-url
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: mea
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: mea
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payment-service
  ports:
    - name: http
      port: 8085
      targetPort: http
