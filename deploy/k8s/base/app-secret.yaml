# app-secret.yaml -- Postgres credentials for the shared `monolith` server.
#
# DEV-ONLY, PLAINTEXT-IN-GIT SECRET -- NOT FOR PRODUCTION. These are the
# exact demo credentials already pinned in compose.yaml / .env.example
# (POSTGRES_USER=monolith, POSTGRES_PASSWORD=monolith, POSTGRES_DB=monolith)
# and read as the default `DATABASE_URL` by every service's own
# `app/config.py`/`app/db.py`/`config/settings.py`
# (`postgresql://monolith:monolith@localhost:5432/monolith`) -- this object
# republishes that one already-public demo credential as a Kubernetes
# resource so Deployments can `secretKeyRef` it instead of hardcoding it a
# second time; it does not introduce a new secret value.
#
# `database-url` is the single connection string every one of the six
# DB-backed services (review-/notification-/inventory-/payment-/shipping-/
# order-service) consumes via `DATABASE_URL` -- see app-config.yaml's header
# comment for why there is exactly one value here, not six. `username`/
# `password` are the same credentials split out for the Postgres
# StatefulSet's own `POSTGRES_USER`/`POSTGRES_PASSWORD` image env vars
# (infra/postgres-statefulset.yaml).
#
# PRODUCTION: a real deployment never ships credentials this way. A
# production overlay would replace this resource with a SealedSecret
# (bitnami-labs/sealed-secrets) or an ExternalSecret (external-secrets.io,
# synced from Vault/Bitwarden/a cloud secret manager) -- deferred along with
# the rest of the production-hardening pass noted in this tree's README.
apiVersion: v1
kind: Secret
metadata:
  name: mea-postgres-app
  namespace: mea
  labels:
    app.kubernetes.io/part-of: mea
type: Opaque
stringData:
  username: "monolith"
  password: "monolith"
  database-url: "postgresql://monolith:monolith@postgres.mea.svc.cluster.local:5432/monolith"
