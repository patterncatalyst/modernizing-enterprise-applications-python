# strangler-proxy -- the system's single REST edge router (:8888,
# examples/01-strangler-proxy). Flagless as of r07 (DRQ decommission): every
# path prefix routes to exactly one owning backend via the six
# STRANGLER_*_BASE_URL keys in mea-app-config, never to the (now-frozen,
# not-deployed-here) monolith. Stateless -- no database, no Kafka, no
# background task -- so there is nothing to drain on shutdown beyond
# in-flight HTTP requests.
#
# Health: this service carries no `/health` route (confirmed:
# examples/01-strangler-proxy/app -- a Starlette app with only the proxy
# route). Probes use `tcpSocket` on the HTTP port instead of `httpGet`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strangler-proxy
  namespace: mea
  labels:
    app.kubernetes.io/name: strangler-proxy
    app.kubernetes.io/part-of: mea
    app.kubernetes.io/component: edge-router
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: strangler-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strangler-proxy
        app.kubernetes.io/part-of: mea
        app.kubernetes.io/component: edge-router
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: strangler-proxy
          image: mea/strangler-proxy:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8888
          envFrom:
            - configMapRef:
                name: mea-app-config
          env:
            # r10/ch.30 -- the one per-service OTEL key: OTEL_SDK_DISABLED/
            # OTEL_EXPORTER_OTLP_ENDPOINT/_PROTOCOL come from mea-app-config
            # above (shared, same value for all three instrumented
            # services); OTEL_SERVICE_NAME can't live there since it needs a
            # different value per Deployment.
            - name: OTEL_SERVICE_NAME
              value: "strangler-proxy"
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: strangler-proxy
  namespace: mea
  labels:
    app.kubernetes.io/name: strangler-proxy
    app.kubernetes.io/part-of: mea
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: strangler-proxy
  ports:
    - name: http
      port: 8888
      targetPort: http
