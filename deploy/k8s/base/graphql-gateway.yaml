# graphql-gateway -- its OWN front door (:8090, examples/08-graphql-gateway),
# never routed through strangler-proxy. Data-less: no database, no Kafka
# topic, no write path -- a Strawberry GraphQL aggregation gateway
# federating reads across order-/payment-/shipping-/review-service (REST)
# and inventory-service (gRPC `GetStock`). A gRPC CLIENT ONLY -- unlike
# inventory-service there is no second port to expose.
#
# Health: `/health` is liveness-only -- it deliberately never probes a
# downstream (examples/08-graphql-gateway/app/main.py's docstring: a
# downstream outage should fail the GraphQL field that depends on it, not
# this gateway's own liveness/readiness). httpGet probes on :8090 check that
# this process itself is up, nothing more.
#
# No background task, no database, no Kafka consumer -- default-length
# termination grace is enough.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-gateway
  namespace: mea
  labels:
    app.kubernetes.io/name: graphql-gateway
    app.kubernetes.io/part-of: mea
    app.kubernetes.io/component: aggregation-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: graphql-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphql-gateway
        app.kubernetes.io/part-of: mea
        app.kubernetes.io/component: aggregation-gateway
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: graphql-gateway
          image: mea/graphql-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: mea-app-config
          env:
            - name: HTTP_PORT
              value: "8090"
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 75m
              memory: 192Mi
            limits:
              cpu: 300m
              memory: 384Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: graphql-gateway
  namespace: mea
  labels:
    app.kubernetes.io/name: graphql-gateway
    app.kubernetes.io/part-of: mea
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: graphql-gateway
  ports:
    - name: http
      port: 8090
      targetPort: http
